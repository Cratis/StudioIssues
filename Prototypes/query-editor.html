<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studio Query Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: three columns like an IDE. Model tree on the left, the query being edited in the middle,
   generated Screenplay and a live test bench on the right. Teal = visual, amber = live, indigo = C#. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#13212A; --muted:#566772;
  --line:#D5DDE2; --line-strong:#B6C3CB;
  --accent:#0A6B67; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC; --accent-line:#9CCFC9;
  --live:#B84F00; --live-soft:#FBE8D6; --live-dot:#E8751A;
  --code:#3548A8; --code-soft:#E3E8F9; --code-line:#B5C0EC;
  --warn:#7D5200; --warn-soft:#FAF0D4; --bad:#B02A22; --bad-soft:#FBE4E1; --ok:#1C7A44; --ok-soft:#DDF1E4;
  --pane:#F5F8F9; --syn-k:#0A6B67; --syn-s:#9A4D12; --syn-t:#3548A8; --syn-c:#6F808B; --syn-n:#13212A; --syn-f:#7A3E9D; --syn-p:#566772;
  --shadow:0 1px 2px rgba(19,33,42,.06),0 6px 18px rgba(19,33,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1217; --surface:#131D24; --surface-2:#18252E; --ink:#E4ECF1; --muted:#90A3B0;
    --line:#233541; --line-strong:#364B5B;
    --accent:#4CC4BB; --accent-ink:#05201E; --accent-soft:#12302E; --accent-line:#236A64;
    --live:#F5A05A; --live-soft:#3A2411; --live-dot:#F58A2E;
    --code:#93A6F6; --code-soft:#1A2246; --code-line:#33428C;
    --warn:#E8B64F; --warn-soft:#33260A; --bad:#FF8F85; --bad-soft:#3B1613; --ok:#62D08B; --ok-soft:#12301F;
    --pane:#0D161C; --syn-k:#4CC4BB; --syn-s:#F0A56B; --syn-t:#93A6F6; --syn-c:#6C8190; --syn-n:#E4ECF1; --syn-f:#CDA1EE; --syn-p:#90A3B0;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1217; --surface:#131D24; --surface-2:#18252E; --ink:#E4ECF1; --muted:#90A3B0;
  --line:#233541; --line-strong:#364B5B;
  --accent:#4CC4BB; --accent-ink:#05201E; --accent-soft:#12302E; --accent-line:#236A64;
  --live:#F5A05A; --live-soft:#3A2411; --live-dot:#F58A2E;
  --code:#93A6F6; --code-soft:#1A2246; --code-line:#33428C;
  --warn:#E8B64F; --warn-soft:#33260A; --bad:#FF8F85; --bad-soft:#3B1613; --ok:#62D08B; --ok-soft:#12301F;
  --pane:#0D161C; --syn-k:#4CC4BB; --syn-s:#F0A56B; --syn-t:#93A6F6; --syn-c:#6C8190; --syn-n:#E4ECF1; --syn-f:#CDA1EE; --syn-p:#90A3B0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.92em}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.mark{width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border:2px solid var(--accent-ink);border-radius:50%;border-right-color:transparent}
.brand{font:700 16px var(--font-display);letter-spacing:.01em}
.trail{color:var(--muted)}
.proto{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr) 392px;gap:16px;align-items:start}
.shell>*{min-width:0}
@media (max-width:1180px){.shell{grid-template-columns:232px minmax(0,1fr)}.right{grid-column:2}}
@media (max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.right{grid-column:auto}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* tree */
.side{padding:6px 0}
.side-title,.qlist-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-title{padding:10px 14px 4px}
.rm{padding:10px 14px 12px;border-top:1px solid var(--line)}
.rm:first-of-type{border-top:0}
.rm-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rm-name{font:700 16px var(--font-display)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.props{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:3px}
.props li{display:flex;gap:8px;align-items:baseline;font-size:12px;flex-wrap:wrap}
.ptype{color:var(--syn-t);font-family:var(--font-mono);font-size:11px}
.keytag{font-size:10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px}
.qlist-label{margin:12px 0 4px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.qitem{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:6px 8px;min-width:0}
.qitem:hover{background:var(--surface-2)}
.qitem.on{background:var(--accent-soft);border-color:var(--accent-line)}
.qname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.qmark{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.qmark.live{background:var(--live-dot)}
.qmark.cs{background:var(--code);border-radius:2px}
.badge{font-size:10px;font-weight:600;border-radius:4px;padding:0 6px;line-height:17px}
.badge.live{background:var(--live-soft);color:var(--live)}
.badge.cs{background:var(--code-soft);color:var(--code)}
.add{margin-top:8px;width:100%;background:none;border:1px dashed var(--line-strong);border-radius:7px;padding:6px;color:var(--muted)}
.add:hover{color:var(--accent);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* editor */
.main{box-shadow:var(--shadow);overflow:hidden}
.qhead{padding:18px 20px 16px;display:grid;gap:12px}
.crumb{font-size:12px;color:var(--muted)}
.name-input{font:700 28px/1.15 var(--font-display);letter-spacing:-.01em;border:0;border-bottom:1px solid transparent;background:transparent;width:100%;padding:2px 0;border-radius:0}
.name-input:hover{border-bottom-color:var(--line)}
.name-input:focus{outline:0;border-bottom-color:var(--accent)}
textarea.plain,.fld input,.fld select{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;width:100%;min-width:0}
textarea.plain{resize:vertical;display:block}
.contract{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.cgroup{display:grid;gap:3px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 14px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:38px;height:22px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.track::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+.track{background:var(--live-dot)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.sub{font-size:12px;color:var(--muted)}
.head-actions{display:flex;justify-content:flex-end}
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.cs{background:var(--code);border-color:var(--code);color:#fff;font-weight:600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px 9px;font-weight:500;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.tab:hover:not([disabled]){color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab.cs[aria-selected="true"]{border-bottom-color:var(--code)}
.tab[disabled]{opacity:.6;cursor:not-allowed}
.tab .tag{font-size:10px;border-radius:4px;padding:0 6px;line-height:17px;background:var(--line);color:var(--muted)}
.tab.cs .tag{background:var(--code-soft);color:var(--code)}
.tabs .grow{flex:1}
.addcs{align-self:center;margin:4px 0;background:var(--surface);border:1px dashed var(--code-line);color:var(--code);border-radius:8px;padding:4px 12px;font-weight:600}
.addcs:hover{background:var(--code-soft)}
.panel{padding:18px 20px 20px;display:grid;gap:20px}

.sect h3{margin:0 0 2px;font:700 15px var(--font-display)}
.sect .sub{margin:0 0 10px}
.irow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(110px,1fr) minmax(90px,.9fr) auto;gap:10px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);margin-bottom:8px}
.irow.f{grid-template-columns:minmax(120px,1.1fr) minmax(110px,1fr) minmax(120px,1fr) auto auto}
@media (max-width:640px){.irow,.irow.f{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:3px;min-width:0}
.fld>span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.fld.full{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px;background:var(--surface);color:var(--syn-t);min-height:34px}
.icon-btn{background:none;border:1px solid transparent;border-radius:7px;width:34px;height:34px;font-size:18px;color:var(--muted)}
.icon-btn:hover{color:var(--bad);border-color:var(--line-strong)}
.empty{border:1px dashed var(--line-strong);border-radius:9px;padding:10px 12px;color:var(--muted);margin-bottom:8px}
.addbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.addbtn[disabled]{color:var(--muted);cursor:not-allowed}
.policies{display:flex;flex-wrap:wrap;gap:8px}
.pol{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 12px}
.pol[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.diag{margin:0;padding:0 20px 18px;display:grid;gap:6px}
.dg{display:flex;gap:10px;align-items:baseline;border-radius:8px;padding:7px 12px;font-size:13px}
.dg b{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dg.ok{background:var(--ok-soft);color:var(--ok)}
.dg.warn{background:var(--warn-soft);color:var(--warn)}
.dg.err{background:var(--bad-soft);color:var(--bad)}

/* describe */
.ex{display:flex;flex-wrap:wrap;gap:8px}
.exchip{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px}
.exchip:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.engine{font-size:12px;color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted);max-width:68ch}
.verdict{border:1px solid;border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.verdict.fit{background:var(--accent-soft);border-color:var(--accent-line)}
.verdict.cs{background:var(--code-soft);border-color:var(--code-line)}
.verdict h4{margin:0;font:700 16px var(--font-display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px;font-size:12.5px}
.tip{font-size:13px;margin:0;max-width:70ch}
.err-note{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin:0}

/* code */
pre.code{margin:0;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font:12.5px/1.6 var(--font-mono);color:var(--syn-n);tab-size:4}
.k{color:var(--syn-k);font-weight:500}.s{color:var(--syn-s)}.t{color:var(--syn-t)}.c{color:var(--syn-c);font-style:italic}.n{font-weight:500}.f{color:var(--syn-f)}.p{color:var(--syn-p)}.v{color:var(--live)}
.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--code-line);background:var(--code-soft);border-radius:9px;padding:10px 14px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.receives{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cs-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line-strong);border-radius:8px;background:var(--pane);overflow:hidden}
.cs-gut{padding:12px 10px;text-align:right;color:var(--syn-c);font:12.5px/1.6 var(--font-mono);border-right:1px solid var(--line);user-select:none;white-space:pre}
.cs-ed{position:relative;min-width:0;overflow:hidden}
.cs-hl,.cs-ta{margin:0;padding:12px 14px;font:12.5px/1.6 var(--font-mono);white-space:pre;tab-size:4;border:0;letter-spacing:0;word-spacing:0}
.cs-hl{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;color:var(--syn-n)}
.cs-ta{position:relative;display:block;width:100%;min-height:160px;background:transparent;color:transparent;caret-color:var(--ink);resize:none;overflow-x:auto;overflow-y:hidden;outline:0}
.cs-ed:focus-within{box-shadow:inset 0 0 0 2px var(--code-line)}
.cs-ta::selection{background:rgba(120,140,240,.35);color:transparent}
.foot{font-size:12px;color:var(--muted)}

/* right */
.right{display:grid;gap:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 4px;flex-wrap:wrap}
.cardhead h3{margin:0;font:700 15px var(--font-display)}
.cardbody{padding:8px 14px 14px;display:grid;gap:10px}
.args{display:grid;gap:8px}
.live-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--live);background:var(--live-soft);border-radius:99px;padding:2px 10px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--live-dot);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,117,26,.55)}100%{box-shadow:0 0 0 8px rgba(232,117,26,0)}}
.stale{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.res{border-collapse:collapse;width:100%;font-size:12px}
.res th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);padding:6px 10px;white-space:nowrap}
.res td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
.res tr.flash td{animation:flash 2s ease-out}
@keyframes flash{from{background:var(--live-soft)}to{background:transparent}}
.pill{border-radius:99px;padding:0 8px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.s-paid{background:var(--ok-soft);color:var(--ok)}.pill.s-overdue{background:var(--bad-soft);color:var(--bad)}.pill.s-issued{background:var(--code-soft);color:var(--code)}.pill.s-gold{background:var(--live-soft);color:var(--live)}
.muted{color:var(--muted)}
.caption{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:20;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bar">
  <span class="mark" aria-hidden="true"></span>
  <span class="brand">Cratis Studio</span>
  <span class="trail">/ Billing / Queries</span>
  <span class="proto">Prototype</span>
</div>

<div class="shell">
  <aside class="side card" id="tree" aria-label="Read models and queries"></aside>
  <main class="main card" id="editor"></main>
  <div class="right">
    <section class="card" id="sp-card" aria-label="Generated Screenplay"></section>
    <section class="card" id="try-card" aria-label="Try the query"></section>
  </div>
</div>
<div id="toast-host" aria-live="polite"></div>

<script>
(function(){
'use strict';
var FENCE='\x60\x60\x60', TENANT='acme';
var POLICIES=['IsAuthenticated','IsAccountant','Consultant','Administrator'];
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var low=function(s){return s.charAt(0).toLowerCase()+s.slice(1)};

/* ---------- model + sample data ---------- */
var RMS=[
 {name:'Invoice',props:[
  {name:'invoiceId',type:'InvoiceId',key:true},
  {name:'customerId',type:'CustomerId'},
  {name:'customerName',type:'String'},
  {name:'status',type:'InvoiceStatus',values:['draft','issued','overdue','paid']},
  {name:'amount',type:'Decimal'},
  {name:'dueDate',type:'Date'},
  {name:'tenantId',type:'TenantId'}]},
 {name:'Customer',props:[
  {name:'customerId',type:'CustomerId',key:true},
  {name:'name',type:'String'},
  {name:'country',type:'String'},
  {name:'tier',type:'CustomerTier',values:['standard','gold']}]}
];
function inv(id,c,cn,st,am,d,t){return {invoiceId:id,customerId:c,customerName:cn,status:st,amount:am,dueDate:d,tenantId:t||'acme'}}
var DATA={
 Invoice:[
  inv('INV-1001','c-101','Havn & Co','issued',12400,'2026-10-28'),
  inv('INV-1002','c-102','Brygge Bakery','paid',3150,'2026-09-30'),
  inv('INV-1003','c-101','Havn & Co','overdue',8900,'2026-09-12'),

 var props=r.props.map(function(p){return {v:p.name,l:p.name}});
 var id=kind+i;
 if(kind==='by')return '<div class="irow"><label class="fld"><span>Property</span><select data-f="by-prop" id="by-prop">'+opts(props,x.prop)+'</select></label>'
  +'<label class="fld"><span>Input name</span><input data-f="by-name" id="by-name" value="'+esc(x.name)+'" spellcheck="false" autocomplete="off"></label>'
  +'<div class="fld"><span>Type</span><span class="chip mono">'+esc(x.type)+'</span></div>'
  +'<button class="icon-btn" data-act="rm-by" aria-label="Remove find by">&times;</button></div>';
 return '<div class="irow f"><label class="fld"><span>Property</span><select data-f="f-prop" data-i="'+i+'" id="fp'+i+'">'+opts(props,x.prop)+'</select></label>'
  +'<label class="fld"><span>Input name</span><input data-f="f-name" data-i="'+i+'" id="fn'+i+'" value="'+esc(x.name)+'" spellcheck="false" autocomplete="off"></label>'
  +'<label class="fld"><span>Value comes from</span><select data-f="f-from" data-i="'+i+'" id="ff'+i+'">'+opts([{v:'caller',l:'Whoever asks'},{v:'tenant',l:'The current tenant'}],x.from)+'</select></label>'
  +'<label class="switch" style="padding-bottom:6px"><input type="checkbox" data-f="f-opt" data-i="'+i+'" id="fo'+i+'"'+(x.optional&&x.from!=='tenant'?' checked':'')+(x.from==='tenant'?' disabled':'')+'><span class="track"></span><span>Optional</span></label>'
  +'<button class="icon-btn" data-act="rm-filter" data-i="'+i+'" aria-label="Remove narrow by">&times;</button></div>';
}

function designPanel(q){
 var r=rmOf(q.rm),many=q.returns==='many';
 var h='<div class="sect"><h3>Find by</h3><p class="sub">'+(many?'Optional. Use it when the list belongs to one thing, like the comments on a work item.':'The value that points at the one item you want.')+'</p>'
  +(q.by?inputRow('by',q.by,0,r,q):'<div class="empty">'+(many?'Not used. The query returns everything that matches the narrowing below.':'Nothing to find it by yet.')+'</div>')

 h+='<div class="sect"><h3>Narrow by</h3><p class="sub">'+(many?'Keep only items whose property equals the value given. Several rows must all match.':'Narrowing applies to lists. A single item is found with "Find by".')+'</p>'
  +(many?(q.filters.length?q.filters.map(function(f,i){return inputRow('filter',f,i,r,q)}).join(''):'<div class="empty">No narrowing. The query returns every '+esc(q.rm)+'.</div>'):'')
  +'<button class="addbtn" data-act="add-filter"'+(many?'':' disabled')+'>+ Narrow by&hellip;</button></div>';
 h+='<div class="two"><div class="sect"><h3>Whose data</h3><p class="sub">Who the answer is about.</p><label class="fld"><span>Scope</span><select data-f="scope" id="f-scope">'
  +opts([{v:'tenant',l:'Everyone in the current tenant'},{v:'identity',l:'Only the person asking'},{v:'global',l:'All tenants'}],q.scope)+'</select></label></div>'
  +'<div class="sect"><h3>Who can ask</h3><p class="sub">Any of the chosen policies is enough.</p><div class="policies">'

function engineLabel(){return S.engine==='claude'?'Understood by Claude':S.engine==='pending'?'Checking whether Claude is available':'Built-in interpreter. Claude is not available here, so only a limited vocabulary is understood.'}
function proposed(q,res){
 var p=res.q;
 return Object.assign({},q,{name:/^NewQuery/.test(q.name)||!q.name.trim()?p.name:q.name,description:q.description.trim()?q.description:p.description,returns:p.returns,live:p.live,optional:p.optional,by:p.by,filters:p.filters,csharp:res.fits?null:res.csharp});
}

 var c=S.conv[q.id]||{},ex=EX[q.rm]||[];
 var h='<div class="fld full"><label for="f-english" style="display:grid;gap:3px"><span>What should this query find?</span></label>'

  +'<p class="hint">Visual design covers finding one item by a key, narrowing a list by matching values, and live delivery. Sorting, comparisons, text search, fixed values, totals and joins have no visual form, so they become C#.</p>';

  }else{

  }

  +'<div class="cs-wrap"><div class="cs-gut" id="cs-gut" aria-hidden="true"></div><div class="cs-ed"><pre class="cs-hl" id="cs-hl" aria-hidden="true"><code></code></pre>'

function initCs(){
 var q=Q(),ta=$('#cs-ta');if(!ta)return;
 ta.value=q.csharp||'';
 var hl=$('#cs-hl code'),gut=$('#cs-gut'),foot=$('#cs-foot');
 function paint(){
  var src=ta.value;hl.innerHTML=src.split('\n').map(hlCs).join('\n')+'\n';
  var n=src.split('\n').length;var g=[];for(var i=1;i<=n;i++)g.push(i);gut.textContent=g.join('\n');
  foot.textContent=n+(n===1?' line':' lines')+' of C#';
  ta.style.height='auto';ta.style.height=Math.max(160,ta.scrollHeight)+'px';
 }
 function sync(){hl.style.display='block';hl.style.transform='translate('+(-ta.scrollLeft)+'px,0)'}
 ta.addEventListener('input',function(){q.csharp=ta.value;paint();sync();renderSP();renderDiag();renderTree()});
 ta.addEventListener('scroll',sync);
 ta.addEventListener('keydown',function(e){if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();var s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+4;ta.dispatchEvent(new Event('input'))}});
 paint();sync();
}
function renderPanel(){
 var q=Q(),el=$('#panel');
 el.innerHTML=S.tab==='design'?designPanel(q):S.tab==='describe'?describePanel(q):csPanel(q);
 if(S.tab==='csharp')initCs();
 renderDiag();
}

function renderSP(){
 var q=Q();
 $('#sp-card').innerHTML='<div class="cardhead"><h3>Screenplay</h3><button class="btn ghost" data-act="copy">Copy</button></div><div class="cardbody"><pre class="code" id="sp-pre">'+hlSP(screenplay(q))+'</pre><div class="caption">Generated from the editor and read only. This is what lands in the .play file.</div></div>';
}

function runLow(q,args){
 var rows=DATA[q.rm].slice();
 var ps=params(q);
 for(var i=0;i<ps.length;i++){var p=ps[i],v=p.from==='tenant'?TENANT:args[p.name];
  if(v===undefined||v===''){if(p.optional)continue;return {error:'Fill in '+p.name+' first.'}}
  rows=rows.filter(function(r){return String(r[p.prop])===String(v)})}
 return {rows:q.returns==='one'?rows.slice(0,1):rows};
}
function cell(r,p,v){
 if(p.values)return '<span class="pill s-'+esc(v)+'">'+esc(v)+'</span>';
 if(p.type==='Decimal')return Number(v).toLocaleString('en-US');
 return esc(v);
}
function tableHtml(q,rows){
 var r=rmOf(q.rm),key=r.props.filter(function(p){return p.key})[0].name;
 if(!rows.length)return '<div class="empty">Nothing found.</div>';
 return '<div class="tablewrap"><table class="res"><thead><tr>'+r.props.map(function(p){return '<th>'+esc(p.name)+'</th>'}).join('')+'</tr></thead><tbody>'
  +rows.map(function(row){return '<tr'+(S.touched[row[key]]?' class="flash"':'')+'>'+r.props.map(function(p){return '<td>'+cell(row,p,row[p.name])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}
function renderResult(){
 var q=Q(),el=$('#try-result');if(!el)return;
 var h='';
 if(q.live){
  var out=runLow(q,S.args[q.id]||{});
  h+='<div><span class="live-badge"><i class="livedot"></i>Live. Updates as the data changes</span></div>';
  h+=out.error?'<div class="empty">'+esc(out.error)+'</div>':'<div class="caption">'+out.rows.length+(out.rows.length===1?' result':' results')+'</div>'+tableHtml(q,out.rows);
 }else{
  var last=S.last[q.id];
  if(!last)h+='<div class="empty">Run the query to see what it gives back.</div>';
  else{
   if(last.error)h+='<div class="empty">'+esc(last.error)+'</div>';
   else{
    if(last.ver!==S.ver)h+='<div class="stale"><span>The data changed after this ran. Without Live you have to ask again.</span><button class="btn" data-act="run">Run again</button></div>';
    h+='<div class="caption">'+last.rows.length+(last.rows.length===1?' result':' results')+'</div>'+tableHtml(q,last.rows);
   }
  }
 }
 el.innerHTML=h;
}
function renderTry(){
 var q=Q(),card=$('#try-card');
 if(q.csharp!=null){
  card.innerHTML='<div class="cardhead"><h3>Try it</h3></div><div class="cardbody"><p class="muted" style="margin:0">This query runs C# on the server, so the preview cannot execute it. Visual queries run here against sample data.</p></div>';
  return;
 }
 var ps=params(q).filter(function(p){return p.from!=='tenant'}),r=rmOf(q.rm),a=S.args[q.id]=S.args[q.id]||{};
 var h='<div class="cardhead"><h3>Try it</h3><span class="caption">Sample data</span></div><div class="cardbody">';
 if(ps.length){h+='<div class="args">'+ps.map(function(p){
  var pr=propOf(r,p.prop),id='arg-'+p.name;

   :'<input data-f="arg" data-n="'+esc(p.name)+'" id="'+esc(id)+'" value="'+esc(a[p.name]||'')+'" placeholder="'+(p.optional?'Any':(p.prop==='invoiceId'?'INV-1001':p.prop==='customerId'?'c-101':'Value'))+'" autocomplete="off" spellcheck="false">';
  return '<label class="fld"><span>'+esc(p.name)+(p.optional?' (optional)':'')+'</span>'+inp+'</label>'}).join('')+'</div>'}
 else h+='<p class="muted" style="margin:0">This query takes no input.</p>';
 h+='<div class="row">'+(q.live?'':'<button class="btn primary" data-act="run">Run</button>')+'<button class="btn" data-act="simulate">Change some data</button></div>';

 card.innerHTML=h;renderResult();

function renderAll(){renderTree();renderEditor();renderSP();renderTry()}

/* ---------- actions ---------- */
function toast(msg,actLabel,actId){
 var host=$('#toast-host');host.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(actLabel?'<button data-act="'+actId+'">'+esc(actLabel)+'</button>':'')+'</div>';
 clearTimeout(toast.t);toast.t=setTimeout(function(){host.innerHTML=''},7000);
}
function select(id){S.sel=id;S.confirmCs=false;S.confirmDel=null;var q=Q();S.tab=q.csharp!=null?'csharp':'design';renderAll()}
function scaffoldCs(q){return genCs(rmOf(q.rm),{by:q.by,filters:q.returns==='many'?q.filters:[],one:q.returns==='one',comment:'Started from the visual query. Add what it could not say: sorting, comparisons, text search.'})}
function simulate(){
 var q=Q(),name=q.rm,rows=DATA[name],step=S.simStep[name]++,touched=[],msg='';
 function find(id){return rows.filter(function(r){return r[Object.keys(r)[0]]===id})[0]}
 if(name==='Invoice'){
  var op=step%4;
  if(op===0){var x=find('INV-1003');x.status=x.status==='overdue'?'paid':'overdue';touched=[x.invoiceId];msg=x.customerName+' '+(x.status==='paid'?'paid':'is overdue on')+' INV-1003'}
  else if(op===1){var n='INV-'+(1009+Math.floor(step/4));rows.push(inv(n,'c-104','Kolbotn Kaffe','issued',3200,'2026-11-10'));touched=[n];msg='New invoice '+n+' issued to Kolbotn Kaffe'}
  else if(op===2){var y=find('INV-1006');y.status=y.status==='issued'?'overdue':'issued';touched=[y.invoiceId];msg='INV-1006 moved to '+y.status}
  else{var z=find('INV-1004');z.status=z.status==='draft'?'issued':'draft';touched=[z.invoiceId];msg='INV-1004 moved to '+z.status}
 }else{
  var o=step%2;
  if(o===0){var c=find('c-101');c.tier=c.tier==='gold'?'standard':'gold';touched=['c-101'];msg='Havn & Co is now '+c.tier}
  else{var id='c-'+(105+Math.floor(step/2));rows.push({customerId:id,name:'New Customer '+(105+Math.floor(step/2)-104),country:'NO',tier:'standard'});touched=[id];msg='Customer '+id+' was added'}
 }
 S.ver++;S.touched={};touched.forEach(function(k){S.touched[k]=1});S.lastChange=msg;
 var c2=$('#chg');if(c2)c2.textContent=msg;
 renderResult();
}
function act(a,b){
 var q=Q();
 if(a!=='del-query'&&S.confirmDel){S.confirmDel=null}
 switch(a){
 case 'select':select(b.dataset.id);break;
 case 'toggle-props':S.expanded[b.dataset.rm]=!S.expanded[b.dataset.rm];renderTree();break;
 case 'add-query':{var r=b.dataset.rm,n=1,nm='NewQuery';while(S.queries.some(function(x){return x.name===nm}))nm='NewQuery'+(++n);var nq=newQ({rm:r,name:nm});S.queries.push(nq);S.sel=nq.id;S.tab='design';S.confirmCs=false;renderAll();var f=$('#f-name');if(f){f.focus();f.select()}break}
 case 'del-query':
  if(S.confirmDel===q.id){var i=S.queries.indexOf(q);S.queries.splice(i,1);S.confirmDel=null;
   if(!S.queries.length){var nq2=newQ({rm:q.rm,name:'NewQuery'});S.queries.push(nq2)}
   var next=S.queries.filter(function(x){return x.rm===q.rm})[0]||S.queries[0];select(next.id);toast('Deleted '+(q.name||'the query'))}
  else{S.confirmDel=q.id;renderEditor();setTimeout(function(){if(S.confirmDel===q.id){S.confirmDel=null;renderEditor()}},4000)}
  break;
 case 'tab':S.tab=b.dataset.tab;S.confirmCs=false;renderEditor();break;
 case 'returns':{var v=b.dataset.v;if(v===q.returns)break;
  if(v==='one'){q.stash=q.filters;q.filters=[]}else{q.filters=q.stash||[];q.stash=[]}
  q.returns=v;renderTree();renderEditor();renderSP();renderTry();break}
 case 'add-by':{var r1=rmOf(q.rm),kp=r1.props.filter(function(p){return p.key})[0]||r1.props[0];q.by=mkInput(kp,false);renderEditor();renderSP();renderTry();break}
 case 'rm-by':q.by=null;renderEditor();renderSP();renderTry();break;
 case 'add-filter':{var r2=rmOf(q.rm),used={};params(q).forEach(function(p){used[p.prop]=1});
  var pick=r2.props.filter(function(p){return !used[p.prop]&&!p.key})[0]||r2.props.filter(function(p){return !used[p.prop]})[0]||r2.props[0];
  q.filters.push(mkInput(pick,true));renderEditor();renderSP();renderTry();break}
 case 'rm-filter':q.filters.splice(+b.dataset.i,1);renderEditor();renderSP();renderTry();break;
 case 'policy':{var p=b.dataset.p,ix=q.authorize.indexOf(p);if(ix>=0)q.authorize.splice(ix,1);else q.authorize.push(p);renderPanel();renderSP();break}
 case 'add-cs':q.csharp=scaffoldCs(q);S.tab='csharp';S.confirmCs=false;renderTree();renderEditor();renderSP();renderTry();break;
 case 'rm-cs':S.confirmCs=true;renderPanel();break;
 case 'rm-cs-no':S.confirmCs=false;renderPanel();break;
 case 'rm-cs-yes':S.removed={id:q.id,code:q.csharp};q.csharp=null;S.confirmCs=false;S.tab='design';renderAll();toast('C# removed. Visual design is back.','Undo','undo-rm');break;
 case 'undo-rm':if(S.removed){var uq=S.queries.filter(function(x){return x.id===S.removed.id})[0];if(uq){uq.csharp=S.removed.code;S.sel=uq.id;S.tab='csharp';renderAll()}S.removed=null;$('#toast-host').innerHTML=''}break;
 case 'example':q.english=b.dataset.t;S.conv[q.id]=null;renderPanel();break;
 case 'convert':convert();break;
 case 'apply':applyConv();break;
 case 'copy':{var txt=screenplay(q);var done=function(){toast('Screenplay copied')};
  var fb=function(){var pre=$('#sp-pre'),rg=document.createRange();rg.selectNodeContents(pre);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);toast('Selected. Press copy to take it with you.')};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}break}
 case 'run':{var out=runLow(q,S.args[q.id]||{});S.last[q.id]=out.error?{error:out.error,ver:S.ver}:{rows:out.rows,ver:S.ver};renderResult();break}
 case 'simulate':simulate();break;
 }
}
async function convert(){
 var q=Q(),text=(q.english||'').trim();
 if(!text){S.conv[q.id]={error:'Write a sentence about what the query should find.'};renderPanel();return}
 S.conv[q.id]={busy:true};renderPanel();
 var res=null,note='';
 if(SAMPLE){
  try{res=normalizeClaude(await SAMPLE.json(buildPrompt(q.rm,text),{modelTier:'default'}),q.rm);S.engine='claude'}
  catch(e){var code=e&&e.code;note=code==='not_granted'?'Claude was not allowed for this page, so the built-in interpreter answered instead.':'Claude could not answer this time'+(code?' ('+code+')':'')+', so the built-in interpreter answered instead.';if(code==='not_granted'||code==='sampling_disabled'||code==='capability_disabled'){SAMPLE=null;S.engine='offline'}}
 }
 if(!res){res=convertLocal(q.rm,text);res.note=note||res.note}
 S.conv[q.id]={result:res};
 if(S.sel===q.id&&S.tab==='describe')renderPanel();
}
function applyConv(){
 var q=Q(),c=S.conv[q.id];if(!c||!c.result)return;
 var res=c.result,p=proposed(q,res);
 q.name=p.name;q.description=p.description;q.returns=p.returns;q.live=p.live;q.optional=p.optional;q.by=p.by;q.filters=p.filters;q.stash=[];q.csharp=p.csharp;
 S.conv[q.id]=null;S.confirmCs=false;S.tab=q.csharp!=null?'csharp':'design';
 renderAll();toast(res.fits?'Applied to the visual design.':'Added C#. Visual design is off until it is removed.');
}

/* ---------- input handling ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b)});
function field(f,t){
 var q=Q(),i=+t.dataset.i;
 switch(f){
 case 'name':q.name=t.value;renderTree();renderSP();renderDiag();break;
 case 'desc':q.description=t.value;renderSP();break;
 case 'english':q.english=t.value;break;
 case 'live':q.live=t.checked;renderTree();renderSP();renderTry();break;
 case 'optres':q.optional=t.checked;renderSP();break;
 case 'by-name':q.by.name=t.value;renderSP();renderTry();renderDiag();break;
