<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Studio Design Canvas</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Studio Design Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: Studio's canvas chrome - project drawer, full-bleed canvas with floating project pill, toolbar, tool rail, chat bar and zoom bar, and one side panel (topics, inspector, history, problems). Screens on the canvas draw in the UI profile's Scene theme. */
:root {
  --ground: #0a0f1a;
  --panel: #111827;
  --panel-2: #1a2333;
  --raised: #1f2937;
  --line: #263142;
  --line-2: #374151;
  --text: #f3f4f6;
  --muted: #9ca3af;
  --faint: #6b7280;
  --accent: #60a5fa;
  --accent-ink: #030712;
  --accent-soft: #172a46;
  --ok: #86efac;
  --ok-soft: #14301f;
  --warn: #fcd34d;
  --warn-soft: #33290f;
  --bad: #fca5a5;
  --bad-soft: #3a1616;
  --dot: rgba(148, 163, 184, .13);
  --sel: #60a5fa;
  --pin: #f59e0b;
  --f-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #e9edf3; --panel: #ffffff; --panel-2: #f5f7fa; --raised: #ffffff; --line: #e2e7ee; --line-2: #cdd5e0;
    --text: #111827; --muted: #4b5563; --faint: #6b7280; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e0ebff;
    --ok: #15803d; --ok-soft: #e3f6ea; --warn: #92600a; --warn-soft: #fdf3d7; --bad: #b91c1c; --bad-soft: #fde8e8;
    --dot: rgba(51, 65, 85, .16); --sel: #2563eb; --pin: #d97706; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #e9edf3; --panel: #ffffff; --panel-2: #f5f7fa; --raised: #ffffff; --line: #e2e7ee; --line-2: #cdd5e0;
  --text: #111827; --muted: #4b5563; --faint: #6b7280; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e0ebff;
  --ok: #15803d; --ok-soft: #e3f6ea; --warn: #92600a; --warn-soft: #fdf3d7; --bad: #b91c1c; --bad-soft: #fde8e8;
  --dot: rgba(51, 65, 85, .16); --sel: #2563eb; --pin: #d97706; color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--panel); color: var(--text); font: 13px/1.45 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }


.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.tb:hover:not(:disabled) { border-color: var(--line-2); }
.tb:disabled { opacity: .45; cursor: default; }
.tb.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.tb.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.tb svg { width: 15px; height: 15px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
.seg svg { width: 15px; height: 15px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.chip-btn .n { min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; font-size: 11px; font-weight: 700; padding: 0 5px; }
.n.bad { background: var(--bad-soft); color: var(--bad); }
.n.warn { background: var(--warn-soft); color: var(--warn); }
.n.ok { background: var(--ok-soft); color: var(--ok); }

.pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 44px; }
.pane-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
.pane-head .grow { flex: 1; }
.eyebrow { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

/* chat */
.chat-log { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; flex-direction: column; gap: 6px; }
.msg .who { font-size: 11px; color: var(--faint); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.msg .who .av { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
.msg.claude .av { background: #d97757; color: #fff; }
.msg.you .av { background: var(--line-2); color: var(--text); }
.msg .body { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you .body { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; border-radius: 10px; }
.scope { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; width: fit-content; }
.thinking { color: var(--muted); display: flex; gap: 8px; align-items: center; }
.thinking .spin { width: 12px; height: 12px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.plan { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.plan-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.plan-head .grow { flex: 1; }
.plan ol { list-style: none; margin: 0; padding: 4px 0; }
.plan li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 5px 10px; align-items: start; }
.plan li .st { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 1px; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.no { background: var(--bad-soft); color: var(--bad); }
.st.warn { background: var(--warn-soft); color: var(--warn); }
.plan .op { font-family: var(--f-mono); font-size: 11.5px; color: var(--text); overflow-wrap: anywhere; }
.plan .op .k { color: var(--accent); }
.plan .why { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.code-chip { font-family: var(--f-mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--bad-soft); color: var(--bad); margin-right: 4px; }
.alt-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 9px 34px; }
.mini { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; }
.mini:hover:not(:disabled) { border-color: var(--accent); }
.mini.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.mini:disabled { opacity: .5; cursor: default; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.suggest button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); text-align: left; }
.suggest button:hover { color: var(--text); border-color: var(--line-2); }
.send { width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; }
.send svg { width: 16px; height: 16px; }
.planner { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.planner select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; padding: 1px 4px; }
.x-chip { border: 0; background: none; color: var(--faint); padding: 0 2px; }

/* canvas */
.canvas-wrap { position: relative; min-height: 0; overflow: hidden; background-color: var(--ground); background-image: radial-gradient(var(--dot) 1px, transparent 1.4px); background-size: 20px 20px; cursor: default; touch-action: none; }
.canvas-wrap.panning { cursor: grabbing; }
.canvas-wrap.commenting .artboard-body { cursor: crosshair; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.artboard { position: absolute; }
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.ab-label { position: absolute; display: flex; gap: 8px; align-items: center; white-space: nowrap; pointer-events: auto; height: 22px; overflow: hidden; }
.ab-label .t { font-weight: 600; color: var(--text); cursor: pointer; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.ab-label .m { color: var(--faint); font-family: var(--f-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 100 auto; }
.ab-label .keep { height: 20px; font-size: 11px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--text); flex: none; }
.ab-label.on .t { color: var(--accent); }
.artboard-body { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px rgba(0,0,0,.28); }
.artboard.active .artboard-body { box-shadow: 0 0 0 2px var(--accent), 0 18px 40px rgba(0,0,0,.28); }
.overlay-sel { position: absolute; pointer-events: none; border: 1.5px solid var(--sel); border-radius: 3px; z-index: 30; }
.overlay-sel .tag { position: absolute; left: -1.5px; bottom: 100%; background: var(--sel); color: var(--accent-ink); font: 600 11px/1 var(--f-ui); padding: 3px 6px; border-radius: 3px 3px 3px 0; white-space: nowrap; }
.overlay-sel.locked { border-style: dashed; }
.overlay-hover { position: absolute; pointer-events: none; border: 1px solid var(--sel); opacity: .55; z-index: 29; border-radius: 3px; }
.pin { position: absolute; width: 24px; height: 24px; margin: -24px 0 0 -2px; border-radius: 12px 12px 12px 2px; background: var(--pin); color: #111; font: 700 11px/24px var(--f-ui); text-align: center; z-index: 40; border: 2px solid #fff; cursor: pointer; }
.pin.done { background: var(--faint); color: #fff; }
.pop { position: absolute; z-index: 60; width: 260px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.35); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pop textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.pop .row { display: flex; gap: 6px; justify-content: flex-end; }

/* inspector */
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 11px 7px 9px; font-size: 12.5px; white-space: nowrap; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.insp { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 14px; }
.sec h3 { margin: 0; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.sec h3 .grow { flex: 1; }
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
.field > label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.field input[type=text], .field input[type=number], .field select { width: 100%; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); padding: 0 7px; min-width: 0; }
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
.field input:disabled, .field select:disabled { opacity: .55; }
.locked-note { font-size: 11.5px; color: var(--muted); background: var(--panel-2); border: 1px dashed var(--line-2); border-radius: 7px; padding: 7px 9px; }
.badge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.own { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.badge.inh { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.badge.cfg { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.desc { color: var(--muted); font-size: 12px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card-opt { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.card-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-opt .nm { font-size: 11.5px; font-weight: 600; }
.card-opt .sub { font-size: 10.5px; color: var(--faint); }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(127,127,127,.35); }
.schem { height: 34px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; }
.schem i { position: absolute; background: var(--line-2); border-radius: 2px; }
.accent-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.accent-row .sw { width: 22px; height: 22px; border-radius: 6px; border: 2px solid transparent; }
.accent-row .sw[aria-pressed="true"] { border-color: var(--text); }
.grade { font-size: 11px; font-family: var(--f-mono); padding: 1px 6px; border-radius: 5px; }
.grade.aa { background: var(--ok-soft); color: var(--ok); }
.grade.lg { background: var(--warn-soft); color: var(--warn); }
.grade.fail { background: var(--bad-soft); color: var(--bad); }
.tree { display: flex; flex-direction: column; gap: 1px; font-size: 12px; }
.tree .slot { color: var(--faint); font-family: var(--f-mono); font-size: 11px; padding: 6px 4px 2px; display: flex; gap: 6px; align-items: baseline; }
.tree .slot .acc { color: var(--faint); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .row { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 14px; border-radius: 6px; border: 0; background: none; text-align: left; width: 100%; }
.tree .row:hover { background: var(--panel-2); }
.tree .row[aria-selected="true"] { background: var(--accent-soft); }
.tree .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .row .cn { font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
.tw { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 9px; background: var(--panel-2); }
.tw .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.tw .lbl span:last-child { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.tw .bind { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.tw input[type=range] { width: 100%; accent-color: var(--accent); }
.empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 8px; border: 1px dashed var(--line-2); border-radius: 9px; }
.problem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); }
.sev { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; height: fit-content; }
.sev.Blocker { background: var(--bad-soft); color: var(--bad); }
.sev.Warning { background: var(--warn-soft); color: var(--warn); }
.sev.Info { background: var(--accent-soft); color: var(--accent); }
.problem .pm { font-size: 12px; }
.problem .pa { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(3, 7, 18, .55); z-index: 100; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(880px, 100%); max-height: min(86vh, 900px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.modal .pane-head { gap: 10px; }
.modal pre { margin: 0; flex: 1; overflow: auto; padding: 14px 16px; font: 12px/1.6 var(--f-mono); background: var(--panel-2); color: var(--text); white-space: pre; }
.modal .foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.modal .foot .grow { flex: 1; color: var(--muted); font-size: 12px; }
.pl-k { color: #c4a5fd; } .pl-s { color: #86efac; } .pl-c { color: var(--faint); }
:root[data-theme="light"] .pl-k { color: #6d28d9; } :root[data-theme="light"] .pl-s { color: #047857; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .pl-k { color: #6d28d9; } :root:not([data-theme="dark"]) .pl-s { color: #047857; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ---------- Studio chrome ---------- */
:root { --float: rgba(17, 24, 39, .92); --float-line: #263142; --drawer: #0d1424; --tree-hover: #172036; --tree-on: #1a2a48; --shadow: 0 10px 30px rgba(0, 0, 0, .35); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --float: rgba(255, 255, 255, .94); --float-line: #d9dfe8; --drawer: #f6f8fb; --tree-hover: #e9eef5; --tree-on: #dde8fb; --shadow: 0 8px 24px rgba(15, 23, 42, .12); } }
:root[data-theme="light"] { --float: rgba(255, 255, 255, .94); --float-line: #d9dfe8; --drawer: #f6f8fb; --tree-hover: #e9eef5; --tree-on: #dde8fb; --shadow: 0 8px 24px rgba(15, 23, 42, .12); }

.studio { height: 100%; display: grid; grid-template-columns: 296px minmax(0, 1fr) auto; background: var(--ground); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.studio[data-drawer="closed"] { grid-template-columns: 0 minmax(0, 1fr) auto; }
.studio[data-drawer="closed"] .drawer { visibility: hidden; }

/* project drawer */
.drawer { background: var(--drawer); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.drawer-head { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); }
.drawer-head b { font-size: 14px; font-weight: 600; }
.drawer-head .ico { width: 16px; height: 16px; color: var(--muted); }
.drawer-head .grow { flex: 1; }
.tree { flex: 1; overflow-y: auto; padding: 8px 6px 20px; font-size: 13px; }
.tn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; color: var(--text); text-align: left; padding: 6px 8px; border-radius: 7px; white-space: nowrap; min-width: 0; }
.tn:hover { background: var(--tree-hover); }
.tn[aria-current="true"] { background: var(--tree-on); }
.tn .chev { width: 14px; height: 14px; color: var(--faint); flex: none; transition: transform .15s; }
.tn .chev.open { transform: rotate(90deg); }
.tn .chev.none { visibility: hidden; }
.tn .ti { width: 15px; height: 15px; flex: none; }
.tn .tl { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tn .tb2 { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }
.tn .lock { width: 13px; height: 13px; color: var(--faint); flex: none; }
.tn.root { font-weight: 600; }
.ti.c-files { color: #fb923c; } .ti.c-prologue { color: #22d3ee; } .ti.c-tpl { color: #c084fc; } .ti.c-ui { color: #818cf8; } .ti.c-policy { color: #60a5fa; } .ti.c-domain { color: var(--muted); } .ti.c-model { color: #facc15; } .ti.c-design { color: #f472b6; } .ti.c-app { color: #60a5fa; } .ti.c-screen { color: var(--muted); }

/* stage */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.canvas-wrap { position: absolute !important; inset: 0; }
.float { position: absolute; z-index: 50; background: var(--float); border: 1px solid var(--float-line); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.ib { width: 28px; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.ib:hover { background: var(--panel-2); color: var(--text); }
.ib svg { width: 16px; height: 16px; }
.tbi { position: relative; width: 38px; height: 38px; border: 0; border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.tbi:hover { color: var(--text); background: var(--panel-2); }
.tbi svg { width: 19px; height: 19px; }
.tbi[aria-pressed="true"], .tbi.on { background: var(--accent); color: var(--accent-ink); }
.tbi .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); }
.tbi.on .dot { background: var(--accent-ink); }
.tbi .count { position: absolute; top: 2px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; font: 700 10px/17px var(--f-ui); font-style: normal; text-align: center; background: var(--warn); color: #1a1300; }
.tbi .count.bad { background: var(--bad); color: #2a0606; }

.pill-project { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 6px; max-width: calc(100% - 32px); }
.pill-ic { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.pill-ic svg { width: 19px; height: 19px; }
.pill-t { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; padding-right: 4px; }
.pill-t b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 0 7px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #64748b, #334155); color: #fff; display: grid; place-items: center; font: 600 12px var(--f-ui); margin-left: 6px; flex: none; }

.rail { left: 16px; top: 50%; transform: translateY(-50%); border-radius: 999px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; }
.rail-sep { width: 22px; height: 1px; background: var(--line-2); margin: 4px 0; }

.chatbar { left: 88px; right: 268px; margin-inline: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(820px, calc(100% - 356px)); border-radius: 28px; padding: 8px 8px 8px 18px; display: flex; flex-direction: column; gap: 4px; }
.chat-scope { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 2px; }
.chat-scope:empty { display: none; }
.chat-row { display: flex; align-items: center; gap: 8px; }
.chatbar textarea { flex: 1; min-width: 0; border: 0; background: none; outline: none; resize: none; font-size: 14px; line-height: 1.4; padding: 9px 0; max-height: 120px; color: var(--text); }
.chatbar textarea::placeholder { color: var(--muted); }
.chatbar:focus-within { border-color: var(--accent); }
.agent-pick { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 0 4px; height: 32px; border-radius: 8px; }
.agent-pick:hover { color: var(--text); background: var(--panel-2); }
.agent-pick svg { width: 17px; height: 17px; }
.agent-pick select { background: none; border: 0; color: inherit; font-size: 12.5px; cursor: pointer; }
.agent-pick select option { background: var(--panel); color: var(--text); }
.chatbar .send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.chatbar .send:disabled { opacity: .45; }
.chatbar .send svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.topic { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip button { border: 0; background: none; color: var(--faint); padding: 0; font-size: 14px; line-height: 1; }

.zoombar { right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 0 7px; }
.zoombar .pct { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text); }
.zsep { width: 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
.toast { position: absolute; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; z-index: 70; box-shadow: var(--shadow); max-width: min(520px, 90%); }

/* side panel: topics, inspector, history, problems */
.panel { width: 380px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.panel[hidden] { display: none !important; }
.panel-head { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-head .grow { flex: 1; }
.panel-head .back { margin-left: -6px; }
.panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel-body > .scroll { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.btn-primary { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: fit-content; }
.btn-primary svg { width: 15px; height: 15px; }
.topic-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 8px; border-radius: 10px; border: 0; background: none; text-align: left; width: 100%; }
.topic-row:hover { background: var(--panel-2); }
.topic-row .av2 { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #64748b, #334155); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.topic-row .tt { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-row .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.topic-row .by { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-row .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }
.panel .chat-log { flex: 1; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.panel .tabs { flex: none; }
.panel .insp { flex: 1; }
.continue-note { flex: none; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 12px; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; }
.hist-row:hover { background: var(--panel-2); }
.hist-row .n { width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.hist-row.now .n { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.hist-row.future { opacity: .5; }
.hist-row .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-row .w { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.pop-menu { position: absolute; z-index: 80; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 220px; display: flex; flex-direction: column; }
.pop-menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 7px; display: flex; flex-direction: column; gap: 1px; }
.pop-menu button:hover { background: var(--panel-2); }
.pop-menu .s { color: var(--muted); font-size: 11.5px; }
.pop-menu .h { padding: 6px 10px 4px; }
.kbd { font: 11px var(--f-mono); padding: 1px 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; color: var(--text); background: var(--panel-2); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: 12.5px; padding: 6px 10px 10px; }

/* narrow: the drawer and panel overlay the canvas */
@media (max-width: 1100px) {
  .studio, .studio[data-drawer="closed"] { grid-template-columns: minmax(0, 1fr); }
  .drawer { position: fixed; left: 0; top: 0; bottom: 0; width: min(296px, 86vw); z-index: 90; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
  .studio[data-drawer="closed"] .drawer { display: none; }
  .stage { grid-column: 1; grid-row: 1; }
  .panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(380px, 100vw); z-index: 95; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
  .chatbar { left: 16px; right: 16px; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .zoombar { left: 16px; right: auto; height: 46px; }
  .zoombar .tbi { width: 34px; height: 34px; }
  .rail { top: auto; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: none; }
  .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 640px) {
  .pill-project { right: 16px; }
  .pill-sub { display: none; }
  .topbar { top: calc(74px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; justify-content: space-between; height: 46px; }
  .topbar .tbi { width: 34px; height: 34px; }
  .topbar #tb-info, .topbar .avatar { display: none; }
  .rail { flex-direction: column; left: auto; right: 16px; top: auto; bottom: calc(222px + env(safe-area-inset-bottom, 0px)); padding: 6px 4px; }
  .rail .tbi { width: 36px; height: 36px; }
  .zoombar #zoom-help, .zoombar .zsep:last-of-type { display: none; }
}
@media (max-width: 640px) { .rail #add-compact, .rail #rail-look { display: none; } }

/* components palette */
.palette { left: 78px; top: 50%; transform: translateY(-50%); width: 360px; max-height: min(760px, calc(100% - 180px)); border-radius: 16px; display: flex; flex-direction: column; z-index: 60; overflow: hidden; }
.palette[hidden] { display: none; }
.pal-head { display: flex; align-items: center; padding: 14px 12px 8px 16px; }
.pal-head b { font-size: 15px; }
.pal-head .grow { flex: 1; }
.pal-q { margin: 4px 14px 6px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); padding: 0 12px; font-size: 14px; color: var(--text); outline: none; }
.pal-q:focus { border-color: var(--accent); }
.pal-fit { display: flex; align-items: center; gap: 7px; padding: 2px 16px 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
.pal-fit input { accent-color: var(--accent); }
.pal-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.pal-group + .pal-group { margin-top: 4px; }
.pal-gh { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 9px 8px; border-radius: 8px; text-align: left; }
.pal-gh:hover { background: var(--panel-2); }
.pal-gh b { font-size: 14px; flex: 1; }
.pal-gh .tri { width: 14px; color: var(--muted); font-size: 11px; }
.pal-gh .star { width: 14px; color: #f59e0b; }
.pal-gh .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pal-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 5px 8px 5px 26px; border-radius: 8px; text-align: left; cursor: grab; }
.pal-row:hover { background: var(--panel-2); }
.pal-row:active { cursor: grabbing; }
.pal-row .ab { height: 24px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; place-items: center; font: 600 10.5px var(--f-mono); color: var(--muted); }
.pal-row .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-row .pk { font-size: 11px; color: var(--faint); white-space: nowrap; }
.pal-row.nofit .nm, .pal-row.nofit .ab { opacity: .5; }
.pal-foot { border-top: 1px solid var(--line); padding: 8px 16px; color: var(--muted); font-size: 11.5px; }
@media (max-width: 640px) { .palette { left: 16px; right: 16px; width: auto; top: 136px; transform: none; max-height: calc(100% - 300px); } }

/* dropping */
.canvas-wrap .ghost-slot { display: none; }
.canvas-wrap.dragging .ghost-slot { display: flex; }
.canvas-wrap.dragging .scene [data-slot] { outline: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.drop-hint { position: absolute; pointer-events: none; z-index: 45; border-radius: 6px; }
.drop-hint.ok { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.drop-hint.bad { border: 2px dashed var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.drop-hint.line { background: var(--accent); border-radius: 2px; }
.drop-hint span { position: absolute; left: -2px; bottom: calc(100% + 4px); white-space: nowrap; font: 600 11.5px var(--f-ui); padding: 3px 7px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.drop-hint.bad span { background: var(--bad); color: #fff; white-space: normal; width: max-content; max-width: 360px; }
.drop-hint.note span { left: 0; bottom: auto; top: 0; background: var(--raised); color: var(--text); border: 1px solid var(--line-2); }

/* package components, drawn from the 21 theme tokens */
.sc-gtitle { margin: 0; font-weight: 700; } .sc-gtitle.h2 { font-size: 18px; } .sc-gtitle.h3 { font-size: 15px; }
.sc-gtext { margin: 0; color: var(--tx); max-width: 70ch; }
.sc-gcode { font: 12px ui-monospace, Menlo, monospace; background: var(--hv); border: 1px solid var(--bd); border-radius: var(--rad); padding: 6px 10px; display: inline-block; }
.sc-dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 12.5px; } .sc-dl dt { color: var(--mu); } .sc-dl dd { margin: 0; }
.sc-tree { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.sc-img { height: 120px; display: grid; place-items: center; color: var(--mu); background: var(--hv); border-radius: var(--rad); }
.sc-steps { display: flex; gap: 18px; padding: 12px 16px; flex-wrap: wrap; } .sc-steps span { display: flex; gap: 8px; align-items: center; color: var(--mu); font-size: 12.5px; }
.sc-steps i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--bd); display: grid; place-items: center; font-style: normal; font-size: 11px; } .sc-steps .on { color: var(--tx); font-weight: 600; } .sc-steps .on i { background: var(--p); color: var(--pc); border-color: var(--p); }
.sc-switch { width: 34px; height: 20px; border-radius: 10px; background: var(--p); position: relative; flex: none; } .sc-switch::after { content: ""; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); }
.cb2 { width: 16px; height: 16px; border-radius: 4px; background: var(--p); flex: none; }
.sc-slider { position: relative; height: 4px; border-radius: 2px; background: var(--bd); margin: 10px 4px; } .sc-slider i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--p); border-radius: 2px; } .sc-slider b { position: absolute; top: -6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--card); border: 2px solid var(--p); }
.sc-btngroup { display: inline-flex; } .sc-btngroup .sc-btn { border-radius: 0; margin-left: -1px; } .sc-btngroup .sc-btn:first-child { border-radius: var(--rad) 0 0 var(--rad); } .sc-btngroup .sc-btn:last-child { border-radius: 0 var(--rad) var(--rad) 0; }
.sc-progress { height: 8px; border-radius: 4px; background: var(--hv); flex: 1; overflow: hidden; } .sc-progress i { display: block; height: 100%; background: var(--p); }
.sc-spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--bd); border-top-color: var(--p); }
.sc-skel { display: flex; flex-direction: column; gap: 8px; } .sc-skel i { height: 12px; border-radius: 6px; background: var(--hv); }
.sc-hr { border: 0; border-top: 1px solid var(--bd); margin: 4px 0; width: 100%; }
.sc-acc { padding: 10px 14px; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; } .sc-acc:last-child { border-bottom: 0; }

/* board: regions, notes, chat bubbles, moving */
.regions { position: absolute; left: 0; top: 0; }
.region { position: absolute; border: 3px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 3%, transparent); pointer-events: none; }
.region.sel { border-style: solid; border-color: var(--accent); }
.region.target { border-style: solid; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.rg-head { position: absolute; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border-radius: 6px 6px 0 0; background: color-mix(in srgb, var(--accent) 72%, #1e3a8a); color: #fff; pointer-events: auto; cursor: grab; white-space: nowrap; overflow: hidden; font: 600 12.5px var(--f-ui); user-select: none; }
.rg-head:active { cursor: grabbing; }
.rg-head.sel { box-shadow: 0 0 0 2px var(--text); }
.rg-head .rg-t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rg-head .rg-t[contenteditable="true"] { background: rgba(0,0,0,.25); outline: none; padding: 0 4px; border-radius: 3px; cursor: text; }
.rg-head .rg-b { border: 0; background: none; color: inherit; opacity: .85; padding: 0 2px; font-size: 14px; }
.rg-head .rg-b:hover { opacity: 1; }
.rg-handle { position: absolute; pointer-events: auto; z-index: 2; }
.rg-handle.e { width: 10px; cursor: ew-resize; }
.rg-handle.s { height: 10px; cursor: ns-resize; }
.rg-handle.se { width: 18px; height: 18px; cursor: nwse-resize; border-right: 3px solid var(--accent); border-bottom: 3px solid var(--accent); border-radius: 0 0 6px 0; }
.ab-label .t { cursor: grab; }
.ab-label .t:active { cursor: grabbing; }
.ab-play { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; margin-left: auto; }
.ab-play svg { width: 11px; height: 11px; margin-left: 1px; }
.ab-label { width: 100%; }
.artboard.joining .artboard-body { box-shadow: 0 0 0 3px var(--accent), 0 18px 40px rgba(0,0,0,.28); }
.note { position: absolute; padding: 26px 26px; box-shadow: 0 6px 18px rgba(0,0,0,.28); color: #1f2937; font: 400 27px/1.38 "Kalam", "Comic Sans MS", cursive; cursor: grab; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 2px; }
.note:active { cursor: grabbing; }
.note.sel { outline: 4px solid var(--accent); outline-offset: 4px; }
.note-t { width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-t[contenteditable="true"] { outline: none; cursor: text; }
.note-t .ph { color: rgba(31,41,55,.45); }
.n-yellow { background: #fef08a; } .n-pink { background: #fbcfe8; } .n-green { background: #bbf7d0; } .n-blue { background: #bfdbfe; } .n-orange { background: #fed7aa; } .n-purple { background: #e9d5ff; }
.bubble { position: absolute; width: 0; height: 0; transform: scale(var(--inv)); transform-origin: 0 0; z-index: 5; cursor: pointer; }
.bubble span { position: absolute; left: -18px; top: -46px; width: 36px; height: 36px; border-radius: 50% 50% 50% 4px; background: #dc2626; color: #fff; display: grid; place-items: center; font: 700 13px var(--f-ui); box-shadow: 0 4px 12px rgba(0,0,0,.35); border: 2px solid #fff; }
.bubble i { position: absolute; left: 10px; top: -54px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 700 10px/18px var(--f-ui); font-style: normal; text-align: center; }
.bubble::after { content: ""; position: absolute; left: -4px; top: -6px; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; }
.bubble.sel span { box-shadow: 0 0 0 3px var(--accent); }
.bub-pop { position: absolute; z-index: 65; width: 320px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.bp-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bp-head .grow { flex: 1; }

const human = k => k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());

function table(sc, P, compact, n) {
  const q = P.rows;
  if (!q) return `<div class="th">${esc(P.label || 'List')}</div><div class="sc-empty"><b>Not bound to a query</b><span>Choose a query in Properties.</span></div>`;

  if (compact) {

    return head + rows.map(r => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)"><div style="min-width:0"><div style="font-weight:600">${esc(r[tf])}</div><div style="color:var(--mu);font-size:12px">${fields.filter(f => f !== tf).slice(0, 2).map(f => QUERIES[q].fields[f] === 'status' ? '' : cell(q, f, r[f])).filter(Boolean).join(' · ')}</div></div>${fields.find(f => QUERIES[q].fields[f] === 'status') ? cell(q, fields.find(f => QUERIES[q].fields[f] === 'status'), r[fields.find(f => QUERIES[q].fields[f] === 'status')]) : ''}</div>`).join('');
  }
  const multi = P.selectionMode === 'multiple';
  const num = f => ['currency', 'number'].includes(QUERIES[q].fields[f]);
  return head + `<table><thead><tr>${multi ? '<th style="width:28px"><span class="cb"></span></th>' : ''}${fields.map(f => `<th class="${num(f) ? 'num' : ''}">${esc(human(f))}</th>`).join('')}</tr></thead><tbody>` +
    rows.map((r, i) => `<tr>${multi ? `<td><span class="cb" style="${i < 2 ? 'background:var(--p);border-color:var(--p)' : ''}"></span></td>` : ''}${fields.map(f => `<td class="${num(f) ? 'num' : ''}">${cell(q, f, r[f])}</td>`).join('')}</tr>`).join('') +
    `</tbody></table><div class="ft"><span>Showing ${rows.length} of ${(SAMPLE[q] || []).length * 28}</span><span>‹ 1 2 3 … ›</span></div>`;

function chart(P) {
  const q = P.query || 'RevenueByMonth';
  let labels, vals;
  if (q === 'RevenueByMonth') { labels = SAMPLE.RevenueByMonth.map(r => r.month); vals = SAMPLE.RevenueByMonth.map(r => r.revenue); }
  else { const g = QUERIES[q]?.group || 'status'; const m = {}; (SAMPLE[q] || []).forEach(r => m[r[g]] = (m[r[g]] || 0) + 1); labels = Object.keys(m); vals = Object.values(m); }
  const max = Math.max(...vals, 1), n = vals.length, Wd = 400, H = 140;
  let body = '';
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${Wd}" y1="${H * f}" y2="${H * f}" stroke="var(--bd)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  if (P.kind === 'bar') body = vals.map((v, i) => { const bw = Wd / n * .56, x = Wd / n * i + (Wd / n - bw) / 2, h = v / max * (H - 8); return `<rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="2" fill="var(--p)" opacity="${.55 + .45 * v / max}"/>`; }).join('');
  else if (P.kind === 'funnel') body = vals.slice().sort((a, b) => b - a).map((v, i, a) => { const w = v / a[0] * Wd, h = H / a.length - 6; return `<rect x="${(Wd - w) / 2}" y="${i * (h + 6)}" width="${w}" height="${h}" rx="2" fill="var(--p)" opacity="${1 - i * .15}"/>`; }).join('');
  else { const pts = vals.map((v, i) => [Wd / (n - 1 || 1) * i, H - 6 - v / max * (H - 16)]); const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    body = (P.kind === 'area' ? `<path d="${d} L${Wd} ${H} L0 ${H} Z" fill="var(--p)" opacity=".14"/>` : '') + `<path d="${d}" fill="none" stroke="var(--p)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(P.title || 'Chart')}">${grid}${body}</svg><div style="display:flex;justify-content:space-between;color:var(--mu);font-size:11px">${P.kind === 'funnel' ? '' : labels.map(l => `<span>${esc(l)}</span>`).join('')}</div>`;
}

    if (P.items) return W(n, `<div class="sc-btngroup">${(P.items || []).map(x => `<span class="sc-btn">${esc(x)}</span>`).join('')}${c === 'splitButton' || c === 'menu' ? '<span class="sc-btn">▾</span>' : ''}</div>`, '');
    return W(n, `${P.icon ? icon(P.icon) : c === 'action' ? icon('check') : ''}${E(n, 'label', P.label || 'Button')}${c === 'splitButton' ? ' ▾' : ''}`, `sc-btn ${P.emphasis === 'primary' ? 'primary' : P.emphasis === 'text' ? 'text' : ''}`);
  }
  if (cat === 'Feedback') {
    if (c === 'progressBar') return W(n, `<div class="sc-progress"><i style="width:${Math.min(100, Number(P.text) || 62)}%"></i></div>`, '', 'flex:1;min-width:160px;display:flex;align-items:center');
    if (c === 'progressSpinner') return W(n, `<span class="sc-spinner"></span>`, '', 'display:flex;justify-content:center;padding:8px');
    if (c === 'skeleton') return W(n, `<div class="sc-skel"><i style="width:60%"></i><i></i><i style="width:80%"></i></div>`, 'sc-card', 'padding:14px');
    return W(n, `${icon(tone === 'danger' ? 'x' : tone === 'success' ? 'check' : 'bell', 'width="16" height="16" style="flex:none;margin-top:1px"')}${E(n, 'text', P.text || 'Message')}`, `sc-notice ${tone}`);
  }
  if (cat === 'Navigation') {
    const items = P.items && P.items.length ? P.items : ['Details', 'Lines', 'Shipping'];
    if (/steps|stepper/i.test(c)) return W(n, `<div class="sc-steps">${items.map((x, i) => `<span class="${i ? '' : 'on'}"><i>${i + 1}</i>${esc(x)}</span>`).join('')}</div>`, '');
    if (c === 'paginator') return W(n, `<div class="sc-chips" style="justify-content:center"><span class="sc-chip">‹</span><span class="sc-chip"><b>1</b></span><span class="sc-chip">2</span><span class="sc-chip">3</span><span class="sc-chip">›</span></div>`, '', 'flex:1');
    if (c === 'breadcrumb' || c === 'objectNavigationalBar') return W(n, `<div style="display:flex;gap:6px;color:var(--mu);font-size:12.5px">${items.map((x, i) => `<span style="${i === items.length - 1 ? 'color:var(--tx);font-weight:500' : ''}">${esc(x)}</span>`).join('<span>›</span>')}</div>`, '');
    if (/panelMenu|dock|scrollTop|megaMenu/i.test(c)) return W(n, `<div class="sc-subnav sc-card">${items.map((x, i) => `<span class="${i ? '' : 'on'}">${esc(x)}</span>`).join('')}</div>`, '');
    return W(n, `<div class="sc-tabs">${items.map((t, i) => `<span class="${i ? '' : 'on'}">${esc(t)}</span>`).join('')}</div>`, '');
  }
  if (cat === 'Layout') {
    if (c === 'divider') return W(n, '<hr class="sc-hr">', '', 'width:100%');
    if (c === 'accordion') return W(n, ['Shipping', 'Payment', 'Notes'].map((x, i) => `<div class="sc-acc"><b>${i ? '▸' : '▾'} ${esc(i ? x : P.title || x)}</b>${i ? '' : '<div style="color:var(--mu)">Sent with Bring, tracking BR-48210.</div>'}</div>`).join(''), 'sc-card');
    return W(n, `${E(n, 'title', P.title || COMPONENTS[c].label, 'b')}<div style="color:var(--mu);font-size:12px;margin-top:6px">Drop components here in Studio; this prototype keeps containers flat.</div>`, 'sc-card sc-feed');
  }
  return W(n, `<b>${esc(COMPONENTS[c].label)}</b>`, 'sc-card', 'padding:12px');
}

// ---------- Planners: turn a request into typed edits. Neither can write HTML or CSS. ----------
const ENTITY = [
  [/\b(customer|client|account)s?\b/, 'CustomerList'], [/\b(product|catalog(ue)?|inventory|stock|sku)s?\b/, 'ProductCatalog'],
  [/\b(return|refund|rma)s?\b/, 'ReturnRequests'], [/\b(order|sale|purchase)s?\b/, 'OrderList'],
];
const TEMPLATE_WORDS = [
  [/master[- ]?detail|split view|list (and|with) detail/, 'MasterDetailScreen'], [/dashboard|overview|kpi page|home page/, 'DashboardScreen'],
  [/board|kanban|pipeline/, 'BoardScreen'], [/\b(form|wizard|create|registration|sign ?up)\b/, 'FormScreen'], [/record|detail page|profile page|details/, 'RecordPage'],
  [/inbox|queue|triage/, 'InboxScreen'], [/settings|preferences|configuration/, 'SettingsScreen'], [/\b(list|table|grid|index)\b/, 'ListScreen'],
];
const FREE_STYLE = /\b(css|style ?sheet|gradient|drop[- ]?shadow|box[- ]shadow|shadows?|\d+\s?px|pixels?|font[- ]size|padding|margin|animat\w*|blur|glassmorphism|opacity|z-index|inline style|custom html|html|border width|absolute(ly)? position\w*|background image|hex colou?r for the|neon|glow)\b/;
const MENU_WORDS = [[/slim ?(\+|plus)/, 'slim-plus'], [/\bslim\b|icon rail/, 'slim'], [/horizontal|top ?(nav|menu|bar navigation)|menu (at|across) the top/, 'horizontal'], [/drawer/, 'drawer'], [/overlay/, 'overlay'], [/reveal/, 'reveal'], [/static|full sidebar|always open/, 'static']];
const COMP_WORDS = [[/search/, 'globalSearch'], [/filters?/, 'filterBuilder'], [/saved views?|views menu/, 'savedViewsMenu'], [/column (chooser|picker)|columns button/, 'columnChooser'], [/bulk/, 'bulkBar'],
  [/charts?|graphs?/, 'chartWrapper'], [/kpis?|stats?|stat cards?|metrics?/, 'statCard'], [/activity|feed|history/, 'activityFeed'], [/notice|banner|alert/, 'notice'], [/tabs?/, 'tabSet'], [/checklist/, 'checklistSection'], [/table|list|grid/, 'dataList'], [/button/, 'actionButton']];
const quoted = t => (t.match(/["“'‘]([^"”'’]{1,80})["”'’]/) || [])[1];

function entityIn(t) { for (const [re, q] of ENTITY) if (re.test(t)) return q; return null; }
function guessSlice(t, q) {
  if (/ship/.test(t)) return 'ShipOrder'; if (/cancel/.test(t)) return 'CancelOrder'; if (/approve|refund/.test(t)) return 'ApproveReturn';
  if (/customer|register|sign ?up/.test(t)) return 'RegisterCustomer'; if (/product|sku|catalog/.test(t)) return 'AddProduct'; if (/order|checkout|buy/.test(t)) return 'PlaceOrder';
  return q ? commandFor(q) : null;
}
function homesFor(sc, c) { return homesOf(sc.template, c); }

function planOffline(raw, ctx) {
  const t = ' ' + raw.toLowerCase() + ' ';
  const s = state, edits = [], say = [], tweaks = [];
  let sc = ctx.screen; const sel = ctx.node ? findNode(s, ctx.node) : null;
  for (const x of Object.values(s.screens)) { const nm = pageTitle(x).toLowerCase(); if (nm.length > 2 && new RegExp(`\\b(on|to|in|for) (the )?${nm.replace(/[^a-z0-9 ]/g, '')}( screen| page)?\\b`).test(t)) { sc = x; ctx.screen = x; break; } }
  let handled = false;

  // 1. Free-form styling is not something a Studio screen can hold.
  if (FREE_STYLE.test(t)) {
    const alts = [];
    if (/gradient|background|colou?r|neon|glow/.test(t)) alts.push({ label: 'Colour the menu with the accent', edits: [{ op: 'profile', key: 'menuTheme', value: 'primary' }] });
    if (/shadow|soft|depth|glass/.test(t)) alts.push({ label: 'Round corners', edits: [{ op: 'profile', key: 'corners', value: 'round' }] });
    if (/font|px|size|pixel/.test(t)) alts.push({ label: 'Use IBM Plex Sans', edits: [{ op: 'profile', key: 'font', value: 'ibm-plex-sans' }] });
    if (/padding|margin|spac|dense|tight/.test(t) && sc) alts.push({ label: 'Try other templates', edits: [{ op: 'variations', screen: sc.name }] });
    if (!alts.length) alts.push({ label: 'Try another theme', edits: [{ op: 'profile', key: 'theme', value: 'Nordic' }] });
    edits.push({ op: 'refuse', request: raw, code: 'freeStylingNotAllowed', reason: 'Screens carry no per-element CSS or HTML. Look comes from the theme, the profile\'s appearance and component properties.', alternatives: alts });
    say.push('That one is outside what a Studio screen can hold, so I didn\'t change anything for it. The nearest things the profile can do are below.');
    return { reply: say.join(' '), edits, tweaks };
  }

  // 2. New screen
  const head = t.split(/ with | that has | including /)[0];
  const wantsNew = /\b(create|make|build|add|new|design|set up|start|give me)\b.{0,40}\b(screen|page|view|dashboard|overview|board|kanban|inbox|form|list)\b/.test(head) && !/\b(button|kpi|chart|notice|column|filter)s?\b/.test(head.replace(/kpi page/, ''));
  if (wantsNew) {
    let tpl = null; for (const [re, x] of TEMPLATE_WORDS) if (re.test(t)) { tpl = x; break; }
    tpl = tpl || s.profile.newScreens;
    const q = entityIn(t) || (tpl === 'SettingsScreen' ? 'OrderList' : 'OrderList');
    const label = QUERIES[q].label;
    const title = quoted(raw) || (tpl === 'DashboardScreen' ? label + ' overview' : tpl === 'BoardScreen' ? label + ' board' : tpl === 'FormScreen' ? COMMANDS[guessSlice(t, q)].label : tpl === 'SettingsScreen' ? 'Store settings' : tpl === 'InboxScreen' ? label + ' inbox' : label);
    const name = pascal(title);
    edits.push({ op: 'addScreen', name, title, template: tpl, query: q, module: COMMANDS[commandFor(q)].module, command: tpl === 'FormScreen' ? guessSlice(t, q) : undefined });
    if (['ListScreen', 'BoardScreen'].includes(tpl)) edits.push({ op: 'insert', screen: name, slot: 'toolbar', component: 'actionButton', props: { label: newLabel(q), emphasis: 'primary', icon: 'plus', slice: commandFor(q) } });
    const withBtn = raw.match(/with (?:an? )?([A-Za-z ]{2,40}?) button/i);
    if (withBtn) { const sl = guessSlice(withBtn[1].toLowerCase(), q); const slot = { ListScreen: 'toolbar', BoardScreen: 'toolbar', FormScreen: 'actions' }[tpl] || Object.keys(TEMPLATES[tpl].slots).find(k => TEMPLATES[tpl].slots[k].includes('actionButton'));
      if (slot && tpl !== 'FormScreen') { edits.splice(1, edits.length - 1); edits.push({ op: 'insert', screen: name, slot, component: 'actionButton', props: { label: withBtn[1].trim().replace(/^./, c => c.toUpperCase()), emphasis: 'primary', icon: /approve/i.test(withBtn[1]) ? 'check' : /ship/i.test(withBtn[1]) ? 'truck' : 'plus', slice: sl } }); }
      else if (!slot) edits.push({ op: 'insert', screen: name, slot: 'toolbar', component: 'actionButton', props: { label: withBtn[1].trim(), emphasis: 'primary', slice: sl } }); }
    if (/mobile|phone/.test(t)) edits.push({ op: 'addArtboard', screen: name, size: 'compact' });
    say.push(`I started ${title} from ${tpl} in ${BLUEPRINT}, bound to the ${q} query. The header is the template's; everything under it is the screen's own and can be changed.`);
    tweaks.push(...defaultTweaks(null, tpl));
    handled = true;
  }

  // 3. Variations
  if (!handled && /variation|alternative|options|explore|other layouts?|different layout|versions|a few ways/.test(t) && sc) {
    let temps = []; for (const [re, x] of TEMPLATE_WORDS) if (re.test(t) && x !== sc.template) temps.push(x);
    edits.push({ op: 'variations', screen: sc.name, templates: temps.length ? temps.slice(0, 3) : undefined });
    say.push(`Here are layouts for ${pageTitle(sc)} from other templates in the profile. Each keeps the data context and the screen's own actions; anything without an outlet in the new template is listed. Press Keep on the one you want.`);
    handled = true;
  }

  // 4. Appearance
  const before = edits.length;
  if (/\b(dark|darker|night|dim)\b/.test(t) && !/dark (menu|sidebar|nav)/.test(t)) edits.push({ op: 'profile', key: 'colorScheme', value: 'dark' });
  else if (/\b(light|lighter|bright|white)\b( mode| theme| scheme)?/.test(t) && !/light (menu|sidebar)/.test(t) && /mode|theme|scheme|lighter|brighter|make it light/.test(t)) edits.push({ op: 'profile', key: 'colorScheme', value: 'light' });
  if (/nordic/.test(t)) edits.push({ op: 'profile', key: 'theme', value: 'Nordic' });
  if (/studio( dark)? theme|like studio/.test(t)) edits.push({ op: 'profile', key: 'theme', value: 'Studio Dark' });
  const hex = (raw.match(/#[0-9a-fA-F]{3,8}\b/) || [])[0];
  const named = Object.keys(ACCENT_PRESETS).find(k => new RegExp('\\b' + k + '\\b').test(t));
  if (hex) edits.push({ op: 'profile', key: 'accent', value: hex.toLowerCase() });
  else if (named && /accent|colou?r|brand|primary|use|make|switch|more|tone|\bin\b/.test(t)) edits.push({ op: 'profile', key: 'accent', value: ACCENT_PRESETS[named] });
  if (/round(ed)?|soft(er)?|pill/.test(t) && !/rounded? up/.test(t)) edits.push({ op: 'profile', key: 'corners', value: 'round' });
  if (/sharp|square|boxy|crisp/.test(t)) edits.push({ op: 'profile', key: 'corners', value: 'sharp' });
  if (/serif/.test(t) && !/sans/.test(t)) edits.push({ op: 'profile', key: 'font', value: 'source-serif-4' });
  else if (/plex/.test(t)) edits.push({ op: 'profile', key: 'font', value: 'ibm-plex-sans' });
  else if (/system font|native font/.test(t)) edits.push({ op: 'profile', key: 'font', value: 'system-ui' });
  else if (/\binter\b/.test(t)) edits.push({ op: 'profile', key: 'font', value: 'inter' });
  if (/menu|sidebar|nav|rail/.test(t)) for (const [re, m] of MENU_WORDS) if (re.test(t)) { edits.push({ op: 'profile', key: 'menuMode', value: m }); break; }
  if (/(dark) (menu|sidebar|nav)/.test(t)) edits.push({ op: 'profile', key: 'menuTheme', value: 'dark' });
  if (/(primary|brand(ed)?|colou?red|accent) (menu|sidebar|nav)/.test(t)) edits.push({ op: 'profile', key: 'menuTheme', value: 'primary' });
  if (/(light) (menu|sidebar|nav)/.test(t)) edits.push({ op: 'profile', key: 'menuTheme', value: 'light' });
  if (/no (sidebar|menu|navigation)|full ?page/.test(t)) edits.push({ op: 'profile', key: 'root', value: 'FullPage' });
  else if (/minimal shell/.test(t)) edits.push({ op: 'profile', key: 'root', value: 'MinimalShell' });
  else if (/dashboard shell/.test(t)) edits.push({ op: 'profile', key: 'root', value: 'DashboardShell' });
  else if (/app ?shell|back to (the )?sidebar/.test(t)) edits.push({ op: 'profile', key: 'root', value: 'AppShell' });
  const appName = raw.match(/(?:call the app|app name|rename the app|name the app)\s*(?:to|as)?\s*["“']?([^"”'.]{2,40})/i);
  if (appName) { const nm = appName[1].trim(); edits.push({ op: 'profile', key: 'name', value: nm }); edits.push({ op: 'profile', key: 'initials', value: nm.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() }); }
  if (edits.length > before) {
    if (!handled) say.push('Those go on the UI profile, so every screen picks them up at once.');
    tweaks.push(...defaultTweaks(sc));
    handled = true;
  }

  // 5. Content edits on the active screen
  if (sc && !wantsNew) {
    if (/\b(add|put|include|show|give)\b/.test(t)) {
      if (/kpi|stat|metric|numbers?|figures/.test(t)) {
        const listPart = (raw.split(/:|\bwith\b|\bfor\b/i)[1] || '').split(/,|\band\b/i).map(x => x.trim()).filter(x => x && x.length < 40);
        const base = kpisFor(sc.query);
        const items = listPart.length ? listPart.map((l, i) => kpiFromLabel(l, i)) : base;
        const homes = homesFor(sc, 'statCard');
        if (homes.length) items.slice(0, 4).forEach(k => edits.push({ op: 'insert', screen: sc.name, slot: homes[0], component: 'statCard', props: k }));
        else edits.push({ op: 'insert', screen: sc.name, slot: 'kpis', component: 'statCard', props: items[0] });
        handled = true;
      }
      if (/chart|graph|trend/.test(t)) {
        const kind = /bar|by |per /.test(t) ? 'bar' : /funnel/.test(t) ? 'funnel' : /line/.test(t) ? 'line' : 'area';
        const q = /revenue|sales over|month/.test(t) ? 'RevenueByMonth' : entityIn(t) || sc.query;
        edits.push({ op: 'insert', screen: sc.name, slot: homesFor(sc, 'chartWrapper')[0] || 'charts', component: 'chartWrapper', props: { title: quoted(raw) || (q === 'RevenueByMonth' ? 'Revenue by month' : QUERIES[q].label + ' by ' + (QUERIES[q].group || 'status')), kind, query: q } });
        handled = true;
      }
      if (/button|action/.test(t)) {
        const slice = guessSlice(t, sc.query);
        const label = quoted(raw) || (raw.match(/button (?:called|named|labell?ed|for|to)?\s*([A-Za-z ]{2,30})/i) || [])[1]?.trim() || COMMANDS[slice]?.label || 'Action';
        const ic = /ship/.test(t) ? 'truck' : /export|download/.test(t) ? 'download' : /cancel/.test(t) ? 'x' : /approve/.test(t) ? 'check' : /customer/.test(t) ? 'user-plus' : 'plus';
        edits.push({ op: 'insert', screen: sc.name, slot: homesFor(sc, 'actionButton')[0] || 'toolbar', component: 'actionButton', props: { label: label.replace(/^./, c => c.toUpperCase()), emphasis: /primary|main/.test(t) ? 'primary' : 'secondary', icon: ic, slice: /export|download/.test(t) ? undefined : slice } });
        handled = true;
      }
      if (/notice|banner|alert|message/.test(t)) {
        const tone = /warn|careful|delay/.test(t) ? 'warning' : /error|fail|danger/.test(t) ? 'danger' : /success|done/.test(t) ? 'success' : 'info';
        const homes = homesFor(sc, 'notice');
        edits.push({ op: 'insert', screen: sc.name, slot: homes[0] || 'footer', component: 'notice', props: { tone, text: quoted(raw) || 'Orders placed after 15:00 ship the next working day.' } });
        handled = true;
      }
      if (/activity|feed/.test(t)) { edits.push({ op: 'insert', screen: sc.name, slot: homesFor(sc, 'activityFeed')[0] || 'aside', component: 'activityFeed', props: { label: 'Recent activity' } }); handled = true; }
      if (/checklist/.test(t)) { edits.push({ op: 'insert', screen: sc.name, slot: homesFor(sc, 'checklistSection')[0] || 'aside', component: 'checklistSection', props: { title: 'Before shipping', items: ['Verify address', 'Confirm payment', 'Pack and label'] } }); handled = true; }
      if (/\b(table|list)\b/.test(t) && !/kpi|chart/.test(t) && !handled) { const q = entityIn(t) || sc.query; edits.push({ op: 'insert', screen: sc.name, slot: homesFor(sc, 'dataList')[0] || 'list', component: 'dataList', props: { label: QUERIES[q].label, rows: q, columns: cols(q, 4), selectionMode: 'none', pageSize: 5 } }); handled = true; }
    }
    if (/\b(remove|delete|drop|get rid of|hide|without)\b/.test(t)) {
      for (const [re, c] of COMP_WORDS) if (re.test(t)) {
        const ids = Object.values(sc.nodes).filter(n => n.c === c).map(n => n.id);
        ids.forEach(id => edits.push({ op: 'remove', node: id }));
        if (!ids.length) say.push(`${pageTitle(sc)} has no ${COMPONENTS[c].label.toLowerCase()} to remove.`);
        handled = true; break;
      }
      if (!handled && /header|title/.test(t)) { const h = sc.slots.header?.[0]; if (h) edits.push({ op: 'remove', node: h }); handled = true; }
    }
    const rn = raw.match(/(?:rename|retitle|call it|title it|change the title to|title to)\s+(?:it\s+|this\s+)?(?:to\s+)?["“']?([^"”'.]{2,60})/i);
    if (rn) {
      const target = sel && ['actionButton', 'dataList', 'statCard', 'chartWrapper', 'notice'].includes(sel.node.c) ? sel.node : sc.nodes[sc.slots.header?.[0]];
      if (target) { const prop = COMPONENTS[target.c].props.title ? 'title' : COMPONENTS[target.c].props.label ? 'label' : 'text'; edits.push({ op: 'set', node: target.id, prop, value: rn[1].trim() }); handled = true; }
    }
    const ps = t.match(/(\d+)\s*(rows|items|per page)/);
    if (ps) { const dl = Object.values(sc.nodes).find(n => n.c === 'dataList'); if (dl) edits.push({ op: 'set', node: dl.id, prop: 'pageSize', value: Number(ps[1]) }); handled = true; }
    // A component named by its label: "make the New order button primary".
    if (!handled) for (const n of Object.values(sc.nodes)) {
      const lab = String(n.props.label || '').toLowerCase(); if (!lab || lab.length < 3 || !t.includes(lab)) continue;
      if (/\b(primary|main|prominent)\b/.test(t) && COMPONENTS[n.c].props.emphasis) { edits.push({ op: 'set', node: n.id, prop: 'emphasis', value: 'primary' }); handled = true; }
      else if (/\b(secondary|less prominent|quieter)\b/.test(t) && COMPONENTS[n.c].props.emphasis) { edits.push({ op: 'set', node: n.id, prop: 'emphasis', value: 'secondary' }); handled = true; }
      else if (/\b(remove|delete|drop)\b/.test(t)) { edits.push({ op: 'remove', node: n.id }); handled = true; }
      if (handled) break;
    }
    if (sel && /\b(this|it|selected)\b/.test(t)) {
      if (/primary|main|prominent/.test(t) && sel.node.c === 'actionButton') { edits.push({ op: 'set', node: sel.node.id, prop: 'emphasis', value: 'primary' }); handled = true; }
      if (/(warning|danger|success|info)/.test(t) && COMPONENTS[sel.node.c].props.tone) { edits.push({ op: 'set', node: sel.node.id, prop: 'tone', value: t.match(/warning|danger|success|info/)[0] }); handled = true; }
      if (/\b(bar|line|area|funnel)\b/.test(t) && sel.node.c === 'chartWrapper') { edits.push({ op: 'set', node: sel.node.id, prop: 'kind', value: t.match(/\b(bar|line|area|funnel)\b/)[1] }); handled = true; }
      if (/\b(remove|delete)\b/.test(t) && !edits.some(e => e.op === 'remove')) { edits.push({ op: 'remove', node: sel.node.id }); handled = true; }
      const ent = entityIn(t); if (ent && ['dataList', 'kanbanBoard', 'inboxList'].includes(sel.node.c) && /show|bind|use|list/.test(t)) { edits.push({ op: 'set', node: sel.node.id, prop: 'rows', value: ent }); handled = true; }
    }
    if (/mobile|phone|small screens?|compact/.test(t) && !/menu/.test(t)) { edits.push({ op: 'addArtboard', screen: sc.name, size: 'compact' }); say.push('I added a phone artboard; the template switches to its compact arrangement on its own.'); handled = true; }
  }

  // 6. Tweaks and review
  if (/tweak|slider|knob|fine.?tune|adjust/.test(t)) { tweaks.push(...defaultTweaks(sc)); say.push('I put the settings worth playing with in Tweaks. Each one is bound to the profile or to a property the component exposes, so nothing they produce is off-system.'); handled = true; }
  if (/review|check|accessib|a11y|problems|audit|contrast/.test(t)) {
    const pr = findProblems(state);
    say.push(pr.length ? `I found ${pr.length} thing${pr.length > 1 ? 's' : ''} to look at: ` + pr.slice(0, 4).map(p => `${p.sev.toLowerCase()} — ${p.msg}`).join(' ') + ' The Problems tab has one-click fixes.' : 'Nothing to fix: the accent passes AA against white, every list is bound to a query and every button submits a state change.');
    ctx.openProblems = pr.length > 0; handled = true;
  }

  if (!handled) {
    return { reply: 'I can only change this design through the UI profile, the blueprint\'s templates and the components they accept. Try one of these: start a screen from a template, add KPIs, a chart or an action, explore layout variations, or change the theme, accent, corners, font or menu mode.', edits: [], tweaks: [] };
  }
  if (!say.length) say.push(edits.length ? 'Done. Each change below is a Scene edit, checked against the profile before it was applied.' : '');
  return { reply: say.join(' '), edits, tweaks };
}

function kpiFromLabel(l, i) {

function screenplayText() {
  const p = state.profile, L = [];
  L.push('# Draft generated by the design canvas prototype - not run through the Screenplay compiler');
  L.push(`ui profile Desktop`, `  target platform web`, `  target size regular`, `  theme ${p.theme.replace(/\s+/g, '')}`, '');
  L.push(`  root template blueprint ${BLUEPRINT} ${p.root} version "${BLUEPRINT_VERSION}"`);
  if (SHELLS[p.root].defaultMenu !== null) { L.push(`    option navigationMode ${p.menuMode}`, `    option menuTheme ${p.menuTheme}`); }
  L.push('', '  identity', `    name "${p.name}"`, `    logo initials "${p.initials}"`, '', '  appearance', `    color scheme ${p.colorScheme}`, `    accent "${p.accent}"`, `    corners ${p.corners}`, `    font ${p.font}`, '');
  L.push(`  new screens use template blueprint ${BLUEPRINT} ${p.newScreens}`, '', '  packages', ...p.packages.map(x => '    ' + x), '');
  const mods = {}; Object.values(state.screens).filter(s => !s.variantOf).forEach(s => (mods[s.module] = mods[s.module] || []).push(s));
  for (const [m, list] of Object.entries(mods)) {
    L.push(`module ${m}`);
    for (const sc of list) {
      L.push(`  feature ${pascal(QUERIES[sc.query].label)}`, `    slice StateView ${sc.name}List`, `      screen ${sc.name}`, `        data ${sc.query}[] via query ${sc.query}`, `        template blueprint ${BLUEPRINT} ${sc.template} version "${BLUEPRINT_VERSION}"`);
      const h = sc.nodes[sc.slots.header?.[0]];
      if (h) { L.push('          header', `            title "${h.props.title}"`); if (h.props.subtitle) L.push(`            subtitle "${h.props.subtitle}"`); }
      for (const [slot, ids] of Object.entries(sc.slots)) for (const id of ids) {
        const n = sc.nodes[id]; if (n.owner === 'inherited') continue;
        L.push(`        component Cratis.Blueprint.Default.${n.c} ${id.replace(/-/g, '')}`, `          id "${id}"`, `          presentation outlet "${slot}"`);
        if (n.props.rows) L.push(`          context from query ${n.props.rows}`);
        for (const [k, v] of Object.entries(n.props)) { if (k === 'rows' || v === undefined || v === '') continue; if (k === 'slice') continue; L.push(`          property ${k} = ${JSON.stringify(Array.isArray(v) ? v.join(',') : String(v))}`); }
        if (n.props.icon) L.push(`          icon ${n.props.icon}`);
        if (n.props.slice) L.push(`          on click`, `            execute ${COMMANDS[n.props.slice].module}.${n.props.slice}`);
      }
      L.push('');
    }
  }
  return L.join('\n');
}

  const p = e.target.closest('[data-play]'); if (p) { e.stopImmediatePropagation(); openPreview(p.dataset.play); return; }
  const w = e.target.closest('[data-region-wrap]'); if (w) { e.stopImmediatePropagation(); wrapRegion(w.dataset.regionWrap); }
}, true);
labels.addEventListener('dblclick', e => {
  const t = e.target.closest('[data-region-title]'); if (!t) return;
  const g = state.regions.find(x => x.id === t.dataset.regionTitle);
  t.textContent = g.title; t.contentEditable = 'true'; t.focus(); document.getSelection().selectAllChildren(t);
  const done = keep => { t.contentEditable = 'false'; const v = t.textContent.trim(); if (keep && v && v !== g.title) { const before = clone(state); g.title = v; commit(before, clone(state), `Rename region to ${v}`); } else renderCanvas(); };
  t.onblur = () => done(true); t.onkeydown = k => { if (k.key === 'Enter') { k.preventDefault(); t.blur(); } if (k.key === 'Escape') { t.onblur = null; done(false); } };
});

// ---------- notes ----------
canvas.addEventListener('dblclick', e => { const n = e.target.closest('[data-note]'); if (n) { e.stopImmediatePropagation(); editNote(n.dataset.note); } }, true);
function editNote(id) {
  const el = world.querySelector(`[data-note="${id}"] .note-t`); const n = state.notes.find(x => x.id === id); if (!el || !n) return;
  el.textContent = n.text; el.contentEditable = 'true'; el.focus(); document.getSelection().selectAllChildren(el); document.getSelection().collapseToEnd();
  el.onblur = () => { el.contentEditable = 'false'; const v = el.innerText.trim(); if (v !== n.text) { const before = clone(state); n.text = v; const tag = v.match(/^\[(QUESTION|RISK|DECISION|ASSUMPTION)\]/i); if (tag) n.colour = { QUESTION: 'yellow', RISK: 'pink', DECISION: 'green', ASSUMPTION: 'blue' }[tag[1].toUpperCase()]; commit(before, clone(state), 'Edit note'); } else renderCanvas(); };
  el.onkeydown = k => { if (k.key === 'Escape') el.blur(); k.stopPropagation(); };
}

// ---------- chat bubbles ----------
function openBubble(id) {
  closeBubble();
  const b = state.bubbles.find(x => x.id === id), el = world.querySelector(`[data-bubble="${id}"]`); if (!b || !el) return;
  const f = b.node && findNode(state, b.node);
  const pop = document.createElement('div'); pop.className = 'bub-pop'; pop.dataset.for = id;
  pop.innerHTML = `<div class="bp-head"><b>${esc(ME.name)}</b>${f ? `<span class="chip">${esc(COMPONENTS[f.node.c].label)} on ${esc(pageTitle(f.screen))}</span>` : ''}<span class="grow"></span><button class="ib" data-bp="close" aria-label="Close">×</button></div>
    <div class="bp-list">${b.thread.length ? b.thread.map(m => `<div class="bp-m"><span class="av2s">${esc(initials(m.by))}</span><div><div class="bp-w"><b>${esc(m.by)}</b> ${ago(m.at)}</div><div>${esc(m.text)}</div>${m.topic ? `<button class="mini" data-bp-topic="${m.topic}">Open the topic</button>` : ''}</div></div>`).join('') : '<div class="bp-empty">No comments yet. Be the first!</div>'}</div>
    <div class="bp-in"><textarea rows="2" placeholder="Write a comment… (Enter to send)" aria-label="Comment"></textarea>
    <button class="ib" data-bp="ask" title="Ask your agents about this" aria-label="Ask your agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z"/></svg></button>
    <button class="send-s" data-bp="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`;
  canvas.appendChild(pop);
  const r = el.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  Object.assign(pop.style, { left: Math.min(cr.width - pop.offsetWidth - 12, r.right - cr.left + 10) + 'px', top: Math.max(70, Math.min(cr.height - pop.offsetHeight - 90, r.top - cr.top - 10)) + 'px' });
  const ta = pop.querySelector('textarea'); ta.focus();
  const post = () => { const v = ta.value.trim(); if (!v) return null; const before = clone(state); const m = { by: ME.name, text: v, at: Date.now() }; b.thread.push(m); commit(before, clone(state), 'Comment'); return m; };
  ta.addEventListener('keydown', k => { k.stopPropagation(); if (k.key === 'Enter' && !k.shiftKey) { k.preventDefault(); if (post()) openBubble(id); } if (k.key === 'Escape') closeBubble(); });
  pop.addEventListener('pointerdown', ev => ev.stopPropagation());
  pop.addEventListener('click', ev => {
    const t = ev.target.closest('[data-bp-topic]'); if (t) { ui.panel = 'topics'; ui.topicId = t.dataset.bpTopic; renderPanelFrame(); renderPanel(); renderScope(); requestAnimationFrame(() => applyView()); return; }
    const a = ev.target.closest('[data-bp]')?.dataset.bp; if (!a) return;
    if (a === 'close') closeBubble();
    if (a === 'send') { if (post()) openBubble(id); }
    if (a === 'ask') {
      post();
      const text = b.thread.map(m => m.text).join('\n'); if (!text) { toast('Write what you want first, then ask your agents.'); return; }
      closeBubble();
      if (b.ab) ui.active = b.ab;
      send(text, { node: b.node, newTopic: true, title: 'Bubble: ' + titleFrom(b.thread[b.thread.length - 1].text) }).then(() => {
        const s2 = state.bubbles.find(x => x.id === id); if (!s2) return;
        s2.thread.push({ by: 'Claude', text: 'Answered in a topic.', at: Date.now(), topic: ui.topicId }); save(); renderCanvas();
      });
    }
  });
}
function closeBubble() { canvas.querySelectorAll('.bub-pop').forEach(p => p.remove()); }

// ---------- keyboard, fit, and start-up ----------
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && ui.obj && !e.repeat) { e.stopImmediatePropagation(); canvas.querySelector('.mini-tools [data-mt="del"]')?.click(); }
  else if (e.key === 'Escape' && (ui.obj || canvas.querySelector('.bub-pop'))) { closeBubble(); ui.obj = null; renderCanvas(); }
  else if (e.key === 'n' && !e.metaKey && !e.ctrlKey) setMode('note');
  else if (e.key === 'r' && !e.metaKey && !e.ctrlKey) setMode('region');
}, true);
fit = function (abs) {
  const rects = abs ? abs.map(abRect) : state.artboards.map(abRect).concat((state.regions || []).map(g => ({ ...g, y: g.y - 40 })), (state.notes || []).map(noteRect));
  if (!rects.length) return;
  const x0 = Math.min(...rects.map(r => r.x)), y0 = Math.min(...rects.map(r => r.y)), x1 = Math.max(...rects.map(r => r.x + r.w)), y1 = Math.max(...rects.map(r => r.y + r.h));
  const r = canvas.getBoundingClientRect(); if (!r.width) return;
  const narrow = r.width < 640, L = narrow ? 20 : 86, R = 28, T = narrow ? 150 : 104, B = narrow ? 150 : 104;
  const z = Math.min((r.width - L - R) / (x1 - x0), (r.height - T - B) / (y1 - y0), 1);
  ui.z = Math.max(.04, z); ui.px = L + ((r.width - L - R) - (x1 - x0) * ui.z) / 2 - x0 * ui.z; ui.py = T + ((r.height - T - B) - (y1 - y0) * ui.z) / 2 - y0 * ui.z;
  applyView();
};
normalizeBoard();
renderAll();
requestAnimationFrame(() => fit());

</script>
