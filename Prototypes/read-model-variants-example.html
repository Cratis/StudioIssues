<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Read Model Variants — example</title>
<!-- Prototype: the Command dialog in Cratis Studio, designed visually like the Query editor.
     Standalone: open this file in a browser. Everything is local state; nothing is saved. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b131b}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.kick{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8b9aa7}
.help{font-size:12px;color:#8b9aa7;line-height:1.45;margin:4px 0 0}
.f{background:#0f1a24;border:1px solid #2b3d4b;color:#e6edf3;border-radius:6px;padding:0 8px;height:30px;font:13px 'Nunito Sans',system-ui,sans-serif;min-width:0}
.f:focus{outline:none;border-color:#4fc3b8}
.f.sm{height:26px;font-size:12px;padding:0 6px}
.x{background:transparent;border:0;color:#8b9aa7;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:#1f2e3a;color:#ffb4b4}
.add{background:transparent;border:0;color:#5aa0f0;font-weight:700;font-size:13px;padding:6px 0;text-align:left}
.seg{display:flex;border:1px solid #2b3d4b;border-radius:8px;padding:3px;gap:2px;background:#0f1a24}
.seg button{border:0;border-radius:6px;padding:7px 14px;font-size:13.5px;font-weight:700}
.step{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;font-size:14px;color:#dbe4ea;text-align:left}
.step:hover{background:#17242f}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.glyph{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:17px;padding:0 4px;border-radius:4px;color:#fff;font:700 9px system-ui,sans-serif;flex:none}
.concept{background:#b4a5ff;color:#1c1040;font-weight:700;padding:1px 6px;border-radius:4px;font-size:11px}
.pdot{position:absolute;width:10px;height:10px;border-radius:50%}
.ln{display:flex;white-space:pre;font-size:12px;line-height:1.7}
.lnno{width:30px;color:#4b5e6c;text-align:right;padding-right:10px;flex:none;user-select:none}
.scroll::-webkit-scrollbar{width:10px;height:10px}.scroll::-webkit-scrollbar-thumb{background:#2b3d4b;border-radius:10px}
.vnode{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid;border-radius:9px;padding:8px 11px;min-width:150px;max-width:230px}
.role{font:800 9px 'JetBrains Mono',monospace;border-radius:3px;padding:2px 5px;letter-spacing:.04em;border:0}
</style>

<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width: 1520px; height: 1000px; display: flex; flex-direction: column; background: #15212b; color: #e6edf3; font-family: 'Nunito Sans', system-ui, sans-serif; border: 1px solid #2d3e4c; border-radius: 14px; overflow: hidden">

  <div style="height: 54px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #0f1a24; border-bottom: 1px solid #22323f">
    <span style="background: #a8c62a; color: #1c2408; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 6px 9px; border-radius: 5px">READ MODEL</span>
    <span style="font-size: 17px; font-weight: 800">{{name}}</span>
    <sc-if value="{{vOn}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #c6e03a; border: 1px solid #4a5a20; border-radius: 999px; padding: 2px 9px">{{variantCount}} variants</span></sc-if>
    <span style="flex: 1"></span>
    <button aria-label="Close" style="background: transparent; border: 0; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <!-- Sidebar -->
    <div class="scroll" style="width: 226px; flex: none; background: #111c26; border-right: 1px solid #22323f; display: flex; flex-direction: column; padding: 16px 12px 12px; overflow-y: auto">
      <div class="kick" style="margin: 0 6px 8px">Read model</div>
      <button class="step" onClick="{{selDefinition}}" style="background: #16302f; border-color: #2f6e68">
        <span class="dot" style="background: #c6e03a"></span><span style="line-height: 1.3">Definition &amp; projection</span>
        <span style="margin-left: auto; font-size: 10px; font-weight: 800; color: #c6e03a; background: #2a3314; border-radius: 5px; padding: 2px 6px; white-space: nowrap">{{defBadge}}</span>
      </button>
      <sc-if value="{{vOn}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 1px; margin: 4px 0 0 18px; border-left: 1px solid #2b3d4b; padding-left: 6px">
          <sc-for list="{{sideVariants}}" as="v" hint-placeholder-count="3">
            <button class="step" onClick="{{v.pick}}" style="padding: 5px 8px; font-size: 13px; background: {{v.bg}}">
              <span class="dot" style="background: {{v.dot}}"></span><span>{{v.name}}</span>
              <sc-if value="{{v.hasErr}}" hint-placeholder-val="{{ false }}"><span style="margin-left: auto; font-size: 10px; font-weight: 800; color: #ff9b9b">{{v.err}}</span></sc-if>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <div class="kick" style="margin: 22px 6px 8px">Queries</div>
      <sc-for list="{{queries}}" as="q" hint-placeholder-count="2">
        <div style="padding: 6px 10px; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span class="dot" style="background: #4fc3b8"></span>{{q.name}}</span>
          <sc-if value="{{q.showTarget}}" hint-placeholder-val="{{ false }}">
            <select class="f sm mono" value="{{q.target}}" onChange="{{q.set}}" aria-label="Reads" style="margin-left: 15px; border-color: {{q.bd}}; color: {{q.fg}}"><option data-for="q.options" data-as="o" value="{{o}}">{{o}}</option></select>
          </sc-if>
        </div>
      </sc-for>
      <button class="add" style="color: #c9d4dd; font-weight: 600; padding: 8px 10px">+ Add query</button>
      <span style="flex: 1"></span>
      <div style="border-top: 1px solid #22323f; padding: 12px 6px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11.5px; color: #8b9aa7">
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #c6e03a"></span>Read model</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #f0913a"></span>Event</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #4fc3b8"></span>Query</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #a78bfa"></span>C#</span>
      </div>
    </div>

    <!-- Main -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      <div style="flex: none; display: flex; align-items: flex-start; gap: 24px; padding: 16px 22px 12px">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 22px; font-weight: 800">{{name}}</div>
          <div style="font-size: 13px; color: #8b9aa7; margin-top: 4px">{{builtFrom}}</div>
        </div>
        <div>
          <div class="kick" style="margin-bottom: 6px">Variants</div>
          <div class="seg" title="{{offTitle}}">
            <button onClick="{{variantsOff}}" style="background: {{segOff.bg}}; color: {{segOff.fg}}; opacity: {{segOff.op}}">Off</button>
            <button onClick="{{variantsOn}}" style="background: {{segOn.bg}}; color: {{segOn.fg}}">On</button>
          </div>
        </div>
        <div>
          <div class="kick" style="margin-bottom: 6px">Kept</div>
          <div class="seg">
            <button onClick="{{keptM}}" style="background: {{segM.bg}}; color: {{segM.fg}}">Materialized</button>
            <button onClick="{{keptP}}" style="background: {{segP.bg}}; color: {{segP.fg}}">Passive</button>
          </div>
        </div>
      </div>

      <!-- Variant strip -->
      <sc-if value="{{vOn}}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; margin: 0 22px 10px; border: 1px solid #2b3d4b; border-radius: 10px; background: #111c26; padding: 10px 12px">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px">
            <span class="kick">Variants of {{name}} · one at a time</span>
            <span style="font-size: 12px; color: #8b9aa7; flex: 1">An instance is in exactly one variant. Entering one moves it out of the others.</span>
            <button onClick="{{fillExample}}" style="background: transparent; border: 0; color: #8b9aa7; font-size: 11.5px; text-decoration: underline">prototype: fill in the adoption example</button>
          </div>
          <div style="display: flex; align-items: stretch; gap: 8px; overflow-x: auto" class="scroll">
            <button class="vnode" onClick="{{selShared}}" style="border-color: {{shNode.bd}}; background: {{shNode.bg}}; min-width: 128px; border-style: dashed">
              <span style="font-size: 13px; font-weight: 800; color: #dbe4ea">Shared</span>
              <span style="font-size: 11px; color: #8b9aa7">applies to every variant</span>
              <span class="mono" style="font-size: 10.5px; color: #f0a060">{{shNode.events}}</span>
            </button>
            <span style="align-self: center; color: #3a4b58; font-size: 16px">│</span>
            <sc-for list="{{vnodes}}" as="v" hint-placeholder-count="3">
              <button class="vnode" onClick="{{v.pick}}" onDragOver="{{v.over}}" onDrop="{{v.drop}}" style="border-color: {{v.bd}}; background: {{v.bg}}; box-shadow: {{v.sh}}">
                <span style="display: flex; align-items: center; gap: 6px"><span class="dot" style="background: #c6e03a"></span><span style="font-size: 13px; font-weight: 800; color: #eef5d0">{{v.name}}</span><sc-if value="{{v.isLive}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9.5px; font-weight: 800; background: #c6e03a; color: #1c2408; border-radius: 3px; padding: 1px 5px">PREVIEW IS HERE</span></sc-if></span>
                <span style="font-size: 11px; color: {{v.enFg}}">{{v.enters}}</span>
                <span style="font-size: 10.5px; color: #8b9aa7">{{v.props}}</span>
              </button>
            </sc-for>
            <button onClick="{{addVariant}}" style="border: 1px dashed #4a5a20; border-radius: 9px; background: transparent; color: #c6e03a; font-size: 12.5px; font-weight: 700; padding: 0 14px; min-width: 110px">+ Variant</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{msg.has}}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; margin: 0 22px 10px; display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: #8fe3d9; background: #12302d; border: 1px solid #2f6e68; border-radius: 8px; padding: 8px 12px">
          <span style="flex: 1">{{msg.text}}</span>
          <sc-if value="{{msg.hasAction}}" hint-placeholder-val="{{ false }}"><button onClick="{{msg.act}}" style="background: #4dc0b5; color: #0d1a20; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 800; white-space: nowrap">{{msg.actLabel}}</button></sc-if>
          <button class="x" onClick="{{clearMsg}}" aria-label="Dismiss"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </sc-if>

      <div style="flex: 1; min-height: 0; display: flex; border-top: 1px solid #22323f">

        <!-- canvas -->
        <div class="scroll" style="flex: 1; min-width: 0; overflow: auto; padding: 14px 18px 24px">
          <div style="display: flex; width: 900px; margin-bottom: 10px">
            <span class="kick" style="width: 520px">{{cv.srcTitle}}</span>
            <span class="kick">{{cv.tgtTitle}}</span>
          </div>
          <div style="position: relative; width: 900px; height: {{cv.h}}px">
            <sc-for list="{{cv.lines}}" as="l" hint-placeholder-count="8">
              <svg width="900" height="{{cv.h}}" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none" aria-hidden="true">
                <path d="{{l.d}}" fill="none" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" opacity="{{l.o}}" stroke-linecap="round"></path>
                <path d="{{l.d}}" fill="none" stroke="transparent" stroke-width="12" style="pointer-events: stroke; cursor: pointer" onClick="{{l.pick}}"></path>
              </svg>
            </sc-for>
            <sc-for list="{{cv.labels}}" as="t" hint-placeholder-count="2">
              <button onClick="{{t.pick}}" style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; transform: translate(-50%, -50%); background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}}; border-radius: 4px; padding: 1px 6px; font: 800 9.5px 'JetBrains Mono', monospace; white-space: nowrap; z-index: 3">{{t.text}}</button>
            </sc-for>

            <sc-for list="{{cv.sources}}" as="f" hint-placeholder-count="3">
              <div style="position: absolute; left: 0; top: {{f.y}}px; width: 360px; opacity: {{f.op}}">
                <div draggable="{{f.draggable}}" onDragStart="{{f.drag}}" onDragEnd="{{dragEnd}}" style="height: 30px; display: flex; align-items: center; gap: 6px; background: {{f.hbg}}; color: #2a1405; border-radius: 5px; padding: 0 6px 0 4px; font-size: 12.5px; font-weight: 800; cursor: grab; position: relative; border-left: 4px solid {{f.edge}}">
                  <button onClick="{{f.toggle}}" aria-label="Show or hide properties" style="background: transparent; border: 0; width: 18px; height: 18px; color: #2a1405; font-size: 10px">{{f.caret}}</button>
                  <sc-if value="{{f.hasRole}}" hint-placeholder-val="{{ true }}"><button class="role" onClick="{{f.flipRole}}" title="{{f.roleTitle}}" style="background: {{f.roleBg}}; color: {{f.roleFg}}">{{f.role}}</button></sc-if>
                  <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.event}}</span>
                  <sc-if value="{{f.noAuto}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9.5px; background: rgba(0,0,0,.18); padding: 1px 5px; border-radius: 3px">NO AUTOMAP</span></sc-if>
                  <sc-if value="{{f.canRemove}}" hint-placeholder-val="{{ true }}"><button onClick="{{f.remove}}" aria-label="Remove source" style="background: transparent; border: 0; color: #2a1405; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-right: 6px"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
                  <span class="pdot" style="right: -5px; top: 10px; background: #f99a32; border: 2px solid #2a1405"></span>
                </div>
                <sc-if value="{{f.isShared}}" hint-placeholder-val="{{ false }}"><button onClick="{{selShared}}" style="background: transparent; border: 0; color: #8b9aa7; font-size: 11px; padding: 2px 0 0 18px">shared with every variant · edit under Shared</button></sc-if>
                <sc-for list="{{f.fields}}" as="x" hint-placeholder-count="2">
                  <div draggable="true" onDragStart="{{x.drag}}" onDragEnd="{{dragEnd}}" style="height: 24px; display: flex; align-items: center; gap: 7px; margin-left: 14px; padding: 0 12px 0 10px; border-left: 2px solid #8a5a2a; font-size: 12px; color: #e9d6c3; cursor: grab; position: relative">
                    <span class="mono" style="flex: 1">{{x.name}}</span>
                    <span class="glyph" style="background: {{x.gc}}">{{x.glyph}}</span>
                    <span style="font-size: 10.5px; color: #8b9aa7; width: 74px; text-align: right">{{x.type}}</span>
                    <span class="pdot" style="right: -5px; top: 7px; background: {{x.dot}}; border: 2px solid #f99a32"></span>
                  </div>
                </sc-for>
              </div>
            </sc-for>

            <div style="position: absolute; left: 0; top: {{cv.palY}}px; width: 360px">
              <div class="kick" style="margin-bottom: 4px">Other events</div>
              <p class="help" style="margin: 0 0 8px">{{cv.palHelp}}</p>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{cv.palette}}" as="e" hint-placeholder-count="3">
                  <span draggable="true" onDragStart="{{e.drag}}" onDragEnd="{{dragEnd}}" style="border: 1px dashed #f99a32; color: #f8b878; border-radius: 5px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; cursor: grab">{{e.name}}</span>
                </sc-for>
              </div>
            </div>

            <!-- target -->
            <div style="position: absolute; left: 520px; top: 0; width: 380px">
              <div onDragOver="{{cv.headOver}}" onDrop="{{cv.headDrop}}" style="height: 36px; display: flex; align-items: center; gap: 8px; background: {{cv.hbg}}; color: #1c2408; border-radius: 6px 6px 0 0; padding: 0 8px 0 12px; outline: {{cv.headOutline}}; outline-offset: 2px">
                <span class="pdot" style="position: static; width: 8px; height: 8px; background: #1c2408"></span>
                <sc-if value="{{cv.renamable}}" hint-placeholder-val="{{ true }}"><input value="{{cv.tname}}" onChange="{{cv.rename}}" aria-label="Read model name" style="background: transparent; border: 0; font: 800 13.5px 'Nunito Sans', system-ui, sans-serif; color: #1c2408; outline: none; width: 170px"></sc-if>
                <sc-if value="{{cv.fixedName}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; font-weight: 800">{{cv.tname}}</span></sc-if>
                <span style="flex: 1; text-align: right; font-size: 10.5px; font-weight: 700; opacity: .7">{{cv.headHint}}</span>
                <sc-if value="{{cv.canDelete}}" hint-placeholder-val="{{ false }}"><button onClick="{{cv.del}}" aria-label="Remove variant" title="Remove this variant" style="background: transparent; border: 0; color: #1c2408; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
              </div>
              <div style="border: 1px solid {{cv.tbd}}; border-top: 0; border-radius: 0 0 6px 6px; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; background: #1b2431">
                <sc-for list="{{cv.rows}}" as="p" hint-placeholder-count="5">
                  <div onDragOver="{{p.over}}" onDrop="{{p.drop}}" style="min-height: 30px; display: flex; align-items: center; gap: 7px; border: 1px solid {{p.bd}}; background: {{p.bg}}; border-radius: 5px; padding: 3px 6px 3px 14px; position: relative">
                    <span class="pdot" style="left: -12px; top: 9px; background: {{p.dot}}; border: 2px solid #4f8ef7"></span>
                    <span class="mono" style="flex: 1; font-size: 12.5px; color: #e6edf3; min-width: 0; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
                    <sc-if value="{{p.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: {{p.noteC}}; white-space: nowrap">{{p.note}}</span></sc-if>
                    <sc-if value="{{p.canFix}}" hint-placeholder-val="{{ false }}"><button onClick="{{p.fix}}" style="background: #2a1719; border: 1px solid #8a3a3e; color: #ffb4b4; border-radius: 4px; font-size: 10px; font-weight: 800; padding: 1px 6px">Add to all</button></sc-if>
                    <span class="glyph" style="background: {{p.gc}}">{{p.glyph}}</span>
                    <sc-if value="{{p.isConcept}}" hint-placeholder-val="{{ true }}"><span class="concept">{{p.type}}</span></sc-if>
                    <sc-if value="{{p.isPlain}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #c9d4dd">{{p.type}}</span></sc-if>
                    <sc-if value="{{p.editable}}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{p.tKey}}" aria-label="Toggle key" title="Key" style="background: transparent; border: 0; width: 20px; height: 20px; color: {{p.keyC}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="9" r="4.5"></circle><path d="M11.8 12.2L4 20M7 17l2.5 2.5M9.5 14.5l2 2"></path></svg></button>
                      <button onClick="{{p.remove}}" aria-label="Remove property" class="x" style="width: 18px; height: 18px"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </sc-if>
                  </div>
                </sc-for>
                <sc-if value="{{cv.canAddProp}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; gap: 6px; align-items: center; padding: 2px 4px">
                    <input class="f sm mono" value="{{newProp}}" onChange="{{setNewProp}}" placeholder="+ Add Property" aria-label="New property name" style="flex: 1; background: transparent; border-color: transparent">
                    <select class="f sm" value="{{newType}}" onChange="{{setNewType}}" aria-label="Type" style="width: 110px"><option data-for="types" data-as="o" value="{{o}}">{{o}}</option></select>
                    <button onClick="{{addProp}}" style="background: #2a3314; border: 1px solid #4a5a20; color: #c6e03a; border-radius: 5px; padding: 3px 9px; font-size: 12px; font-weight: 800">Add</button>
                  </div>
                </sc-if>
              </div>
              <sc-if value="{{showCta}}" hint-placeholder-val="{{ true }}">
                <div style="margin-top: 14px; border: 1.5px dashed #6d8222; border-radius: 10px; padding: 14px; background: #161f19">
                  <div style="font-size: 13.5px; font-weight: 800; color: #e6f59a">Does a {{name}} come in kinds?</div>
                  <p class="help" style="margin: 6px 0 10px; color: #a9b7c2">When an entity moves between genuinely different shapes — available, reserved, adopted — split the read model into variants. Each variant is its own read model; an entity is in exactly one at a time. You model them one at a time, here.</p>
                  <button onClick="{{variantsOn}}" style="background: #c6e03a; color: #1c2408; border: 0; border-radius: 7px; padding: 7px 14px; font-size: 13px; font-weight: 800">Split into variants…</button>
