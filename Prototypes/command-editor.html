<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Command Editor v2</title>
<!-- Prototype: the Command dialog in Cratis Studio, designed visually like the Query editor.
     Standalone: open this file in a browser. Everything is local state; nothing is saved. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b131b}
a{color:#5aa0f0}a:hover{color:#8cc0ff}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.kick{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8b9aa7}
.help{font-size:12px;color:#8b9aa7;line-height:1.45;margin:4px 0 0}
.f{background:#0f1a24;border:1px solid #2b3d4b;color:#e6edf3;border-radius:6px;padding:0 8px;height:32px;font:13px 'Nunito Sans',system-ui,sans-serif;min-width:0}
.f:focus{outline:none;border-color:#4fc3b8}
.f.sm{height:28px;font-size:12px;padding:0 6px}
.x{background:transparent;border:0;color:#8b9aa7;width:26px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:#1f2e3a;color:#ffb4b4}
.add{background:transparent;border:0;color:#5aa0f0;font-weight:700;font-size:13px;padding:8px 0;text-align:left}
.add:hover{color:#8cc0ff}
.card{border:1px solid #2b3d4b;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#15212b}
.row3{display:grid;grid-template-columns:1fr 500px 1fr;align-items:center}
.vl{width:2px;height:26px;background:#33495a;margin:0 auto;position:relative}
.vl.arrow:after{content:'';position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:6px solid #33495a;border-bottom:0}
.node{display:block;width:100%;text-align:left;background:#172633;border:1px solid #2b3d4b;border-radius:10px;padding:12px 14px;transition:border-color .15s,opacity .15s}
.node:hover{background:#1b2c3a}
.ntag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.nline{font-size:12.5px;color:#c9d4dd;line-height:1.55}
.dash{flex:1;border-top:2px dashed #3a4b58;min-width:16px}
.exit{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px dashed;white-space:nowrap}
.tab{background:transparent;border:0;padding:14px 14px 12px;font-size:14px;font-weight:600;border-bottom:2px solid transparent}
.seg{display:flex;border:1px solid #2b3d4b;border-radius:8px;padding:3px;gap:2px;background:#0f1a24}
.seg button{border:0;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600}
.step{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;font-size:14px;color:#dbe4ea;text-align:left}
.step:hover{background:#17242f}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.hbar{position:absolute;height:2px;background:#33495a}
.bcol{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 10px;width:240px}
.bnode{background:transparent;border:0;padding:0;width:100%;display:flex;flex-direction:column;align-items:center}
.when{display:flex;align-items:center;gap:8px;border:1px solid;border-radius:8px;padding:7px 10px;max-width:100%;font-size:12px}
.diamond{width:10px;height:10px;transform:rotate(45deg);flex:none}
.evt{width:100%;text-align:left;background:#2a2116;border:1px solid #5a4128;border-top:3px solid #f0913a;border-radius:8px;padding:10px 12px}
.pill{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:999px;border:1px solid}
.toggle{width:44px;height:24px;border-radius:999px;border:0;position:relative;flex:none}
.knob{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#0f1a24;transition:left .15s}
.ln{display:flex;white-space:pre;font-size:12.5px;line-height:1.75}
.lnno{width:40px;color:#4b5e6c;text-align:right;padding-right:14px;flex:none;user-select:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#dbe4ea}
.chk input{accent-color:#4aa3f0;width:15px;height:15px;margin:0}
.scroll::-webkit-scrollbar{width:10px;height:10px}.scroll::-webkit-scrollbar-thumb{background:#2b3d4b;border-radius:10px}
/* Studio property editor look */
.ccard{background:#1f2836;border:1px solid #3fa9f5;border-radius:10px;overflow:visible;width:100%}
.chead{display:flex;align-items:center;gap:8px;background:#3fa9f5;color:#0b2540;font-weight:800;font-size:14px;padding:9px 12px;border-radius:9px 9px 0 0}
.cdot{width:9px;height:9px;border-radius:50%;background:#9ad13b;border:1.5px solid #0b2540}
.prow{position:relative;border:1px solid #3b4658;border-radius:7px;background:#222c3a;padding:7px 8px 7px 12px}
.ptop{display:flex;align-items:center;gap:7px}
.pname{background:transparent;border:0;padding:2px 0;font-size:13.5px;color:#e6edf3;text-align:left;flex:1 1 auto;min-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbadge{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:2px;border-radius:5px;font-size:12px;color:#dbe4ea;white-space:nowrap}
.tbadge:hover{background:#2c394a}
.glyph{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:19px;padding:0 5px;border-radius:4px;color:#fff;font:700 10px system-ui,sans-serif}
.concept{background:#b4a5ff;color:#1c1040;font-weight:700;padding:2px 7px;border-radius:4px}
.ico{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#8b9aa7;flex:none}
.ico:hover{background:#2c394a;color:#dbe4ea}
.req{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#a9b7c2;white-space:nowrap}
.req input{accent-color:#4aa3f0;width:14px;height:14px;margin:0}
.rchip{display:inline-flex;align-items:center;gap:5px;border:1px solid #3b4658;background:#1a2330;border-radius:999px;padding:2px 9px;font-size:11px;color:#c9d4dd;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip:hover{border-color:#5a6b80}
.menu{position:absolute;top:36px;right:8px;z-index:30;width:250px;background:#1b2431;border:1px solid #3b4658;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;gap:1px}
.mi{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:6px;padding:7px 8px;font-size:13px;color:#e6edf3;text-align:left;width:100%}
.mi:hover{background:#2a3546}
.msep{height:1px;background:#33404f;margin:5px 2px}
.rmhead{display:flex;align-items:center;gap:8px;background:#c6e03a;color:#1c2408;font-weight:800;font-size:13.5px;padding:8px 12px;border-radius:9px 9px 0 0}
.evhead{display:flex;align-items:center;gap:8px;background:#f0913a;color:#2a1405;font-weight:800;font-size:13px;padding:7px 10px;border-radius:7px 7px 0 0}
.lane{display:flex;align-items:center;gap:10px;border:1px solid #2b3d4b;border-radius:8px;padding:8px 10px;font-size:12.5px;background:#15212b}
</style>

<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width: 1480px; height: 960px; display: flex; flex-direction: column; background: #15212b; color: #e6edf3; font-family: 'Nunito Sans', system-ui, sans-serif; border: 1px solid #2d3e4c; border-radius: 14px; overflow: hidden">

  <!-- Header -->
  <div style="height: 54px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #0f1a24; border-bottom: 1px solid #22323f">
    <span style="background: #3fa9f5; color: #0b2540; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 6px 9px; border-radius: 5px">COMMAND</span>
    <span style="font-size: 17px; font-weight: 800">{{name}}</span>
    <span style="font-size: 13px; color: #8b9aa7">Invoicing › Registration</span>
    <span style="flex: 1"></span>
    <button aria-label="Close" style="background: transparent; border: 0; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <!-- Sidebar -->
    <div class="scroll" style="width: 226px; flex: none; background: #111c26; border-right: 1px solid #22323f; display: flex; flex-direction: column; padding: 16px 12px 12px; overflow-y: auto">
      <div class="kick" style="margin: 0 6px 8px">Flow</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="8">
          <button class="step" onClick="{{s.pick}}" style="background: {{s.bg}}; border-color: {{s.bd}}">
            <span class="dot" style="background: {{s.dot}}"></span>
            <span>{{s.label}}</span>
            <sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: {{s.badgeBg}}; color: {{s.badgeFg}}">{{s.badge}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 22px 6px 6px">
        <span class="kick">Specifications</span>
        <span style="font-size: 11.5px; font-weight: 700; color: {{specSummary.fg}}">{{specSummary.text}}</span>
      </div>
      <p class="help" style="margin: 0 6px 8px">Examples you saved from Try it. They re-run every time the design changes.</p>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{specRows}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: flex-start; gap: 4px">
            <button class="step" onClick="{{s.load}}" style="align-items: flex-start; font-size: 12.5px; line-height: 1.35; padding: 7px 8px; background: {{s.bg}}; border-color: {{s.bd}}">
              <span style="width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; margin-top: 1px; background: {{s.markBg}}; color: {{s.markFg}}">{{s.mark}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px"><span>{{s.title}}</span><span style="font-size: 11px; color: {{s.subFg}}">{{s.sub}}</span></span>
            </button>
            <button class="x" onClick="{{s.remove}}" aria-label="Delete specification" style="margin-top: 4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
        </sc-for>
        <sc-if value="{{noSpecs}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #8b9aa7; border: 1px dashed #3a4b58; border-radius: 8px; padding: 10px; margin: 0 4px">No specifications yet. Run Try it and save the outcome.</div></sc-if>
      </div>
      <span style="flex: 1"></span>
      <div style="border-top: 1px solid #22323f; padding: 12px 6px 0; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: #8b9aa7">
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #3fa9f5"></span>Command</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #f0913a"></span>Event</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #c6e03a"></span>Read model</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #a78bfa"></span>C#</span>
      </div>
    </div>

    <!-- Main -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      <!-- Details -->
      <div style="padding: 14px 22px 12px; flex: none; display: flex; gap: 22px; align-items: flex-end">
        <div style="flex: 1; min-width: 0">
          <input value="{{name}}" onChange="{{setName}}" aria-label="Command name" style="margin: 0 0 8px; background: transparent; border: 0; color: #e6edf3; font: 800 24px 'Nunito Sans', system-ui, sans-serif; padding: 0; width: 100%; outline: none">
          <textarea value="{{desc}}" onChange="{{setDesc}}" aria-label="Description" placeholder="What does this command do, in domain words?" rows="2" style="width: 100%; resize: none; background: #0f1a24; border: 1px solid #2b3d4b; border-radius: 6px; color: #e6edf3; font: 14px 'Nunito Sans', system-ui, sans-serif; padding: 9px 12px; outline: none"></textarea>
        </div>
        <div style="flex: none">
          <div class="kick" style="margin-bottom: 6px">Does its work by</div>
          <div class="seg">
            <button onClick="{{modeProduces}}" style="background: {{segP.bg}}; color: {{segP.fg}}">Producing events</button>
            <button onClick="{{modeHandler}}" style="background: {{segH.bg}}; color: {{segH.fg}}">A C# handler</button>
          </div>
        </div>
        <button onClick="{{selConc}}" style="flex: none; display: flex; align-items: center; gap: 10px; background: #0f1a24; border: 1px solid {{concBtn.bd}}; border-radius: 8px; padding: 7px 12px; text-align: left; max-width: 330px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{concBtn.ic}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="display: flex; flex-direction: column"><span style="font-size: 13.5px; font-weight: 700">Concurrency guard · {{concBtn.state}}</span><span style="font-size: 11.5px; color: #8b9aa7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px">{{concBtn.sub}}</span></span>
        </button>
      </div>

      <!-- Tabs -->
      <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 0 14px; background: #131f29; border-top: 1px solid #22323f; border-bottom: 1px solid #22323f">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; border-bottom-color: {{t.bd}}">{{t.label}}</button>
        </sc-for>
        <span style="flex: 1"></span>
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{toggleTry}}" style="display: flex; align-items: center; gap: 7px; background: {{tryBtn.bg}}; color: {{tryBtn.fg}}; border: 1px solid {{tryBtn.bd}}; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 700; margin-right: 8px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>{{tryBtn.label}}
          </button>
        </sc-if>
        <button onClick="{{toggleCsharp}}" style="background: transparent; color: #c4b5fd; border: 1px dashed #5b4aa8; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 700">{{csharpLabel}}</button>
      </div>

      <div style="flex: 1; min-height: 0; display: flex; position: relative">

        <!-- DESIGN -->
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <div class="scroll" style="flex: 1; min-width: 0; overflow: auto; background: #131e28; background-image: radial-gradient(#1f2e3a 1px, transparent 1px); background-size: 18px 18px">
            <div style="width: max-content; min-width: 100%; padding: 20px 24px 30px">

              <!-- Command card -->
              <div class="row3" style="align-items: start">
                <div></div>
                <div class="ccard" style="border-color: {{cmdCard.bd}}; box-shadow: {{cmdCard.sh}}">
                  <div class="chead"><span class="cdot"></span><span>{{name}}</span><span style="flex: 1"></span><span style="font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .75">When someone sends</span></div>
                  <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
                    <sc-for list="{{propCards}}" as="p" hint-placeholder-count="8">
                      <div class="prow" style="border-color: {{p.bd}}; background: {{p.bg}}; z-index: {{p.z}}">
                        <div class="ptop">
                          <button class="pname mono" onClick="{{p.pick}}">{{p.name}}</button>
                          <button class="tbadge" onClick="{{p.openType}}" aria-label="Change type">
                            <span class="glyph" style="background: {{p.gc}}">{{p.glyph}}</span>
                            <sc-if value="{{p.isConcept}}" hint-placeholder-val="{{ true }}"><span class="concept">{{p.type}}</span></sc-if>
                            <sc-if value="{{p.isPlain}}" hint-placeholder-val="{{ false }}"><span>{{p.typeLabel}}</span></sc-if>
                          </button>
                          <label class="req"><input type="checkbox" checked="{{p.required}}" onChange="{{p.tReq}}">Required</label>
                          <button class="ico" onClick="{{p.tId}}" aria-label="Identifier" title="Identifier — names the thing that changes" style="color: {{p.idC}}; border-color: {{p.idB}}; background: {{p.idBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="9" r="4.5"></circle><path d="M11.8 12.2L4 20M7 17l2.5 2.5M9.5 14.5l2 2"></path></svg></button>
                          <button class="ico" onClick="{{p.tGen}}" aria-label="Generated" title="Generated by the command, after the checks" style="color: {{p.genC}}; border-color: {{p.genB}}; background: {{p.genBg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20L15 9M13 4v3M18.5 9.5h3M17 5.5l2-2M16.5 13.5l2 2"></path></svg></button>
                          <button class="ico" onClick="{{p.addRule}}" aria-label="Add rule" title="Add a rule"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h10M4 17h6M18 14v6M15 17h6"></path></svg></button>
                          <button class="ico" onClick="{{p.remove}}" aria-label="Remove property"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                        </div>
                        <sc-if value="{{p.hasRules}}" hint-placeholder-val="{{ false }}">
                          <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px">
                            <sc-for list="{{p.rules}}" as="r" hint-placeholder-count="1">
                              <button class="rchip mono" onClick="{{r.pick}}" style="border-color: {{r.bd}}; background: {{r.bg}}"><span style="color: {{r.mc}}; font-weight: 900">{{r.mark}}</span>{{r.text}}</button>
                            </sc-for>
                          </div>
                        </sc-if>
                        <sc-if value="{{p.menuOpen}}" hint-placeholder-val="{{ false }}">
                          <div class="menu">
                            <sc-for list="{{menuBase}}" as="m" hint-placeholder-count="6">
                              <button class="mi" onClick="{{m.pick}}"><span class="glyph" style="background: {{m.gc}}">{{m.glyph}}</span>{{m.label}}</button>
                            </sc-for>
                            <button class="mi" onClick="{{toggleConceptMenu}}"><span class="glyph" style="background: #6d28d9">C</span>Concepts<span style="flex: 1"></span><span style="color: #8b9aa7">{{conceptArrow}}</span></button>
                            <sc-if value="{{conceptMenuOpen}}" hint-placeholder-val="{{ false }}">
                              <div style="display: flex; flex-direction: column; gap: 1px; padding-left: 14px">
                                <sc-for list="{{menuConcepts}}" as="m" hint-placeholder-count="5">
                                  <button class="mi" onClick="{{m.pick}}"><span class="glyph" style="background: {{m.gc}}">{{m.glyph}}</span><span class="concept">{{m.label}}</span><span style="flex: 1"></span><span style="font-size: 11px; color: #8b9aa7">{{m.base}}</span></button>
                                </sc-for>
                              </div>
                            </sc-if>
                            <div class="msep"></div>
                            <sc-for list="{{menuLists}}" as="m" hint-placeholder-count="2">
                              <button class="mi" onClick="{{m.pick}}"><span class="glyph" style="background: {{m.gc}}">{{m.glyph}}</span>{{m.label}}</button>
                            </sc-for>
                            <div class="mi" style="color: #6b7d8b; cursor: default"><span class="glyph" style="background: #4c3a7a">{}</span>Complex object<span style="flex: 1"></span><span style="font-size: 10.5px">schema editor</span></div>
                          </div>
                        </sc-if>
                      </div>
                    </sc-for>
                    <button class="add" onClick="{{addProp}}" style="padding: 6px 4px; color: #8ccbff">+ Add property</button>
                  </div>
                </div>
                <div></div>
              </div>
              <div class="vl arrow"></div>

              <!-- Authorize -->
              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selAuth}}" style="border-color: {{nAuth.bc}}; box-shadow: {{nAuth.sh}}; opacity: {{nAuth.op}}">
                  <div class="ntag" style="color: #4fc3b8">Only if the caller</div>
                  <div class="nline mono" style="margin-top: 4px; color: #e6edf3">{{authText}}</div>
                </button>
                <div style="display: flex; align-items: center">
                  <div class="dash" style="max-width: 36px; border-color: {{exitAuth.line}}"></div>
                  <span class="exit" style="background: {{exitAuth.bg}}; border-color: {{exitAuth.bd}}; color: {{exitAuth.fg}}">Unauthorized</span>
                </div>
              </div>
              <div class="vl arrow"></div>

              <!-- Checks + state -->
              <div class="row3">
                <div style="display: flex; align-items: center; justify-content: flex-end; padding-right: 0">
                  <button onClick="{{openState}}" aria-label="Edit state" style="width: 168px; text-align: left; background: #1d2616; border: 1px solid {{stateCard.bd}}; border-radius: 10px; padding: 0; box-shadow: {{stateCard.sh}}; opacity: {{stateCard.op}}">
                    <div class="rmhead" style="font-size: 12.5px"><span class="cdot" style="background: #1c2408; border-color: #1c2408; width: 7px; height: 7px"></span>{{stateCard.title}}</div>
                    <div style="padding: 8px 11px 10px; display: flex; flex-direction: column; gap: 2px">
                      <div style="font-size: 11px; color: #a9cf45; font-weight: 700">{{stateCard.sub}}</div>
                      <sc-for list="{{stateCard.rows}}" as="r" hint-placeholder-count="3">
                        <div class="mono" style="display: flex; justify-content: space-between; gap: 6px; font-size: 11px"><span style="color: #a9b7c2">{{r.k}}</span><span style="color: {{r.c}}">{{r.v}}</span></div>
                      </sc-for>
                      <div style="font-size: 11px; color: #8b9aa7; margin-top: 4px">{{stateCard.foot}}</div>
                    </div>
                  </button>
                  <div class="dash" style="max-width: 14px; min-width: 10px; border-color: #5a6b2a"></div>
                </div>
                <button class="node" onClick="{{selChecks}}" style="border-color: {{nChecks.bc}}; box-shadow: {{nChecks.sh}}; opacity: {{nChecks.op}}">
                  <div class="ntag" style="color: #4fc3b8">And it must hold that</div>
                  <div style="display: flex; flex-direction: column; gap: 3px; margin-top: 5px">
                    <div style="display: flex; gap: 8px; align-items: baseline"><span style="width: 12px; flex: none; font-size: 11px; font-weight: 800; color: {{ruleSum.mc}}">{{ruleSum.mark}}</span><span style="font-size: 12px; color: #a9b7c2">{{ruleSum.text}}</span></div>
                    <sc-for list="{{checkLines}}" as="v" hint-placeholder-count="2">
                      <div style="display: flex; gap: 8px; align-items: baseline">
                        <span style="width: 12px; flex: none; font-size: 11px; font-weight: 800; color: {{v.mc}}">{{v.mark}}</span>
                        <span class="mono" style="font-size: 11.5px; color: {{v.fg}}; line-height: 1.5">{{v.text}}</span>
                      </div>
                    </sc-for>
                  </div>
                </button>
                <div style="display: flex; align-items: center">
                  <div class="dash" style="max-width: 36px; border-color: {{exitVal.line}}"></div>
                  <span class="exit" style="background: {{exitVal.bg}}; border-color: {{exitVal.bd}}; color: {{exitVal.fg}}">Rejected</span>
                </div>
              </div>

              <sc-if value="{{hasGen}}" hint-placeholder-val="{{ true }}">
                <div class="vl arrow"></div>
                <div class="row3">
                  <div></div>
                  <button class="node" onClick="{{selGenerate}}" style="padding: 10px 14px; border-color: {{nGen.bc}}; box-shadow: {{nGen.sh}}; opacity: {{nGen.op}}">
                    <div class="ntag" style="color: #4fc3b8">Then generates</div>
                    <div class="nline mono" style="font-size: 12px; margin-top: 3px">{{genText}}</div>
                  </button>
                  <div></div>
                </div>
              </sc-if>
              <div class="vl arrow"></div>

              <sc-if value="{{isProduces}}" hint-placeholder-val="{{ true }}">
                <div class="row3">
                  <div></div>
                  <div style="display: flex; justify-content: center"><span class="pill" style="border-color: #5a4128; color: #f0a060; background: #2a2116">Records · {{branchCount}}</span></div>
                  <div style="display: flex; gap: 6px; padding-left: 14px">
                    <button onClick="{{addAlways}}" style="background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #8cc0ff">+ Always</button>
                    <button onClick="{{addWhen}}" style="background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #f0a060">+ When…</button>
                  </div>
                </div>
                <sc-if value="{{hasBranches}}" hint-placeholder-val="{{ true }}">
                  <div class="vl"></div>
                  <div style="display: flex; justify-content: center; align-items: stretch">
                    <sc-for list="{{branchCols}}" as="b" hint-placeholder-count="3">
                      <div class="bcol" style="opacity: {{b.op}}">
                        <div class="hbar" style="top: 0; left: {{b.barL}}; right: {{b.barR}}; opacity: {{b.barOp}}"></div>
                        <div class="vl arrow" style="height: 18px"></div>
                        <button class="bnode" onClick="{{b.pick}}" aria-label="Edit production">
                          <span class="when" style="border-color: {{b.chipBd}}; background: {{b.chipBg}}; box-shadow: {{b.sh}}">
                            <span class="diamond" style="background: {{b.dia}}"></span>
                            <span style="font-weight: 800; font-size: 10.5px; letter-spacing: .08em; color: {{b.dia}}">{{b.kw}}</span>
                            <span class="mono" style="font-size: 11.5px; color: #dbe4ea; text-align: left">{{b.cond}}</span>
                          </span>
                          <span class="vl arrow" style="height: 16px; display: block"></span>
                          <span class="evt" style="border-color: {{b.evBd}}; border-top-color: #f0913a; box-shadow: {{b.sh}}; display: block">
                            <span class="ntag" style="color: #f0a060; display: block">Event</span>
                            <span style="display: block; font-size: 14px; font-weight: 800; margin: 2px 0 4px; color: #f6e7d8; overflow-wrap: anywhere">{{b.event}}</span>
                            <span class="mono" style="display: block; font-size: 11px; color: #8b9aa7">{{b.forText}}</span>
                            <sc-for list="{{b.mapLines}}" as="m" hint-placeholder-count="2">
                              <span class="mono" style="display: block; font-size: 11px; color: #c9d4dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m}}</span>
                            </sc-for>
                          </span>
                        </button>
                        <div style="flex: 1; min-height: 18px; width: 2px; background: #33495a"></div>
                        <div class="hbar" style="bottom: 0; left: {{b.barL}}; right: {{b.barR}}; opacity: {{b.barOp}}"></div>
                      </div>
                    </sc-for>
                  </div>
                  <div class="vl arrow"></div>
                </sc-if>
                <sc-if value="{{noBranches}}" hint-placeholder-val="{{ false }}">
                  <div class="vl"></div>
                  <div class="row3"><div></div><div style="border: 1px dashed #3a4b58; border-radius: 10px; padding: 14px; font-size: 13px; color: #8b9aa7; text-align: center">Nothing is recorded. Add an event that always happens, or one that happens when a condition holds.</div><div></div></div>
                  <div class="vl arrow"></div>
                </sc-if>
                <div class="row3">
                  <div></div>
                  <div style="display: flex; justify-content: center"><span class="pill" style="border-color: #6b3a5e; color: #f29ad0; background: #2a1724">Then calls out · {{opCount}}</span></div>
                  <div style="display: flex; gap: 6px; padding-left: 14px"><button onClick="{{addOp}}" style="background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #f29ad0">+ Operation</button></div>
                </div>
                <sc-for list="{{opCards}}" as="o" hint-placeholder-count="2">
                  <div class="vl arrow"></div>
                  <div class="row3">
                    <div style="display: flex; justify-content: flex-end; padding-right: 12px"><span style="font-size: 11px; color: #8b9aa7; font-weight: 800">{{o.n}}</span></div>
                    <button class="node" onClick="{{o.pick}}" style="border-color: {{o.bc}}; border-left: 4px solid #e879b9; box-shadow: {{o.sh}}; opacity: {{o.op}}">
                      <div style="display: flex; justify-content: space-between; align-items: center"><span class="ntag" style="color: #f29ad0">Operation</span><span style="font-size: 10.5px; font-weight: 800; background: #3a2036; color: #f6b8de; padding: 2px 7px; border-radius: 4px">uses {{o.system}}</span></div>
                      <div style="font-size: 14px; font-weight: 800; margin: 2px 0 3px">{{o.name}}</div>
                      <div class="mono" style="font-size: 11px; color: #c9d4dd">{{o.inputs}}</div>
                      <div style="display: flex; gap: 14px; margin-top: 6px; font-size: 11.5px"><span style="color: #c9d4dd">▶ {{o.exText}}</span><span style="color: {{o.coC}}">{{o.coText}}</span></div>
                    </button>
                    <div style="display: flex; align-items: center; padding-left: 12px">
                      <sc-if value="{{o.hasStatus}}" hint-placeholder-val="{{ false }}"><span class="exit" style="border-style: solid; background: {{o.stBg}}; border-color: {{o.stBd}}; color: {{o.stFg}}">{{o.status}}</span></sc-if>
                    </div>
                  </div>
                </sc-for>
                <sc-if value="{{noOps}}" hint-placeholder-val="{{ false }}">
                  <div class="vl"></div>
                  <div class="row3"><div></div><div style="border: 1px dashed #3a4b58; border-radius: 10px; padding: 12px; font-size: 12.5px; color: #8b9aa7; text-align: center">No side effects beyond the events. Add an operation to call another system.</div><div></div></div>
                </sc-if>
                <div class="vl arrow"></div>
              </sc-if>

              <sc-if value="{{isHandler}}" hint-placeholder-val="{{ false }}">
                <div class="row3">
                  <div></div>
                  <button class="node" onClick="{{selHandler}}" style="border-color: {{nHandler.bc}}; border-top: 3px solid #a78bfa; box-shadow: {{nHandler.sh}}; opacity: {{nHandler.op}}">
                    <div class="ntag" style="color: #c4b5fd">Handler · C#</div>
                    <div class="nline mono" style="font-size: 12px; margin-top: 4px">{{handlerText}}</div>
                    <div class="nline" style="font-size: 11.5px; color: #8b9aa7; margin-top: 4px">Returns the events to append. Replaces the produces flow.</div>
                  </button>
                  <div></div>
                </div>
                <div class="vl arrow"></div>
              </sc-if>

              <!-- Concurrency -->
              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selConc}}" style="padding: 10px 14px; border-style: {{nConc.style}}; border-color: {{nConc.bc}}; box-shadow: {{nConc.sh}}; opacity: {{nConc.op}}; display: flex; gap: 12px; align-items: center">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{nConc.ic}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                  <span style="display: flex; flex-direction: column"><span class="ntag" style="color: {{nConc.ic}}">{{nConc.tag}}</span><span class="nline" style="font-size: 12px">{{nConc.text}}</span></span>
                </button>
                <div style="display: flex; align-items: center">
                  <sc-if value="{{concOn}}" hint-placeholder-val="{{ true }}">
                    <div class="dash" style="max-width: 36px; border-color: {{exitConc.line}}"></div>
                    <span class="exit" style="background: {{exitConc.bg}}; border-color: {{exitConc.bd}}; color: {{exitConc.fg}}">Lost the race</span>
                  </sc-if>
                </div>
              </div>
              <div class="vl arrow"></div>

              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selReturns}}" style="padding: 10px 14px; border-color: {{nRet.bc}}; box-shadow: {{nRet.sh}}; opacity: {{nRet.op}}">
                  <div class="ntag" style="color: #4fc3b8">Gives back</div>
                  <div class="nline mono" style="font-size: 12px; margin-top: 3px">{{retText}}</div>
                </button>
                <div></div>
              </div>
              <div class="vl arrow"></div>
              <div style="display: flex; justify-content: center"><span class="pill" style="background: {{endPill.bg}}; border-color: {{endPill.bd}}; color: {{endPill.fg}}">Accepted</span></div>
            </div>
          </div>

          <!-- Inspector -->
          <div class="scroll" style="width: 344px; flex: none; border-left: 1px solid #22323f; background: #111c26; overflow-y: auto; padding: 16px 18px 24px">

            <!-- TRY: given / when / then -->
            <sc-if value="{{trying}}" hint-placeholder-val="{{ false }}">
              <div class="kick" style="color: #4fc3b8">Try it · given, when, then</div>
              <h3 style="margin: 4px 0 0; font-size: 17px">What happens if…</h3>
              <div style="border: 1px solid {{outcome.bd}}; background: {{outcome.bg}}; border-radius: 10px; padding: 12px; margin: 12px 0 10px">
                <div style="display: flex; align-items: center; gap: 8px"><span class="kick" style="color: {{outcome.fg}}">Then</span><span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: {{outcome.fg}}">{{outcome.title}}</span></div>
                <sc-for list="{{outcome.lines}}" as="l" hint-placeholder-count="1">
                  <div style="font-size: 12.5px; color: #dbe4ea; margin-top: 6px; display: flex; gap: 6px"><span style="color: {{l.c}}; font-weight: 800; font-size: 10.5px; text-transform: uppercase; padding-top: 2px; width: 54px; flex: none">{{l.sev}}</span><span>{{l.msg}}</span></div>
                </sc-for>
                <sc-for list="{{outcome.events}}" as="e" hint-placeholder-count="1">
                  <div style="margin-top: 10px; border-left: 3px solid #f0913a; padding-left: 9px">
                    <div style="font-size: 13px; font-weight: 800; color: #f6e7d8">{{e.name}}</div>
                    <div class="mono" style="font-size: 11px; color: #8b9aa7">{{e.dest}}</div>
                    <sc-for list="{{e.payload}}" as="kv" hint-placeholder-count="2"><div class="mono" style="font-size: 11px; color: #c9d4dd">{{kv}}</div></sc-for>
                  </div>
                </sc-for>
                <sc-if value="{{outcome.hasSteps}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top: 10px; border-top: 1px dashed #3a4b58; padding-top: 8px; display: flex; flex-direction: column; gap: 3px">
                    <sc-for list="{{outcome.steps}}" as="x" hint-placeholder-count="3"><div style="font-size: 12px; color: {{x.c}}; display: flex; gap: 6px"><span style="width: 16px; flex: none; font-weight: 800">{{x.m}}</span><span>{{x.t}}</span></div></sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{outcome.hasResp}}" hint-placeholder-val="{{ false }}"><div class="mono" style="margin-top: 10px; font-size: 11.5px; color: #9fe3b8">↩ {{outcome.resp}}</div></sc-if>
                <div style="display: flex; gap: 6px; margin-top: 12px">
                  <input class="f sm" value="{{specDraft}}" onChange="{{setSpecDraft}}" aria-label="Specification name" style="flex: 1">
                  <button onClick="{{saveSpec}}" style="opacity: {{saveOp}}; background: #4dc0b5; color: #0d1a20; border: 0; border-radius: 6px; padding: 0 12px; font-size: 12.5px; font-weight: 800; white-space: nowrap">Save as specification</button>
                </div>
                <sc-if value="{{specSavedMsg}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #7ee2a6; margin-top: 6px">{{specSavedMsg}}</div></sc-if>
              </div>

              <div class="kick" style="margin: 14px 0 6px; color: #f0a060">Given — what already happened</div>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{givenRows}}" as="g" hint-placeholder-count="2">
                  <div style="border: 1px solid #5a4128; border-radius: 8px; background: #1e1912">
                    <div class="evhead" style="padding: 5px 6px 5px 10px; font-size: 12px">
                      <span style="flex: 1">{{g.event}}</span>
                      <span style="font-size: 10.5px; font-weight: 700; opacity: .8">for</span>
                      <input class="mono" value="{{g.for}}" onChange="{{g.setFor}}" aria-label="Event source" style="width: 92px; height: 22px; border: 0; border-radius: 4px; background: rgba(255,255,255,.55); color: #2a1405; font-size: 11px; padding: 0 5px">
                      <button onClick="{{g.remove}}" aria-label="Remove event" style="background: transparent; border: 0; color: #2a1405; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                    <sc-if value="{{g.hasFields}}" hint-placeholder-val="{{ true }}">
                      <div style="display: grid; grid-template-columns: 104px 1fr; gap: 5px 8px; align-items: center; padding: 8px 10px">
                        <sc-for list="{{g.fields}}" as="fld" hint-placeholder-count="2">
                          <label class="mono" style="font-size: 11px; color: #c9a27a" for="{{fld.id}}">{{fld.name}}</label>
                          <input id="{{fld.id}}" class="f sm mono" value="{{fld.val}}" onChange="{{fld.set}}">
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-for>
                <select class="f" value="" onChange="{{addGiven}}" aria-label="Add a past event" style="color: #f0a060">
                  <option value="">+ Add something that happened…</option>
                  <option data-for="eventNames" data-as="o" value="{{o}}">{{o}}</option>
                </select>
              </div>
              <div style="margin-top: 10px; border: 1px solid #3a4a20; border-radius: 8px; background: #1a2114; padding: 9px 11px">
                <div style="font-size: 11px; color: #a9cf45; font-weight: 800; letter-spacing: .06em; text-transform: uppercase">{{seenTitle}}</div>
                <sc-for list="{{seenRows}}" as="r" hint-placeholder-count="3">
                  <div class="mono" style="display: flex; justify-content: space-between; font-size: 11.5px; margin-top: 3px"><span style="color: #a9b7c2">{{r.k}}</span><span style="color: {{r.c}}">{{r.v}}</span></div>
                </sc-for>
              </div>

              <div class="kick" style="margin: 16px 0 6px; color: #6ea8ff">When — {{name}} is sent with</div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{sampleRows}}" as="s" hint-placeholder-count="6">
                  <div style="display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px">
                    <label class="mono" style="font-size: 11.5px; color: #a9b7c2" for="{{s.id}}">{{s.name}}</label>
                    <sc-if value="{{s.isBool}}" hint-placeholder-val="{{ false }}"><label class="chk"><input id="{{s.id}}" type="checkbox" checked="{{s.checked}}" onChange="{{s.toggle}}">{{s.checkedText}}</label></sc-if>
                    <sc-if value="{{s.isText}}" hint-placeholder-val="{{ true }}"><input id="{{s.id}}" class="f sm mono" value="{{s.val}}" onChange="{{s.set}}"></sc-if>
                  </div>
                </sc-for>
              </div>
              <div class="kick" style="margin: 14px 0 6px; color: #f29ad0">And what goes wrong</div>
              <select class="f" value="{{trySim}}" onChange="{{setTrySim}}" aria-label="Simulate a failure" style="width: 100%">
                <option data-for="simOptions" data-as="o" value="{{o.v}}">{{o.l}}</option>
              </select>
              <div class="kick" style="margin: 14px 0 6px">by a caller who satisfies</div>
              <div style="display: flex; flex-wrap: wrap; gap: 6px 14px">
                <sc-for list="{{callerRows}}" as="c" hint-placeholder-count="3">
                  <label class="chk"><input type="checkbox" checked="{{c.checked}}" onChange="{{c.toggle}}"><span class="mono" style="font-size: 11.5px">{{c.name}}</span></label>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">

              <!-- Property inspector -->
              <sc-if value="{{ins.prop}}" hint-placeholder-val="{{ true }}">
                <div class="kick" style="color: #8ccbff">Property</div>
                <input class="mono" value="{{pi.name}}" onChange="{{pi.setName}}" aria-label="Property name" style="margin-top: 4px; background: transparent; border: 0; border-bottom: 1px dashed #3b4658; color: #e6edf3; font-size: 17px; font-weight: 700; padding: 2px 0; width: 100%; outline: none">
                <div style="display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; color: #a9b7c2">
                  <span>Type</span>
                  <select class="f" value="{{pi.type}}" onChange="{{pi.setType}}" aria-label="Type">
                    <option data-for="allTypes" data-as="o" value="{{o}}">{{o}}</option>
                  </select>
                  <span>Means</span>
                  <span style="font-size: 12px; color: #8b9aa7">{{pi.means}}</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px">
                  <label class="chk"><input type="checkbox" checked="{{pi.required}}" onChange="{{pi.tReq}}">Required — the sender must give it</label>
                  <label class="chk"><input type="checkbox" checked="{{pi.identifier}}" onChange="{{pi.tId}}">Identifier — names what changes</label>
                  <label class="chk"><input type="checkbox" checked="{{pi.generated}}" onChange="{{pi.tGen}}">Generated — made by the command</label>
                </div>
                <div class="kick" style="margin: 18px 0 4px">Rules on {{pi.name}}</div>
                <p class="help" style="margin: 0 0 8px">Every failed rule rejects the command — severity only changes how the message is shown.</p>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{pi.rules}}" as="r" hint-placeholder-count="2">
                    <div class="card" style="border-color: {{r.bd}}">
                      <div style="display: flex; gap: 6px">
                        <select class="f" value="{{r.op}}" onChange="{{r.setOp}}" aria-label="Rule" style="width: 128px">
                          <option data-for="r.ops" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <sc-if value="{{r.needsValue}}" hint-placeholder-val="{{ true }}">
                          <input class="f mono" value="{{r.value}}" onChange="{{r.setValue}}" placeholder="{{r.ph}}" aria-label="Value" style="flex: 1; font-size: 12px">
                        </sc-if>
                        <sc-if value="{{r.noValue}}" hint-placeholder-val="{{ false }}"><span style="flex: 1"></span></sc-if>
                        <button class="x" onClick="{{r.remove}}" aria-label="Remove rule"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                      <div style="display: flex; gap: 6px">
                        <select class="f" value="{{r.severity}}" onChange="{{r.setSev}}" aria-label="Severity" style="width: 112px">
                          <option data-for="sevList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f" value="{{r.message}}" onChange="{{r.setMsg}}" placeholder="Message when it fails" aria-label="Message" style="flex: 1">
                      </div>
                    </div>
                  </sc-for>
                  <sc-if value="{{pi.noRules}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; color: #8b9aa7; border: 1px dashed #3a4b58; border-radius: 8px; padding: 10px">{{pi.noRulesText}}</div></sc-if>
                </div>
                <button class="add" onClick="{{pi.addRule}}">+ Add rule</button>
              </sc-if>

              <!-- Authorize -->
              <sc-if value="{{ins.auth}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Authorize</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Who may send it</h3>
                <p class="help">Checked before anything else. "and" binds tighter than "or". A caller who fails is turned away as Unauthorized.</p>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
                  <sc-for list="{{authRows}}" as="a" hint-placeholder-count="1">
                    <div style="display: flex; gap: 6px">
                      <sc-if value="{{a.showJoin}}" hint-placeholder-val="{{ false }}">
                        <select class="f" value="{{a.join}}" onChange="{{a.setJoin}}" aria-label="Join" style="width: 62px"><option value="and">and</option><option value="or">or</option></select>
                      </sc-if>
                      <sc-if value="{{a.first}}" hint-placeholder-val="{{ true }}"><span style="width: 62px; font-size: 12px; color: #8b9aa7; display: flex; align-items: center">must be</span></sc-if>
                      <select class="f mono" value="{{a.policy}}" onChange="{{a.setPolicy}}" aria-label="Policy" style="flex: 1; font-size: 12px">
                        <option data-for="policyList" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{a.remove}}" aria-label="Remove policy"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                  </sc-for>
                  <sc-if value="{{noAuth}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; color: #8b9aa7; border: 1px dashed #3a4b58; border-radius: 8px; padding: 10px">Anyone may send it.</div></sc-if>
                </div>
                <button class="add" onClick="{{addPolicy}}">+ Require a policy</button>
              </sc-if>

              <!-- Checks -->
              <sc-if value="{{ins.checks}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Requirements</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Rules about the command as a whole</h3>
                <p class="help">Usually about the state it reads. Property rules live on each property in the command card. Use "or" for a rule that only applies sometimes.</p>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
                  <sc-for list="{{reqRows}}" as="q" hint-placeholder-count="2">
                    <div class="card">
                      <div style="display: flex; justify-content: space-between; align-items: center"><span class="ntag" style="color: #4fc3b8">require</span><button class="x" onClick="{{q.remove}}" aria-label="Remove requirement"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
                      <sc-for list="{{q.conds}}" as="c" hint-placeholder-count="1">
                        <div style="display: flex; gap: 5px">
                          <sc-if value="{{c.showJoin}}" hint-placeholder-val="{{ false }}"><select class="f sm" value="{{c.join}}" onChange="{{c.setJoin}}" aria-label="Join" style="width: 50px"><option value="and">and</option><option value="or">or</option></select></sc-if>
                          <select class="f sm mono" value="{{c.left}}" onChange="{{c.setLeft}}" aria-label="Operand" style="flex: 1">
                            <option data-for="reqOperands" data-as="o" value="{{o}}">{{o}}</option>
                          </select>
                          <select class="f sm" value="{{c.op}}" onChange="{{c.setOp}}" aria-label="Comparison" style="width: 48px">
                            <option data-for="c.ops" data-as="o" value="{{o}}">{{o}}</option>
                          </select>
                          <input class="f sm mono" value="{{c.right}}" onChange="{{c.setRight}}" aria-label="Value" style="width: 56px">
                          <button class="x" onClick="{{c.remove}}" aria-label="Remove condition" style="width: 20px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                        </div>
                      </sc-for>
                      <button class="add" onClick="{{q.addCond}}" style="padding: 2px 0; font-size: 12px">+ and / or…</button>
                      <div style="display: flex; gap: 6px">
                        <select class="f" value="{{q.severity}}" onChange="{{q.setSev}}" aria-label="Severity" style="width: 112px">
                          <option data-for="sevList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f" value="{{q.message}}" onChange="{{q.setMsg}}" placeholder="Message" aria-label="Message" style="flex: 1">
                      </div>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addReq}}">+ Add requirement</button>
                <sc-if value="{{csharp}}" hint-placeholder-val="{{ false }}">
                  <div class="kick" style="margin: 14px 0 8px; color: #c4b5fd">C# check</div>
                  <textarea class="mono" value="{{csharpCode}}" onChange="{{setCsharpCode}}" aria-label="C# validation" rows="6" style="width: 100%; background: #0f1a24; border: 1px solid #3d3566; border-radius: 6px; color: #ddd6fe; font-size: 11.5px; padding: 10px; resize: vertical"></textarea>
                </sc-if>
              </sc-if>

              <!-- Generate -->
              <sc-if value="{{ins.generate}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Generate</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Values the command makes</h3>
                <p class="help">Made after authorization and validation, so rules and policies can't refer to them. Mark a property generated with the wand in the command card.</p>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
                  <sc-for list="{{genRows}}" as="g" hint-placeholder-count="1">
                    <div class="card" style="flex-direction: row; justify-content: space-between; align-items: center"><span class="mono" style="font-size: 12.5px">{{g.name}}</span><span style="font-size: 12px; color: #8b9aa7">{{g.type}}</span></div>
                  </sc-for>
                </div>
              </sc-if>

              <!-- Branch -->
              <sc-if value="{{ins.branch}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #f0a060">Produces</div>
                <h3 style="margin: 4px 0 0; font-size: 17px; overflow-wrap: anywhere">{{br.event}}</h3>
                <div class="kick" style="margin: 14px 0 6px">Happens</div>
                <div class="seg" style="width: max-content">
                  <button onClick="{{br.setAlways}}" style="background: {{br.segA.bg}}; color: {{br.segA.fg}}">Always</button>
                  <button onClick="{{br.setWhen}}" style="background: {{br.segW.bg}}; color: {{br.segW.fg}}">When…</button>
                </div>
                <sc-if value="{{br.isWhen}}" hint-placeholder-val="{{ true }}">
                  <p class="help" style="margin: 8px 0">Compares command properties with constants. Each "when" is checked on its own — several can fire.</p>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <sc-for list="{{br.conds}}" as="c" hint-placeholder-count="1">
                      <div style="display: flex; gap: 5px">
                        <sc-if value="{{c.showJoin}}" hint-placeholder-val="{{ false }}"><select class="f sm" value="{{c.join}}" onChange="{{c.setJoin}}" aria-label="Join" style="width: 50px"><option value="and">and</option><option value="or">or</option></select></sc-if>
                        <select class="f sm mono" value="{{c.left}}" onChange="{{c.setLeft}}" aria-label="Property" style="flex: 1">
                          <option data-for="condOperands" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <select class="f sm" value="{{c.op}}" onChange="{{c.setOp}}" aria-label="Comparison" style="width: 48px">
                          <option data-for="c.ops" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f sm mono" value="{{c.right}}" onChange="{{c.setRight}}" aria-label="Value" style="width: 66px">
                        <button class="x" onClick="{{c.remove}}" aria-label="Remove condition" style="width: 20px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                    </sc-for>
                    <button class="add" onClick="{{br.addCond}}" style="padding: 2px 0; font-size: 12px">+ and / or…</button>
                  </div>
                </sc-if>
                <div class="kick" style="margin: 14px 0 6px">Event</div>
                <input class="f" value="{{br.event}}" onChange="{{br.setEvent}}" aria-label="Event name" style="width: 100%; font-weight: 700">
                <div class="kick" style="margin: 14px 0 6px">Lands on</div>
                <select class="f mono" value="{{br.landsOn}}" onChange="{{br.setLands}}" aria-label="Event source" style="width: 100%; font-size: 12px">
                  <option data-for="br.landOptions" data-as="o" value="{{o}}">{{o}}</option>
                </select>
                <div class="kick" style="margin: 14px 0 6px">Payload</div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{br.maps}}" as="m" hint-placeholder-count="3">
                    <div style="display: flex; gap: 5px; align-items: center">
                      <input class="f sm mono" value="{{m.field}}" onChange="{{m.setField}}" aria-label="Event property" style="width: 110px">
                      <span style="color: #8b9aa7">=</span>
                      <select class="f sm mono" value="{{m.sel}}" onChange="{{m.setSource}}" aria-label="Source" style="flex: 1">
                        <option data-for="mapSources" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{m.remove}}" aria-label="Remove mapping" style="width: 20px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                    <sc-if value="{{m.isConst}}" hint-placeholder-val="{{ false }}"><input class="f sm mono" value="{{m.source}}" onChange="{{m.setConst}}" aria-label="Constant value" style="margin-left: 126px"></sc-if>
                  </sc-for>
                </div>
                <div style="display: flex; justify-content: space-between">
                  <button class="add" onClick="{{br.addMap}}">+ Map a property</button>
                  <button class="add" onClick="{{br.remove}}" style="color: #ef7a7a">Remove</button>
                </div>
              </sc-if>

              <!-- Handler -->
              <sc-if value="{{ins.handler}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #c4b5fd">Handler</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Imperative implementation</h3>
                <p class="help">For logic the produces flow can't express. A command uses either produces or a handler, never both.</p>
                <div class="seg" style="width: max-content; margin: 14px 0 10px">
                  <button onClick="{{hFile}}" style="background: {{segHF.bg}}; color: {{segHF.fg}}">File</button>
                  <button onClick="{{hInline}}" style="background: {{segHI.bg}}; color: {{segHI.fg}}">Inline C#</button>
                </div>
                <sc-if value="{{handlerIsFile}}" hint-placeholder-val="{{ true }}"><input class="f mono" value="{{handler.file}}" onChange="{{setHandlerFile}}" aria-label="Handler file" style="width: 100%; font-size: 12px"></sc-if>
                <sc-if value="{{handlerIsInline}}" hint-placeholder-val="{{ false }}"><textarea class="mono" value="{{handler.code}}" onChange="{{setHandlerCode}}" aria-label="Inline handler" rows="9" style="width: 100%; background: #0f1a24; border: 1px solid #3d3566; border-radius: 6px; color: #ddd6fe; font-size: 11.5px; padding: 10px; resize: vertical"></textarea></sc-if>
              </sc-if>

              <!-- Operation -->
              <sc-if value="{{ins.op}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #f29ad0">Operation · side effect</div>
                <input value="{{oi.name}}" onChange="{{oi.setName}}" aria-label="Operation name" style="margin-top: 4px; background: transparent; border: 0; border-bottom: 1px dashed #5a3a52; color: #e6edf3; font: 700 17px 'Nunito Sans', system-ui, sans-serif; padding: 2px 0; width: 100%; outline: none">
                <p class="help">Arc runs operations after the events are enrolled and before they commit, in this order. If one fails, Arc compensates what it attempted — newest first — and never what didn't start.</p>
                <div style="display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; color: #a9b7c2">
                  <span>Uses</span>
                  <select class="f" value="{{oi.system}}" onChange="{{oi.setSystem}}" aria-label="System"><option data-for="systemNames" data-as="o" value="{{o}}">{{o}}</option></select>
                  <span></span><span style="font-size: 11.5px; color: #8b9aa7">{{oi.systemDesc}}</span>
                </div>
                <div class="kick" style="margin: 14px 0 6px">Inputs</div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{oi.inputs}}" as="m" hint-placeholder-count="2">
                    <div style="display: flex; gap: 5px; align-items: center">
                      <input class="f sm mono" value="{{m.name}}" onChange="{{m.setName}}" aria-label="Input name" style="width: 96px">
                      <span class="glyph" style="background: {{m.gc}}" title="{{m.type}}">{{m.glyph}}</span>
                      <span style="color: #8b9aa7">=</span>
                      <select class="f sm mono" value="{{m.source}}" onChange="{{m.setSource}}" aria-label="Source" style="flex: 1"><option data-for="opSources" data-as="o" value="{{o}}">{{o}}</option></select>
                      <button class="x" onClick="{{m.remove}}" aria-label="Remove input" style="width: 20px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{oi.addInput}}">+ Input</button>
                <div class="kick" style="margin: 8px 0 6px">Execute</div>
                <input class="f" value="{{oi.execute}}" onChange="{{oi.setExecute}}" placeholder="What it does, in domain words" aria-label="Execute description" style="width: 100%">
                <input class="f sm mono" value="{{oi.file}}" onChange="{{oi.setFile}}" placeholder="Operations/Name.cs (optional)" aria-label="Implementation file" style="width: 100%; margin-top: 6px">
                <div class="kick" style="margin: 14px 0 6px">Compensate</div>
                <label class="chk"><input type="checkbox" checked="{{oi.compensate}}" onChange="{{oi.tComp}}">It can be reversed</label>
                <sc-if value="{{oi.compensate}}" hint-placeholder-val="{{ true }}"><input class="f" value="{{oi.compensateText}}" onChange="{{oi.setComp}}" placeholder="How it is reversed" aria-label="Compensate description" style="width: 100%; margin-top: 6px"></sc-if>
                <sc-if value="{{oi.noComp}}" hint-placeholder-val="{{ false }}"><p class="help">No reversal: if a later step fails, this one stays done. Arc never invents one.</p></sc-if>
                <div style="display: flex; justify-content: space-between; margin-top: 6px">
                  <span style="display: flex; gap: 4px"><button class="add" onClick="{{oi.up}}" style="font-size: 12px">↑ Earlier</button><button class="add" onClick="{{oi.down}}" style="font-size: 12px; margin-left: 8px">↓ Later</button></span>
                  <button class="add" onClick="{{oi.remove}}" style="color: #ef7a7a">Remove</button>
                </div>
              </sc-if>

              <!-- Returns -->
              <sc-if value="{{ins.returns}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Response</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">What the sender gets back</h3>
                <p class="help">Given back only when the command is accepted. Every value comes straight from a property of the command — generated ones included.</p>
                <div class="seg" style="width: max-content; margin: 12px 0 10px">
                  <button onClick="{{retNone}}" style="background: {{retSeg.none.bg}}; color: {{retSeg.none.fg}}">Nothing</button>
                  <button onClick="{{retScalar}}" style="background: {{retSeg.scalar.bg}}; color: {{retSeg.scalar.fg}}">One value</button>
                  <button onClick="{{retRecord}}" style="background: {{retSeg.record.bg}}; color: {{retSeg.record.fg}}">A record</button>
                </div>
                <sc-if value="{{retIsScalar}}" hint-placeholder-val="{{ true }}">
                  <select class="f mono" value="{{retScalarSource}}" onChange="{{setRetScalar}}" aria-label="Value" style="width: 100%"><option data-for="propNames" data-as="o" value="{{o}}">{{o}}</option></select>
                </sc-if>
                <sc-if value="{{retIsRecord}}" hint-placeholder-val="{{ false }}">
                <p class="help" style="margin: 0 0 8px">Fields keep this order and are the response's contract names.</p>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{retRows}}" as="m" hint-placeholder-count="1">
                    <div style="display: flex; gap: 5px; align-items: center">
                      <input class="f sm mono" value="{{m.field}}" onChange="{{m.setField}}" aria-label="Response field" style="width: 110px">
                      <span class="glyph" style="background: {{m.gc}}" title="{{m.type}}">{{m.glyph}}</span>
                      <span style="color: #8b9aa7">=</span>
                      <select class="f sm mono" value="{{m.source}}" onChange="{{m.setSource}}" aria-label="Source" style="flex: 1">
                        <option data-for="propNames" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{m.remove}}" aria-label="Remove field" style="width: 20px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addRet}}">+ Field</button>
                </sc-if>
              </sc-if>

              <!-- Concurrency -->
              <sc-if value="{{ins.conc}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <div class="kick" style="color: #8ccbff">Concurrency guard</div>
                  <button class="toggle" onClick="{{toggleConc}}" aria-label="Concurrency guard on or off" style="background: {{concTog.bg}}"><span class="knob" style="left: {{concTog.left}}"></span></button>
                </div>
                <h3 style="margin: 4px 0 0; font-size: 17px">When two requests race</h3>
                <p class="help">{{concIntro}}</p>
                <sc-if value="{{concOn}}" hint-placeholder-val="{{ true }}">
                  <div class="kick" style="margin: 14px 0 6px">They collide when they share…</div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <button onClick="{{concDim.es.toggle}}" style="display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid {{concDim.es.bd}}; background: {{concDim.es.bg}}; border-radius: 8px; padding: 8px 10px">
                      <span style="width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid {{concDim.es.bd}}; background: {{concDim.es.box}}; flex: none; display: inline-flex; align-items: center; justify-content: center; color: #0b2540; font-size: 11px; font-weight: 900">{{concDim.es.check}}</span>
                      <span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">The same event source</span><span style="font-size: 11.5px; color: #8b9aa7">{{concDim.es.sub}}</span></span>
                    </button>
                    <div style="display: grid; grid-template-columns: 112px 1fr; gap: 6px 8px; align-items: center; font-size: 12.5px; color: #a9b7c2; margin-top: 4px">
                      <span>Source type</span>
                      <select class="f sm" value="{{conc.sourceType}}" onChange="{{concSet.sourceType}}" aria-label="Event source type"><option data-for="concOpts.sourceType" data-as="o" value="{{o}}">{{o}}</option></select>
                      <span>Stream type</span>
                      <select class="f sm" value="{{conc.streamType}}" onChange="{{concSet.streamType}}" aria-label="Event stream type"><option data-for="concOpts.streamType" data-as="o" value="{{o}}">{{o}}</option></select>
                      <span>Stream id</span>
                      <select class="f sm" value="{{conc.streamId}}" onChange="{{concSet.streamId}}" aria-label="Event stream id"><option data-for="concOpts.streamId" data-as="o" value="{{o}}">{{o}}</option></select>
                    </div>
                    <div style="font-size: 12.5px; color: #a9b7c2; margin-top: 6px">Event types</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 5px">
                      <sc-for list="{{concEvents}}" as="e" hint-placeholder-count="3">
                        <button onClick="{{e.toggle}}" style="border: 1px solid {{e.bd}}; background: {{e.bg}}; color: {{e.fg}}; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700">{{e.name}}</button>
                      </sc-for>
                    </div>
                    <p class="help">No event types chosen means every type counts.</p>
                  </div>

                  <div style="margin-top: 14px; border: 1px solid #2b3d4b; border-radius: 10px; padding: 12px; background: #0f1a24">
                    <div class="kick" style="margin-bottom: 8px">Race it</div>
                    <div style="font-size: 12.5px; color: #a9b7c2; margin-bottom: 6px">A second request arrives for…</div>
                    <div class="seg" style="width: max-content; margin-bottom: 6px">
                      <button onClick="{{race.sameTarget}}" style="background: {{race.segSame.bg}}; color: {{race.segSame.fg}}; opacity: {{race.sameOp}}">the same invoice</button>
                      <button onClick="{{race.otherTarget}}" style="background: {{race.segOther.bg}}; color: {{race.segOther.fg}}">another invoice</button>
                    </div>
                    <div style="font-size: 12.5px; color: #a9b7c2; margin: 4px 0 6px">…and appends</div>
                    <div class="seg" style="width: max-content; margin-bottom: 10px">
                      <button onClick="{{race.sameEvents}}" style="background: {{race.segSameEv.bg}}; color: {{race.segSameEv.fg}}">the same event types</button>
                      <button onClick="{{race.otherEvents}}" style="background: {{race.segOtherEv.bg}}; color: {{race.segOtherEv.fg}}">other types</button>
                    </div>
                    <div class="lane"><span style="font-weight: 800; color: #6ea8ff; width: 18px">A</span><span style="flex: 1">appends first</span><span style="font-weight: 800; color: #7ee2a6">✓ recorded</span></div>
                    <div class="lane" style="margin-top: 6px; border-color: {{race.bBd}}; background: {{race.bBg}}"><span style="font-weight: 800; color: #6ea8ff; width: 18px">B</span><span style="flex: 1">{{race.bText}}</span><span style="font-weight: 800; color: {{race.bFg}}">{{race.bResult}}</span></div>
                    <p class="help" style="margin-top: 8px">{{race.note}}</p>
                  </div>
                </sc-if>
              </sc-if>
            </sc-if>
          </div>
        </sc-if>

        <!-- STATE workspace (projection editor) -->
        <sc-if value="{{stateOpen}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; z-index: 40; background: #121c25; display: flex; flex-direction: column">
            <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid #22323f; background: #131f29">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path></svg>
              <span style="font-size: 15px; font-weight: 800; white-space: nowrap">Projection editor</span>
              <span style="font-size: 13px; color: #8b9aa7; white-space: nowrap">the state {{name}} decides against</span>
              <input class="f sm mono" value="{{projName}}" onChange="{{setProjName}}" aria-label="Projection name" style="width: 150px">
              <span style="flex: 1"></span>
              <sc-if value="{{pe.hasMsg}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: #c6e03a; background: #1d2616; border: 1px solid #4a5a20; border-radius: 6px; padding: 5px 10px; max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis" title="{{pe.msg}}">{{pe.msg}}</span></sc-if>
              <button onClick="{{closeState}}" style="background: #4dc0b5; color: #0d1a20; border: 0; border-radius: 7px; padding: 7px 16px; font-size: 13px; font-weight: 800">Done</button>
            </div>
            <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 372px">

              <!-- Sources → Target canvas -->
              <div class="scroll" style="overflow: auto; padding: 14px 18px 20px; border-right: 1px solid #22323f; background: #16202b">
