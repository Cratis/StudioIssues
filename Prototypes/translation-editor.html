<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Translation Editor</title>
<!-- Prototype: the Command dialog in Cratis Studio, designed visually like the Query editor.
     Standalone: open this file in a browser. Everything is local state; nothing is saved. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b131b}
a{color:#5aa0f0}a:hover{color:#8cc0ff}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.kick{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8b9aa7}
.help{font-size:12px;color:#8b9aa7;line-height:1.45;margin:4px 0 0}
.f{background:#0f1a24;border:1px solid #2b3d4b;color:#e6edf3;border-radius:6px;padding:0 8px;height:32px;font:13px 'Nunito Sans',system-ui,sans-serif;min-width:0}
.f:focus{outline:none;border-color:#4fc3b8}
.f.sm{height:28px;font-size:12px;padding:0 6px}
.x{background:transparent;border:0;color:#8b9aa7;width:24px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:#1f2e3a;color:#ffb4b4}
.add{background:transparent;border:0;color:#5aa0f0;font-weight:700;font-size:13px;padding:8px 0;text-align:left}
.add:hover{color:#8cc0ff}
.card{border:1px solid #2b3d4b;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#15212b}
.tab{background:transparent;border:0;padding:14px 14px 12px;font-size:14px;font-weight:600;border-bottom:2px solid transparent}
.seg{display:flex;border:1px solid #2b3d4b;border-radius:8px;padding:3px;gap:2px;background:#0f1a24}
.seg button{border:0;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}
.step{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;font-size:14px;color:#dbe4ea;text-align:left}
.step:hover{background:#17242f}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.glyph{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:17px;padding:0 4px;border-radius:4px;color:#fff;font:700 9px system-ui,sans-serif;flex:none}
.ln{display:flex;white-space:pre;font-size:12.5px;line-height:1.75}
.lnno{width:40px;color:#4b5e6c;text-align:right;padding-right:14px;flex:none;user-select:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#dbe4ea}
.chk input{accent-color:#4aa3f0;width:15px;height:15px;margin:0}
.scroll::-webkit-scrollbar{width:10px;height:10px}.scroll::-webkit-scrollbar-thumb{background:#2b3d4b;border-radius:10px}
.colhead{position:absolute;top:0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.rawhead{background:#5b6577;color:#fff;border-radius:6px 6px 0 0;padding:6px 10px;height:40px;display:flex;flex-direction:column;justify-content:center}
.recrow{position:absolute;height:28px;display:flex;align-items:center;gap:6px;border:1px solid #2f3b4c;border-radius:5px;padding:0 6px 0 12px;background:#1d2a33;font-size:12.5px}
.tbadge{font:800 9px 'JetBrains Mono',monospace;border-radius:3px;padding:1px 5px;white-space:nowrap}
.evrow{position:absolute;height:24px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;font-size:12px;border-left:2px solid #8a5a2a;background:#1e1912}
.wchip{position:absolute;height:26px;display:flex;align-items:center;gap:7px;border:1px solid;border-radius:7px;padding:0 9px;font-size:11.5px;white-space:nowrap}
.diamond{width:9px;height:9px;transform:rotate(45deg);flex:none}
.pdot{position:absolute;width:10px;height:10px;border-radius:50%}
</style>

<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width: 1480px; height: 960px; display: flex; flex-direction: column; background: #15212b; color: #e6edf3; font-family: 'Nunito Sans', system-ui, sans-serif; border: 1px solid #2d3e4c; border-radius: 14px; overflow: hidden">

  <!-- Header -->
  <div style="height: 54px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #0f1a24; border-bottom: 1px solid #22323f">
    <span style="background: #8b8fd9; color: #12143a; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 6px 9px; border-radius: 5px">TRANSLATION</span>
    <span style="font-size: 17px; font-weight: 800">{{sliceName}}</span>
    <span style="font-size: 13px; color: #8b9aa7">Invoicing › Payments</span>
    <span style="flex: 1"></span>
    <button aria-label="Close" style="background: transparent; border: 0; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <!-- Sidebar -->
    <div class="scroll" style="width: 226px; flex: none; background: #111c26; border-right: 1px solid #22323f; display: flex; flex-direction: column; padding: 16px 12px 12px; overflow-y: auto">
      <div class="kick" style="margin: 0 6px 8px">{{flowTitle}}</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <button class="step" onClick="{{s.pick}}" style="background: {{s.bg}}; border-color: {{s.bd}}">
            <span class="dot" style="background: {{s.dot}}"></span>
            <span>{{s.label}}</span>
            <sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: {{s.badgeBg}}; color: {{s.badgeFg}}">{{s.badge}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{isIn}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 22px 6px 6px">
          <span class="kick">Specifications</span>
          <span style="font-size: 11.5px; font-weight: 700; color: {{specSummary.fg}}">{{specSummary.text}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{specRows}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: flex-start; gap: 4px">
              <button class="step" onClick="{{s.load}}" style="align-items: flex-start; font-size: 12.5px; line-height: 1.35; padding: 7px 8px; background: {{s.bg}}; border-color: {{s.bd}}">
                <span style="width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; margin-top: 1px; background: {{s.markBg}}; color: {{s.markFg}}">{{s.mark}}</span>
                <span style="display: flex; flex-direction: column; gap: 2px"><span>{{s.title}}</span><span style="font-size: 11px; color: {{s.subFg}}">{{s.sub}}</span></span>
              </button>
              <button class="x" onClick="{{s.remove}}" aria-label="Delete specification" style="margin-top: 4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <span style="flex: 1"></span>
      <div style="border-top: 1px solid #22323f; padding: 12px 6px 0; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: #8b9aa7">
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #8d97a8"></span>Outside</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #4dc0b5"></span>Captured</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #f0913a"></span>Event</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #6ea8ff"></span>Public</span>
      </div>
    </div>

    <!-- Main -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      <div style="padding: 14px 22px 12px; flex: none; display: flex; gap: 22px; align-items: flex-end">
        <div style="flex: 1; min-width: 0">
          <input value="{{sliceName}}" onChange="{{setSliceName}}" aria-label="Slice name" style="margin: 0 0 8px; background: transparent; border: 0; color: #e6edf3; font: 800 24px 'Nunito Sans', system-ui, sans-serif; padding: 0; width: 100%; outline: none">
          <textarea value="{{desc}}" onChange="{{setDesc}}" aria-label="Description" rows="2" placeholder="What does this translation do, in domain words?" style="width: 100%; resize: none; background: #0f1a24; border: 1px solid #2b3d4b; border-radius: 6px; color: #e6edf3; font: 14px 'Nunito Sans', system-ui, sans-serif; padding: 9px 12px; outline: none"></textarea>
        </div>
        <div style="flex: none">
          <div class="kick" style="margin-bottom: 6px">Direction</div>
          <div class="seg">
            <button onClick="{{goIn}}" style="background: {{segIn.bg}}; color: {{segIn.fg}}">Inbound · outside → our facts</button>
            <button onClick="{{goOut}}" style="background: {{segOut.bg}}; color: {{segOut.fg}}">Outbound · our facts → public</button>
          </div>
        </div>
      </div>

      <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 0 14px; background: #131f29; border-top: 1px solid #22323f; border-bottom: 1px solid #22323f">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; border-bottom-color: {{t.bd}}">{{t.label}}</button>
        </sc-for>
        <span style="flex: 1"></span>
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{toggleTry}}" style="display: flex; align-items: center; gap: 7px; background: {{tryBtn.bg}}; color: {{tryBtn.fg}}; border: 1px solid {{tryBtn.bd}}; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 700">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>{{tryBtn.label}}
          </button>
        </sc-if>
      </div>

      <div style="flex: 1; min-height: 0; display: flex; position: relative">

        <!-- ===== DESIGN · INBOUND ===== -->
        <sc-if value="{{showInDesign}}" hint-placeholder-val="{{ true }}">
          <div class="scroll" style="flex: 1; min-width: 0; overflow: auto; background: #131e28; background-image: radial-gradient(#1f2e3a 1px, transparent 1px); background-size: 18px 18px; padding: 14px 18px 24px">
            <div style="position: relative; width: 870px; height: {{cv.h}}px">
              <span class="colhead" style="left: 0; color: #a9b3c4">{{cv.aTitle}}</span>
              <span class="colhead" style="left: 312px; color: #4dc0b5">Captured record</span>
              <span class="colhead" style="left: 646px; color: #f0a060">Our events</span>

              <sc-for list="{{cv.lines}}" as="l" hint-placeholder-count="10">
                <svg width="870" height="{{cv.h}}" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none" aria-hidden="true">
                  <path d="{{l.d}}" fill="none" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" opacity="{{l.o}}" stroke-linecap="round"></path>
                  <path d="{{l.d}}" fill="none" stroke="transparent" stroke-width="12" style="pointer-events: stroke; cursor: pointer" onClick="{{l.pick}}"></path>
                </svg>
              </sc-for>
              <sc-for list="{{cv.labels}}" as="t" hint-placeholder-count="3">
                <button onClick="{{t.pick}}" style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; transform: translate(-50%, -50%); background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}}; border-radius: 4px; padding: 1px 5px; font: 800 9px 'JetBrains Mono', monospace; white-space: nowrap; z-index: 3">{{t.text}}</button>
              </sc-for>

              <!-- A: outside -->
              <sc-for list="{{cv.aCards}}" as="c" hint-placeholder-count="1">
                <div style="position: absolute; left: 0; top: {{c.y}}px; width: 226px; border: 1px solid {{c.bd}}; border-radius: 7px; background: #1a222d">
                  <button onClick="{{selSource}}" class="rawhead" style="border: 0; width: 100%; text-align: left; background: {{c.hbg}}">
                    <span style="font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
                    <span class="mono" style="font-size: 10.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center"><sc-if value="{{c.hasOrigin}}" hint-placeholder-val="{{ false }}"><span style="font: 800 9.5px 'Nunito Sans', sans-serif; background: #6ea8ff; color: #0b2540; border-radius: 3px; padding: 0 5px">PUBLIC · from {{c.origin}}</span></sc-if>{{c.sub}}</span>
                  </button>
                  <div style="padding: 4px 0 6px">
                    <sc-for list="{{c.fields}}" as="x" hint-placeholder-count="5">
                      <div draggable="true" onDragStart="{{x.drag}}" onDragEnd="{{dragEnd}}" title="Drag onto the captured record" style="height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; font-size: 12px; cursor: grab; position: relative">
                        <span class="mono" style="color: #dfe5ee; flex: none">{{x.name}}</span>
                        <span class="mono" style="flex: 1; min-width: 0; text-align: right; font-size: 10.5px; color: {{x.vc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.val}}</span>
                        <span class="glyph" style="background: {{x.gc}}">{{x.glyph}}</span>
                        <span class="pdot" style="right: -5px; top: 8px; background: {{x.dot}}; border: 2px solid #8d97a8"></span>
                      </div>
                    </sc-for>
                  </div>
                </div>
              </sc-for>

              <!-- B: captured record -->
              <div onDragOver="{{cv.recHeadOver}}" onDrop="{{cv.recHeadDrop}}" draggable="true" onDragStart="{{cv.recHeadDrag}}" onDragEnd="{{dragEnd}}" onClick="{{selRecord}}" title="Drop an outside field here to capture it · drag onto “New event” to create one" style="position: absolute; left: 312px; top: 22px; width: 248px; height: 40px; background: #4dc0b5; color: #062421; border-radius: 6px 6px 0 0; padding: 4px 10px; cursor: grab; outline: {{cv.recHeadOutline}}; outline-offset: 2px; display: flex; flex-direction: column; justify-content: center">
                <span style="font-size: 12.5px; font-weight: 800">capture {{capName}}</span>
                <span class="mono" style="font-size: 10.5px; opacity: .8">key {{keyText}}</span>
              </div>
              <div style="position: absolute; left: 312px; top: 62px; width: 248px; height: {{cv.recBodyH}}px; border: 1px solid #2f7d76; border-top: 0; border-radius: 0 0 6px 6px; background: #17232b"></div>
              <sc-for list="{{cv.recRows}}" as="r" hint-placeholder-count="8">
                <div class="recrow" draggable="true" onDragStart="{{r.drag}}" onDragEnd="{{dragEnd}}" onDragOver="{{r.over}}" onDrop="{{r.drop}}" onClick="{{r.pick}}" style="left: 318px; top: {{r.y}}px; width: 236px; border-color: {{r.bd}}; background: {{r.bg}}; opacity: {{r.op}}; cursor: grab">
                  <span class="pdot" style="left: -12px; top: 8px; background: {{r.inDot}}; border: 2px solid #4dc0b5"></span>
                  <sc-if value="{{r.isKey}}" hint-placeholder-val="{{ false }}"><span class="tbadge" style="background: #c6e03a; color: #1c2408">KEY</span></sc-if>
                  <span class="mono" style="flex: 1 0 auto; max-width: 132px; color: {{r.fg}}; font-style: {{r.fs}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                  <sc-if value="{{r.hasVal}}" hint-placeholder-val="{{ false }}"><span class="mono" style="flex: 1 1 auto; min-width: 0; text-align: right; font-size: 10.5px; color: {{r.vc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.val}}</span></sc-if>
                  <span class="tbadge" style="background: {{r.tbg}}; color: {{r.tfg}}">{{r.tag}}</span>
                  <span class="pdot" style="right: -12px; top: 8px; background: {{r.outDot}}; border: 2px solid #4dc0b5"></span>
                </div>
              </sc-for>
              <div style="position: absolute; left: 318px; top: {{cv.addMapY}}px; display: flex; gap: 6px">
                <button onClick="{{addTemplate}}" style="background: #172633; border: 1px dashed #2f7d76; color: #8fe3d9; border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 700">+ Template</button>
                <button onClick="{{addTranslate}}" style="background: #172633; border: 1px dashed #2f7d76; color: #8fe3d9; border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 700">+ Translate</button>
                <button onClick="{{addSplit}}" style="background: #172633; border: 1px dashed #2f7d76; color: #8fe3d9; border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 700">+ Split</button>
              </div>

              <!-- C: our events -->
              <sc-for list="{{cv.evCards}}" as="e" hint-placeholder-count="3">
                <div>
                  <button class="wchip" onClick="{{e.pick}}" onDragOver="{{e.chipOver}}" onDrop="{{e.chipDrop}}" title="Drop a captured field here to watch it" style="left: 646px; top: {{e.chipY}}px; width: 224px; border-color: {{e.chipBd}}; background: {{e.chipBg}}; outline: {{e.chipOutline}}; outline-offset: 2px">
                    <span class="diamond" style="background: {{e.dia}}"></span>
                    <span style="font-weight: 800; font-size: 10px; letter-spacing: .07em; color: {{e.dia}}">{{e.kw}}</span>
                    <span class="mono" style="color: #dbe4ea; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: left">{{e.cond}}</span>
                    <span class="pdot" style="left: -6px; top: 7px; background: {{e.chipDot}}; border: 2px solid #e2a84a"></span>
                  </button>
                  <div onDragOver="{{e.headOver}}" onDrop="{{e.headDrop}}" onClick="{{e.pick}}" style="position: absolute; left: 646px; top: {{e.headY}}px; width: 224px; height: 30px; display: flex; align-items: center; gap: 6px; background: {{e.hbg}}; color: #2a1405; border-radius: 6px 6px 0 0; padding: 0 8px 0 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; outline: {{e.headOutline}}; outline-offset: 2px; box-shadow: {{e.sh}}; opacity: {{e.op}}">
                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{e.name}}</span>
                    <sc-if value="{{e.hasStatus}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9.5px; background: {{e.stBg}}; color: {{e.stFg}}; border-radius: 3px; padding: 1px 5px">{{e.status}}</span></sc-if>
                  </div>
                  <sc-for list="{{e.rows}}" as="p" hint-placeholder-count="3">
                    <div class="evrow" onDragOver="{{p.over}}" onDrop="{{p.drop}}" onClick="{{e.pick}}" style="left: 646px; top: {{p.y}}px; width: 224px; background: {{p.bg}}; opacity: {{e.op}}">
                      <span class="pdot" style="left: -7px; top: 6px; background: {{p.dot}}; border: 2px solid #f0913a"></span>
                      <span class="mono" style="flex: 1; color: #f3dfca; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
                      <sc-if value="{{p.hasSrc}}" hint-placeholder-val="{{ false }}"><span class="mono" style="font-size: 10px; color: #c9a27a; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.src}}</span></sc-if>
                      <span class="glyph" style="background: {{p.gc}}">{{p.glyph}}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
              <div onDragOver="{{cv.newOver}}" onDrop="{{cv.newDrop}}" onClick="{{addEvent}}" style="position: absolute; left: 646px; top: {{cv.newY}}px; width: 224px; height: 44px; border: 1.5px dashed {{cv.newBd}}; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f0a060; font-size: 12px; font-weight: 700; cursor: pointer; background: {{cv.newBg}}">
                <span>+ New event</span>
                <span style="font-size: 10.5px; color: #8b9aa7; font-weight: 600">or drop the captured record here</span>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- ===== DESIGN · OUTBOUND ===== -->
        <sc-if value="{{showOutDesign}}" hint-placeholder-val="{{ false }}">
          <div class="scroll" style="flex: 1; min-width: 0; overflow: auto; background: #16202b; padding: 14px 18px 24px">
            <div style="display: flex; width: 870px; margin-bottom: 10px">
              <span class="kick" style="width: 520px; color: #f0a060">Our private events</span>
              <span class="kick" style="color: #6ea8ff">Public contract</span>
            </div>
            <div style="position: relative; width: 870px; height: {{ob.h}}px">
              <sc-for list="{{ob.lines}}" as="l" hint-placeholder-count="6">
                <svg width="870" height="{{ob.h}}" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none" aria-hidden="true">
                  <path d="{{l.d}}" fill="none" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" opacity="{{l.o}}" stroke-linecap="round"></path>
                  <path d="{{l.d}}" fill="none" stroke="transparent" stroke-width="12" style="pointer-events: stroke; cursor: pointer" onClick="{{l.pick}}"></path>
                </svg>
              </sc-for>
              <sc-for list="{{ob.labels}}" as="t" hint-placeholder-count="3">
                <button onClick="{{t.pick}}" style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; transform: translate(-50%, -50%); background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}}; border-radius: 4px; padding: 1px 6px; font: 800 9.5px 'JetBrains Mono', monospace; white-space: nowrap; z-index: 3">{{t.text}}</button>
              </sc-for>
              <sc-for list="{{ob.sources}}" as="f" hint-placeholder-count="3">
                <div style="position: absolute; left: 0; top: {{f.y}}px; width: 360px">
                  <div draggable="true" onDragStart="{{f.drag}}" onDragEnd="{{dragEnd}}" style="height: 30px; display: flex; align-items: center; gap: 6px; background: #f99a32; color: #2a1405; border-radius: 5px; padding: 0 6px 0 10px; font-size: 12px; font-weight: 800; cursor: grab; position: relative; opacity: {{f.op}}">
                    <span style="flex: 1">{{f.event}}</span>
                    <sc-if value="{{f.noAuto}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9.5px; background: rgba(0,0,0,.18); padding: 1px 5px; border-radius: 3px">NO AUTOMAP</span></sc-if>
                    <button onClick="{{f.remove}}" aria-label="Remove source" style="background: transparent; border: 0; color: #2a1405; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-right: 6px"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    <span class="pdot" style="right: -5px; top: 10px; background: #f99a32; border: 2px solid #2a1405"></span>
                  </div>
                  <sc-for list="{{f.fields}}" as="x" hint-placeholder-count="2">
                    <div draggable="true" onDragStart="{{x.drag}}" onDragEnd="{{dragEnd}}" style="height: 24px; display: flex; align-items: center; gap: 7px; margin-left: 14px; padding: 0 12px 0 8px; border-left: 2px solid #8a5a2a; font-size: 11.5px; color: #e9d6c3; cursor: grab; position: relative">
                      <span class="mono" style="flex: 1">{{x.name}}</span>
                      <span class="glyph" style="background: {{x.gc}}">{{x.glyph}}</span>
                      <span class="pdot" style="right: -5px; top: 7px; background: {{x.dot}}; border: 2px solid #f99a32"></span>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
              <div style="position: absolute; left: 0; top: {{ob.palY}}px; width: 360px">
                <div class="kick" style="margin-bottom: 6px">Other private events</div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{ob.palette}}" as="e" hint-placeholder-count="1">
                    <span draggable="true" onDragStart="{{e.drag}}" onDragEnd="{{dragEnd}}" style="border: 1px dashed #f99a32; color: #f8b878; border-radius: 5px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; cursor: grab">{{e.name}}</span>
                  </sc-for>
                </div>
              </div>
              <div style="position: absolute; left: 520px; top: 0; width: 350px">
                <div onDragOver="{{ob.headOver}}" onDrop="{{ob.headDrop}}" onClick="{{selPublic}}" style="height: 36px; display: flex; align-items: center; gap: 8px; background: #f99a32; color: #2a1405; border-radius: 6px 6px 0 0; padding: 0 10px; outline: {{ob.headOutline}}; outline-offset: 2px; cursor: pointer">
                  <span style="font: 800 9.5px 'JetBrains Mono', monospace; background: #6ea8ff; color: #0b2540; border-radius: 3px; padding: 2px 5px">PUBLIC</span>
                  <span style="font-size: 13px; font-weight: 800; flex: 1">{{pub.name}}</span>
                  <span style="font-size: 10.5px; font-weight: 700; opacity: .7">{{ob.headHint}}</span>
                </div>
                <div style="border: 1px solid #6ea8ff; border-top: 0; border-radius: 0 0 6px 6px; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; background: #1b2431">
                  <sc-for list="{{ob.rows}}" as="p" hint-placeholder-count="5">
                    <div onDragOver="{{p.over}}" onDrop="{{p.drop}}" onClick="{{selPublic}}" style="height: 30px; display: flex; align-items: center; gap: 7px; border: 1px solid {{p.bd}}; background: {{p.bg}}; border-radius: 5px; padding: 0 8px 0 14px; position: relative">
                      <span class="pdot" style="left: -12px; top: 9px; background: {{p.dot}}; border: 2px solid #6ea8ff"></span>
                      <span class="mono" style="flex: 1; font-size: 12.5px">{{p.name}}</span>
                      <sc-if value="{{p.unset}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #f0c46a">never set</span></sc-if>
                      <span class="glyph" style="background: {{p.gc}}">{{p.glyph}}</span>
                      <span style="font-size: 11px; color: #a9b7c2; width: 58px">{{p.type}}</span>
                    </div>
                  </sc-for>
                </div>
                <div style="margin-top: 12px; font-size: 12px; color: #8b9aa7; line-height: 1.45">Built by the projection <span class="mono" style="color: #c6e03a">{{projName}}</span>. Each time one of its source events happens, the current shape is published to other applications as <span class="mono">{{pub.name}}</span>.</div>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- ===== INSPECTOR ===== -->
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <div class="scroll" style="width: 344px; flex: none; border-left: 1px solid #22323f; background: #111c26; overflow-y: auto; padding: 16px 18px 24px">

            <sc-if value="{{msg.has}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; color: #8fe3d9; background: #12302d; border: 1px solid #2f6e68; border-radius: 7px; padding: 7px 10px; margin-bottom: 12px">{{msg.text}}</div></sc-if>

            <!-- TRY · inbound -->
            <sc-if value="{{tryIn}}" hint-placeholder-val="{{ false }}">
              <div class="kick" style="color: #4fc3b8">Try it · given, when, then</div>
              <h3 style="margin: 4px 0 0; font-size: 17px">What does it record if…</h3>
              <div style="border: 1px solid {{ti.bd}}; background: {{ti.bg}}; border-radius: 10px; padding: 12px; margin: 12px 0 10px">
                <div style="display: flex; gap: 8px; align-items: center"><span class="kick" style="color: {{ti.fg}}">Then</span><span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: {{ti.fg}}">{{ti.title}}</span></div>
                <sc-for list="{{ti.events}}" as="e" hint-placeholder-count="1">
                  <div style="margin-top: 9px; border-left: 3px solid #f0913a; padding-left: 9px">
                    <div style="font-size: 13px; font-weight: 800; color: #f6e7d8">{{e.name}} <span style="font-size: 11px; font-weight: 600; color: #c9a27a">· {{e.why}}</span></div>
                    <div class="mono" style="font-size: 11px; color: #8b9aa7">for "{{e.for}}"</div>
                    <sc-for list="{{e.payload}}" as="kv" hint-placeholder-count="2"><div class="mono" style="font-size: 11px; color: #c9d4dd">{{kv}}</div></sc-for>
                  </div>
                </sc-for>
                <sc-for list="{{ti.notes}}" as="n" hint-placeholder-count="1"><div style="font-size: 12px; color: #f0c46a; margin-top: 8px">⚠ {{n}}</div></sc-for>
                <div style="display: flex; gap: 6px; margin-top: 12px">
                  <input class="f sm" value="{{specDraft}}" onChange="{{setSpecDraft}}" aria-label="Specification name" style="flex: 1">
                  <button onClick="{{saveSpec}}" style="opacity: {{saveOp}}; background: #4dc0b5; color: #0d1a20; border: 0; border-radius: 6px; padding: 0 12px; font-size: 12.5px; font-weight: 800; white-space: nowrap">Save as specification</button>
                </div>
              </div>

              <div class="kick" style="margin: 12px 0 6px">The record, before → now</div>
              <div style="border: 1px solid #2b3d4b; border-radius: 8px; overflow: hidden">
                <sc-for list="{{ti.diff}}" as="d" hint-placeholder-count="6">
                  <div class="mono" style="display: grid; grid-template-columns: 108px 1fr 1fr; gap: 6px; font-size: 11px; padding: 4px 8px; background: {{d.bg}}; border-bottom: 1px solid #1d2a36">
                    <span style="color: #8fe3d9; overflow: hidden; text-overflow: ellipsis">{{d.k}}</span><span style="color: #8b9aa7; overflow: hidden; text-overflow: ellipsis">{{d.before}}</span><span style="color: {{d.c}}; overflow: hidden; text-overflow: ellipsis">{{d.after}}</span>
                  </div>
                </sc-for>
              </div>

              <sc-if value="{{tiRecord}}" hint-placeholder-val="{{ true }}">
                <div class="kick" style="margin: 16px 0 6px; color: #a9b3c4">Given — last seen for this key</div>
                <div class="seg" style="width: max-content; margin-bottom: 8px">
                  <button onClick="{{baseNone}}" style="background: {{segBase.none.bg}}; color: {{segBase.none.fg}}">First time seen</button>
                  <button onClick="{{baseSome}}" style="background: {{segBase.some.bg}}; color: {{segBase.some.fg}}">Seen before</button>
                </div>
                <sc-if value="{{hasBase}}" hint-placeholder-val="{{ true }}">
                  <div style="display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; align-items: center">
                    <sc-for list="{{baseRows}}" as="r" hint-placeholder-count="6"><label class="mono" style="font-size: 11px; color: #a9b3c4" for="{{r.id}}">{{r.name}}</label><input id="{{r.id}}" class="f sm mono" value="{{r.val}}" onChange="{{r.set}}"></sc-for>
                  </div>
                </sc-if>
                <div class="kick" style="margin: 16px 0 6px; color: #a9b3c4">When — the {{sourceWord}} delivers</div>
                <div style="display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; align-items: center">
                  <sc-for list="{{curRows}}" as="r" hint-placeholder-count="6"><label class="mono" style="font-size: 11px; color: #a9b3c4" for="{{r.id}}">{{r.name}}</label><input id="{{r.id}}" class="f sm mono" value="{{r.val}}" onChange="{{r.set}}" style="border-color: {{r.bd}}"></sc-for>
                </div>
              </sc-if>

              <sc-if value="{{tiEvents}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="margin: 16px 0 6px; color: #6ea8ff">Given — what the other application already sent</div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{givenRows}}" as="g" hint-placeholder-count="1">
                    <div style="border: 1px solid #3a4d6e; border-radius: 8px; background: #161f2c">
                      <div style="display: flex; align-items: center; gap: 6px; background: #f99a32; color: #2a1405; border-radius: 7px 7px 0 0; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 800"><span style="font: 800 9px 'JetBrains Mono', monospace; background: #6ea8ff; color: #0b2540; border-radius: 3px; padding: 1px 4px">from {{g.origin}}</span><span style="flex: 1">{{g.event}}</span><button onClick="{{g.remove}}" aria-label="Remove event" style="background: transparent; border: 0; color: #2a1405; width: 20px; height: 20px">×</button></div>
                      <div style="display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; align-items: center; padding: 8px 10px">
                        <sc-for list="{{g.fields}}" as="r" hint-placeholder-count="2"><label class="mono" style="font-size: 11px; color: #c9a27a" for="{{r.id}}">{{r.name}}</label><input id="{{r.id}}" class="f sm mono" value="{{r.val}}" onChange="{{r.set}}"></sc-for>
                      </div>
                    </div>
                  </sc-for>
                  <select class="f" value="" onChange="{{addGiven}}" aria-label="Add an event it already sent" style="color: #f0a060"><option value="">+ Add an event it already sent…</option><option data-for="fromNames" data-as="o" value="{{o}}">{{o}}</option></select>
                </div>
                <div class="kick" style="margin: 16px 0 6px; color: #6ea8ff">When — this arrives</div>
                <select class="f" value="{{whenEv.event}}" onChange="{{setWhenEvent}}" aria-label="Arriving event" style="width: 100%; margin-bottom: 8px"><option data-for="fromNames" data-as="o" value="{{o}}">{{o}}</option></select>
                <div style="display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; align-items: center">
                  <sc-for list="{{whenRows}}" as="r" hint-placeholder-count="3"><label class="mono" style="font-size: 11px; color: #c9a27a" for="{{r.id}}">{{r.name}}</label><input id="{{r.id}}" class="f sm mono" value="{{r.val}}" onChange="{{r.set}}"></sc-for>
                </div>
              </sc-if>
            </sc-if>

            <!-- TRY · outbound -->
            <sc-if value="{{tryOut}}" hint-placeholder-val="{{ false }}">
              <div class="kick" style="color: #4fc3b8">Try it</div>
              <h3 style="margin: 4px 0 0; font-size: 17px">What do other applications see?</h3>
              <p class="help">Each source event updates the shape for its invoice and publishes it. Screenplay records the publication as a fact; it doesn't deliver it.</p>
              <div style="display: flex; flex-direction: column; margin-top: 12px">
                <sc-for list="{{pubTimeline}}" as="t" hint-placeholder-count="3">
                  <div style="display: flex; gap: 10px">
                    <div style="display: flex; flex-direction: column; align-items: center; width: 14px"><span style="width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: {{t.dot}}"></span><span style="flex: 1; width: 2px; background: #2b3d4b"></span></div>
                    <div style="padding-bottom: 12px; flex: 1; min-width: 0">
                      <div style="font-size: 12.5px; font-weight: 700; color: #f6e7d8">{{t.event}} <span class="mono" style="font-weight: 400; color: #8b9aa7; font-size: 11px">for {{t.for}}</span></div>
                      <sc-if value="{{t.published}}" hint-placeholder-val="{{ true }}">
                        <div style="margin-top: 4px; border: 1px solid #2f5f88; background: #13243f; border-radius: 6px; padding: 6px 8px">
                          <div style="font-size: 11.5px; font-weight: 800; color: #8cc0ff">↗ publishes {{pub.name}}</div>
                          <sc-for list="{{t.rows}}" as="r" hint-placeholder-count="3"><div class="mono" style="font-size: 11px; color: {{r.c}}">{{r.t}}</div></sc-for>
                        </div>
                      </sc-if>
                      <sc-if value="{{t.skipped}}" hint-placeholder-val="{{ false }}"><div style="font-size: 11.5px; color: #6b7d8b">not a source — nothing published</div></sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
              <div class="kick" style="margin: 8px 0 6px; color: #f0a060">Given — our events</div>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{oGivenRows}}" as="g" hint-placeholder-count="2">
                  <div style="border: 1px solid #5a4128; border-radius: 8px; background: #1e1912">
                    <div style="display: flex; align-items: center; gap: 6px; background: #f99a32; color: #2a1405; border-radius: 7px 7px 0 0; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 800"><span style="flex: 1">{{g.event}}</span><span style="font-size: 10.5px">for</span><input class="mono" value="{{g.for}}" onChange="{{g.setFor}}" aria-label="Event source" style="width: 86px; height: 22px; border: 0; border-radius: 4px; background: rgba(255,255,255,.55); color: #2a1405; font-size: 11px; padding: 0 5px"><button onClick="{{g.remove}}" aria-label="Remove event" style="background: transparent; border: 0; color: #2a1405; width: 20px; height: 20px">×</button></div>
                    <sc-if value="{{g.hasFields}}" hint-placeholder-val="{{ true }}"><div style="display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; align-items: center; padding: 8px 10px">
                      <sc-for list="{{g.fields}}" as="r" hint-placeholder-count="2"><label class="mono" style="font-size: 11px; color: #c9a27a" for="{{r.id}}">{{r.name}}</label><input id="{{r.id}}" class="f sm mono" value="{{r.val}}" onChange="{{r.set}}"></sc-for>
                    </div></sc-if>
                  </div>
                </sc-for>
                <select class="f" value="" onChange="{{addOGiven}}" aria-label="Add a private event" style="color: #f0a060"><option value="">+ Add something that happened…</option><option data-for="privNames" data-as="o" value="{{o}}">{{o}}</option></select>
              </div>
            </sc-if>

            <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">

              <!-- Source -->
              <sc-if value="{{ins.source}}" hint-placeholder-val="{{ true }}">
                <div class="kick" style="color: #a9b3c4">Source · where the outside data comes from</div>
                <input value="{{capName}}" onChange="{{setCapName}}" aria-label="Capture name" class="mono" style="margin-top: 4px; background: transparent; border: 0; border-bottom: 1px dashed #3b4658; color: #e6edf3; font-size: 16px; font-weight: 700; padding: 2px 0; width: 100%; outline: none">
                <div class="seg" style="width: max-content; margin: 12px 0 10px">
                  <sc-for list="{{kindSeg}}" as="k" hint-placeholder-count="4"><button onClick="{{k.pick}}" style="background: {{k.bg}}; color: {{k.fg}}">{{k.label}}</button></sc-for>
                </div>
                <p class="help" style="margin: 0 0 10px">{{kindHelp}}</p>
                <sc-if value="{{isRecordKind}}" hint-placeholder-val="{{ true }}">
                  <div style="display: grid; grid-template-columns: 64px 1fr; gap: 6px 8px; align-items: center; font-size: 12.5px; color: #a9b7c2">
                    <sc-for list="{{settingRows}}" as="s" hint-placeholder-count="3"><span class="mono">{{s.name}}</span><input class="f sm mono" value="{{s.val}}" onChange="{{s.set}}" aria-label="{{s.name}}"></sc-for>
                  </div>
                  <div class="kick" style="margin: 16px 0 6px">Fields in each record</div>
                  <div style="display: flex; flex-direction: column; gap: 5px">
                    <sc-for list="{{rawEdit}}" as="r" hint-placeholder-count="5">
                      <div style="display: flex; gap: 5px; align-items: center">
                        <input class="f sm mono" value="{{r.name}}" onChange="{{r.setName}}" aria-label="Field name" style="flex: 1">
                        <select class="f sm" value="{{r.type}}" onChange="{{r.setType}}" aria-label="Type" style="width: 92px"><option data-for="rawTypes" data-as="o" value="{{o}}">{{o}}</option></select>
                        <button class="x" onClick="{{r.remove}}" aria-label="Remove field"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                    </sc-for>
                  </div>
                  <button class="add" onClick="{{addRaw}}">+ Field</button>
                  <div class="kick" style="margin: 10px 0 6px">Or paste a sample record</div>
                  <textarea class="mono" value="{{sampleJson}}" onChange="{{setSampleJson}}" aria-label="Sample JSON" rows="7" style="width: 100%; background: #0f1a24; border: 1px solid #2b3d4b; border-radius: 6px; color: #dbe4ea; font-size: 11px; padding: 8px; resize: vertical"></textarea>
                  <button onClick="{{inferFields}}" style="margin-top: 6px; background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 6px 10px; font-size: 12.5px; color: #8cc0ff; font-weight: 700">Infer fields from the sample</button>
                </sc-if>
                <sc-if value="{{isEventsKind}}" hint-placeholder-val="{{ false }}">
                  <div class="kick" style="margin: 4px 0 6px">From these public events</div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <sc-for list="{{foreignRows}}" as="f" hint-placeholder-count="2">
                      <label class="chk" style="align-items: flex-start"><input type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}" style="margin-top: 3px"><span style="display: flex; flex-direction: column"><span><b>{{f.name}}</b> <span style="font-size: 11px; color: #8cc0ff">from "{{f.origin}}"</span></span><span class="mono" style="font-size: 10.5px; color: #8b9aa7">{{f.fields}}</span></span></label>
                    </sc-for>
                  </div>
                  <p class="help" style="margin-top: 10px">Each event's fields overlay what was remembered for its key, so a later event only needs the fields it changes. Only an inbound translation may consume events from another application.</p>
                </sc-if>
              </sc-if>

              <!-- Record / key -->
              <sc-if value="{{ins.record}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #4dc0b5">Captured record</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Our shape of {{capName}}</h3>
                <p class="help">Map steps run in order. Anything no step touches passes through unchanged — shown dashed.</p>
                <div style="display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; color: #a9b7c2">
                  <span>Key</span>
                  <select class="f mono" value="{{keyVal}}" onChange="{{setKey}}" aria-label="Key"><option data-for="keyOptions" data-as="o" value="{{o}}">{{o}}</option></select>
                </div>
                <p class="help">{{keyHelp}}</p>
                <div class="kick" style="margin: 16px 0 6px">Map steps</div>
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <sc-for list="{{mapList}}" as="m" hint-placeholder-count="5">
                    <button onClick="{{m.pick}}" class="mono" style="text-align: left; background: #15212b; border: 1px solid #2b3d4b; border-radius: 6px; padding: 6px 8px; font-size: 11.5px; color: #dbe4ea; display: flex; gap: 8px"><span style="color: #4b5e6c; width: 14px">{{m.n}}</span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.text}}</span></button>
                  </sc-for>
                </div>
              </sc-if>

              <!-- Map step -->
              <sc-if value="{{ins.map}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #4dc0b5">Map step {{mi.n}}</div>
                <div class="seg" style="width: max-content; margin: 8px 0 12px">
                  <sc-for list="{{mi.kinds}}" as="k" hint-placeholder-count="4"><button onClick="{{k.pick}}" style="background: {{k.bg}}; color: {{k.fg}}">{{k.label}}</button></sc-for>
                </div>
                <sc-if value="{{mi.hasTarget}}" hint-placeholder-val="{{ true }}">
                  <div style="display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; font-size: 12.5px; color: #a9b7c2">
                    <span>Field</span><input class="f mono" value="{{mi.target}}" onChange="{{mi.setTarget}}" aria-label="Record field">
                  </div>
                </sc-if>
                <sc-if value="{{mi.hasSrc}}" hint-placeholder-val="{{ true }}">
                  <div style="display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; font-size: 12.5px; color: #a9b7c2; margin-top: 8px">
                    <span>{{mi.srcLabel}}</span><select class="f mono" value="{{mi.src}}" onChange="{{mi.setSrc}}" aria-label="Source field"><option data-for="mi.srcOptions" data-as="o" value="{{o}}">{{o}}</option></select>
                  </div>
                </sc-if>
                <sc-if value="{{mi.isTemplate}}" hint-placeholder-val="{{ false }}">
                  <div class="kick" style="margin: 12px 0 6px">Template</div>
                  <input class="f mono" value="{{mi.template}}" onChange="{{mi.setTemplate}}" aria-label="Template" style="width: 100%">
                  <p class="help">Write <span class="mono">${field}</span> to insert a field. Uses: <span class="mono" style="color: #8fe3d9">{{mi.refs}}</span></p>
                </sc-if>
                <sc-if value="{{mi.isTranslate}}" hint-placeholder-val="{{ false }}">
                  <div class="kick" style="margin: 12px 0 6px">Their value → our value</div>
                  <div style="display: flex; flex-direction: column; gap: 5px">
                    <sc-for list="{{mi.table}}" as="t" hint-placeholder-count="3">
                      <div style="display: flex; gap: 5px; align-items: center">
                        <input class="f sm mono" value="{{t.from}}" onChange="{{t.setFrom}}" aria-label="Their value" style="flex: 1">
