<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Command Editor</title>
<!-- Prototype: the Command dialog in Cratis Studio, designed visually like the Query editor.
     Standalone: open this file in a browser. Everything is local state; nothing is saved. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b131b}
a{color:#5aa0f0}a:hover{color:#8cc0ff}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.kick{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8b9aa7}
.help{font-size:12px;color:#8b9aa7;line-height:1.45;margin:4px 0 0}
.f{background:#0f1a24;border:1px solid #2b3d4b;color:#e6edf3;border-radius:6px;padding:0 8px;height:32px;font:13px 'Nunito Sans',system-ui,sans-serif;min-width:0}
.f:focus{outline:none;border-color:#4fc3b8}
select.f{padding-right:4px}
.x{background:transparent;border:0;color:#8b9aa7;width:28px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:#1f2e3a;color:#ffb4b4}
.add{background:transparent;border:0;color:#5aa0f0;font-weight:700;font-size:13px;padding:8px 0;text-align:left}
.add:hover{color:#8cc0ff}
.card{border:1px solid #2b3d4b;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#15212b}
.row3{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center}
.vl{width:2px;height:26px;background:#33495a;margin:0 auto;position:relative}
.vl.arrow:after{content:'';position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:6px solid #33495a;border-bottom:0}
.node{display:block;width:100%;text-align:left;background:#172633;border:1px solid #2b3d4b;border-radius:10px;padding:12px 14px;transition:border-color .15s,opacity .15s}
.node:hover{background:#1b2c3a}
.ntag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.nline{font-size:12.5px;color:#c9d4dd;line-height:1.55}
.dash{flex:1;border-top:2px dashed #3a4b58;min-width:16px}
.exit{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px dashed;white-space:nowrap}
.tab{background:transparent;border:0;padding:14px 14px 12px;font-size:14px;font-weight:600;border-bottom:2px solid transparent}
.seg{display:flex;border:1px solid #2b3d4b;border-radius:8px;padding:3px;gap:2px;background:#0f1a24}
.seg button{border:0;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600}
.step{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;font-size:14px;color:#dbe4ea;text-align:left}
.step:hover{background:#17242f}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.flag{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;border:1px solid}
.hbar{position:absolute;height:2px;background:#33495a}
.bcol{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 10px;width:240px}
.bnode{background:transparent;border:0;padding:0;width:100%;display:flex;flex-direction:column;align-items:center}
.when{display:flex;align-items:center;gap:8px;border:1px solid;border-radius:8px;padding:7px 10px;max-width:100%;font-size:12px}
.diamond{width:10px;height:10px;transform:rotate(45deg);flex:none}
.evt{width:100%;text-align:left;background:#1d1c1a;border:1px solid #4a3a2a;border-top:3px solid #f0913a;border-radius:8px;padding:10px 12px}
.pill{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:999px;border:1px solid}
.toggle{width:44px;height:24px;border-radius:999px;border:0;position:relative;flex:none}
.knob{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#0f1a24;transition:left .15s}
.ln{display:flex;white-space:pre;font-size:12.5px;line-height:1.75}
.lnno{width:36px;color:#4b5e6c;text-align:right;padding-right:14px;flex:none;user-select:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#dbe4ea}
.chk input{accent-color:#4fc3b8;width:16px;height:16px}
.scroll::-webkit-scrollbar{width:10px;height:10px}.scroll::-webkit-scrollbar-thumb{background:#2b3d4b;border-radius:10px}
</style>

<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="width: 1360px; height: 900px; display: flex; flex-direction: column; background: #15212b; color: #e6edf3; font-family: 'Nunito Sans', system-ui, sans-serif; border: 1px solid #2d3e4c; border-radius: 14px; overflow: hidden">

  <!-- Dialog header -->
  <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #0f1a24; border-bottom: 1px solid #22323f">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span style="background: #3b82f6; color: #ffffff; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 6px 9px; border-radius: 5px">COMMAND</span>
    <span style="font-size: 17px; font-weight: 800">{{name}} — Command</span>
    <span style="flex: 1"></span>
    <button aria-label="Close" style="background: transparent; border: 0; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9d4dd" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <!-- Sidebar: the command's flow -->
    <div style="width: 250px; flex: none; background: #111c26; border-right: 1px solid #22323f; display: flex; flex-direction: column; padding: 18px 14px 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px">
        <span style="font-size: 16px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{name}}</span>
        <a href="#props" onClick="{{selInput}}" style="font-size: 12px; color: #4fc3b8; white-space: nowrap; margin-left: 8px">Show {{propCount}} properties</a>
      </div>
      <div class="kick" style="margin: 22px 6px 8px">Flow</div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
          <button class="step" onClick="{{s.pick}}" style="background: {{s.bg}}; border-color: {{s.bd}}">
            <span class="dot" style="background: {{s.dot}}"></span>
            <span>{{s.label}}</span>
            <sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: {{s.badgeBg}}; color: {{s.badgeFg}}">{{s.badge}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <div class="kick" style="margin: 22px 6px 8px">Outcomes</div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px; font-size: 12.5px; color: #a9b7c2; line-height: 1.4">
        <div style="display: flex; gap: 8px"><span class="dot" style="background: #3fb871; margin-top: 5px"></span><span>Accepted — events recorded, response given back</span></div>
        <div style="display: flex; gap: 8px"><span class="dot" style="background: #ef5a5a; margin-top: 5px"></span><span>Unauthorized or Rejected — nothing is recorded</span></div>
      </div>
      <span style="flex: 1"></span>
      <div style="border-top: 1px solid #22323f; padding: 12px 6px 0; display: flex; gap: 14px; font-size: 11.5px; color: #8b9aa7">
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #4fc3b8"></span>Visual</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #f0913a"></span>Conditional</span>
        <span style="display: flex; align-items: center; gap: 5px"><span class="dot" style="background: #a78bfa"></span>C#</span>
      </div>
    </div>

    <!-- Main -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      <!-- Command details -->
      <div style="padding: 16px 22px 14px; flex: none">
        <div style="font-size: 12.5px; color: #8b9aa7">Invoicing › Registration › command</div>
        <input value="{{name}}" onChange="{{setName}}" aria-label="Command name" style="margin: 6px 0 10px; background: transparent; border: 0; color: #e6edf3; font: 800 26px 'Nunito Sans', system-ui, sans-serif; padding: 0; width: 100%; outline: none">
        <textarea value="{{desc}}" onChange="{{setDesc}}" aria-label="Description" placeholder="What does this command do, in domain words?" rows="2" style="width: 100%; resize: vertical; background: #0f1a24; border: 1px solid #2b3d4b; border-radius: 6px; color: #e6edf3; font: 14px 'Nunito Sans', system-ui, sans-serif; padding: 10px 12px; outline: none"></textarea>
        <div style="display: flex; align-items: flex-end; gap: 28px; margin-top: 12px">
          <div>
            <div class="kick" style="margin-bottom: 6px">Does its work by</div>
            <div class="seg">
              <button onClick="{{modeProduces}}" style="background: {{segP.bg}}; color: {{segP.fg}}">Producing events</button>
              <button onClick="{{modeHandler}}" style="background: {{segH.bg}}; color: {{segH.fg}}">A C# handler</button>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 6px">
            <button class="toggle" onClick="{{toggleConc}}" aria-label="Concurrency guard" style="background: {{conc.bg}}"><span class="knob" style="left: {{conc.left}}"></span></button>
            <span style="font-size: 14px">Concurrency guard</span>
            <span style="font-size: 12px; color: #8b9aa7">Two racing commands on the same invoice — only one wins</span>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 0 14px; background: #131f29; border-top: 1px solid #22323f; border-bottom: 1px solid #22323f">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button class="tab" onClick="{{t.pick}}" style="color: {{t.fg}}; border-bottom-color: {{t.bd}}">{{t.label}}</button>
        </sc-for>
        <span style="flex: 1"></span>
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{toggleTry}}" style="display: flex; align-items: center; gap: 7px; background: {{tryBtn.bg}}; color: {{tryBtn.fg}}; border: 1px solid {{tryBtn.bd}}; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 700; margin-right: 8px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>{{tryBtn.label}}
          </button>
        </sc-if>
        <button onClick="{{toggleCsharp}}" style="background: transparent; color: #8fb4ff; border: 1px dashed #4a63a8; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 700">{{csharpLabel}}</button>
      </div>

      <!-- Tab body -->
      <div style="flex: 1; min-height: 0; display: flex">

        <!-- DESIGN -->
        <sc-if value="{{isDesign}}" hint-placeholder-val="{{ true }}">
          <div class="scroll" style="flex: 1; min-width: 0; overflow: auto; background: #131e28; background-image: radial-gradient(#1f2e3a 1px, transparent 1px); background-size: 18px 18px">
            <div style="width: max-content; min-width: 100%; padding: 22px 24px 30px">

              <!-- Input -->
              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selInput}}" style="border-color: {{nInput.bc}}; box-shadow: {{nInput.sh}}; opacity: {{nInput.op}}">
                  <div class="ntag" style="color: #6ea8ff">When someone sends</div>
                  <div style="font-size: 15px; font-weight: 800; margin: 3px 0 6px">{{name}}</div>
                  <sc-for list="{{propLines}}" as="p" hint-placeholder-count="6">
                    <div class="nline" style="display: flex; justify-content: space-between; gap: 10px"><span class="mono" style="font-size: 12px">{{p.name}}</span><span style="color: #8b9aa7; font-size: 11.5px">{{p.meta}}</span></div>
                  </sc-for>
                </button>
                <div></div>
              </div>
              <div class="vl arrow"></div>

              <!-- Authorize -->
              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selAuth}}" style="border-color: {{nAuth.bc}}; box-shadow: {{nAuth.sh}}; opacity: {{nAuth.op}}">
                  <div class="ntag" style="color: #4fc3b8">Only if the caller</div>
                  <div class="nline mono" style="margin-top: 4px; font-size: 12.5px; color: #e6edf3; white-space: normal">{{authText}}</div>
                </button>
                <div style="display: flex; align-items: center; padding-left: 0">
                  <div class="dash" style="max-width: 36px; border-color: {{exitAuth.line}}"></div>
                  <span class="exit" style="background: {{exitAuth.bg}}; border-color: {{exitAuth.bd}}; color: {{exitAuth.fg}}">Unauthorized</span>
                </div>
              </div>
              <div class="vl arrow"></div>

              <!-- Validate -->
              <div class="row3">
                <div style="display: flex; align-items: center; justify-content: flex-end">
                  <div style="display: flex; flex-direction: column; gap: 8px; width: 180px">
                    <sc-for list="{{readNodes}}" as="r" hint-placeholder-count="1">
                      <button class="node" onClick="{{selReads}}" style="padding: 9px 12px; background: #16261c; border-color: {{r.bc}}; border-top: 3px solid #8ab421; box-shadow: {{r.sh}}; opacity: {{r.op}}">
                        <div class="ntag" style="color: #a9cf45">Reads</div>
                        <div style="font-size: 13px; font-weight: 700; margin-top: 2px">{{r.title}}</div>
                        <div class="nline" style="font-size: 11.5px; color: #8b9aa7">{{r.sub}}</div>
                      </button>
                    </sc-for>
                    <sc-if value="{{noReads}}" hint-placeholder-val="{{ false }}">
                      <button class="node" onClick="{{selReads}}" style="padding: 10px 12px; background: transparent; border-style: dashed; color: #8b9aa7; font-size: 12.5px">+ Reads state…</button>
                    </sc-if>
                  </div>
                  <div class="dash" style="max-width: 28px"></div>
                </div>
                <button class="node" onClick="{{selValidate}}" style="border-color: {{nVal.bc}}; box-shadow: {{nVal.sh}}; opacity: {{nVal.op}}">
                  <div class="ntag" style="color: #4fc3b8">Check that</div>
                  <div style="display: flex; flex-direction: column; gap: 3px; margin-top: 5px">
                    <sc-for list="{{valLines}}" as="v" hint-placeholder-count="5">
                      <div style="display: flex; gap: 8px; align-items: baseline">
                        <span style="width: 12px; flex: none; font-size: 11px; font-weight: 800; color: {{v.mc}}">{{v.mark}}</span>
                        <span class="mono" style="font-size: 11.5px; color: {{v.fg}}; line-height: 1.5">{{v.text}}</span>
                      </div>
                    </sc-for>
                    <sc-if value="{{noVal}}" hint-placeholder-val="{{ false }}"><span class="nline" style="color: #8b9aa7">No checks. Every request passes.</span></sc-if>
                  </div>
                </button>
                <div style="display: flex; align-items: center">
                  <div class="dash" style="max-width: 36px; border-color: {{exitVal.line}}"></div>
                  <span class="exit" style="background: {{exitVal.bg}}; border-color: {{exitVal.bd}}; color: {{exitVal.fg}}">Rejected</span>
                </div>
              </div>

              <!-- Generate -->
              <sc-if value="{{hasGen}}" hint-placeholder-val="{{ true }}">
                <div class="vl arrow"></div>
                <div class="row3">
                  <div></div>
                  <button class="node" onClick="{{selGenerate}}" style="padding: 10px 14px; border-color: {{nGen.bc}}; box-shadow: {{nGen.sh}}; opacity: {{nGen.op}}">
                    <div class="ntag" style="color: #4fc3b8">Then generates</div>
                    <div class="nline mono" style="font-size: 12px; margin-top: 3px">{{genText}}</div>
                  </button>
                  <div></div>
                </div>
              </sc-if>
              <div class="vl arrow"></div>

              <!-- Produces -->
              <sc-if value="{{isProduces}}" hint-placeholder-val="{{ true }}">
                <div class="row3">
                  <div></div>
                  <div style="display: flex; justify-content: center"><span class="pill" style="border-color: #4a3a2a; color: #f0a060; background: #1d1c1a">Records · {{branchCount}}</span></div>
                  <div style="display: flex; gap: 6px; padding-left: 14px">
                    <button onClick="{{addAlways}}" style="background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #8cc0ff">+ Always</button>
                    <button onClick="{{addWhen}}" style="background: #172633; border: 1px solid #2b3d4b; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #f0a060">+ When…</button>
                  </div>
                </div>
                <sc-if value="{{hasBranches}}" hint-placeholder-val="{{ true }}">
                  <div class="vl"></div>
                  <div style="display: flex; justify-content: center; align-items: stretch">
                    <sc-for list="{{branchCols}}" as="b" hint-placeholder-count="3">
                      <div class="bcol" style="opacity: {{b.op}}">
                        <div class="hbar" style="top: 0; left: {{b.barL}}; right: {{b.barR}}; opacity: {{b.barOp}}"></div>
                        <div class="vl arrow" style="height: 18px"></div>
                        <button class="bnode" onClick="{{b.pick}}" aria-label="Edit production">
                          <span class="when" style="border-color: {{b.chipBd}}; background: {{b.chipBg}}; box-shadow: {{b.sh}}">
                            <span class="diamond" style="background: {{b.dia}}"></span>
                            <span style="font-weight: 800; font-size: 10.5px; letter-spacing: .08em; color: {{b.dia}}">{{b.kw}}</span>
                            <span class="mono" style="font-size: 11.5px; color: #dbe4ea; text-align: left">{{b.cond}}</span>
                          </span>
                          <span class="vl arrow" style="height: 16px; display: block"></span>
                          <span class="evt" style="border-color: {{b.evBd}}; border-top-color: #f0913a; box-shadow: {{b.sh}}; display: block">
                            <span class="ntag" style="color: #f0a060; display: block">Event</span>
                            <span style="display: block; font-size: 14px; font-weight: 800; margin: 2px 0 4px; color: #f6e7d8; overflow-wrap: anywhere">{{b.event}}</span>
                            <span class="mono" style="display: block; font-size: 11px; color: #8b9aa7">{{b.forText}}</span>
                            <sc-for list="{{b.mapLines}}" as="m" hint-placeholder-count="2">
                              <span class="mono" style="display: block; font-size: 11px; color: #c9d4dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m}}</span>
                            </sc-for>
                          </span>
                        </button>
                        <div style="flex: 1; min-height: 18px; width: 2px; background: #33495a"></div>
                        <div class="hbar" style="bottom: 0; left: {{b.barL}}; right: {{b.barR}}; opacity: {{b.barOp}}"></div>
                      </div>
                    </sc-for>
                  </div>
                  <div class="vl arrow"></div>
                </sc-if>
                <sc-if value="{{noBranches}}" hint-placeholder-val="{{ false }}">
                  <div class="vl"></div>
                  <div class="row3"><div></div><div style="border: 1px dashed #3a4b58; border-radius: 10px; padding: 14px; font-size: 13px; color: #8b9aa7; text-align: center">Nothing is recorded. Add an event that always happens, or one that happens when a condition holds.</div><div></div></div>
                  <div class="vl arrow"></div>
                </sc-if>
              </sc-if>

              <!-- Handler -->
              <sc-if value="{{isHandler}}" hint-placeholder-val="{{ false }}">
                <div class="row3">
                  <div></div>
                  <button class="node" onClick="{{selHandler}}" style="border-color: {{nHandler.bc}}; border-top: 3px solid #a78bfa; box-shadow: {{nHandler.sh}}; opacity: {{nHandler.op}}">
                    <div class="ntag" style="color: #c4b5fd">Handler · C#</div>
                    <div class="nline mono" style="font-size: 12px; margin-top: 4px">{{handlerText}}</div>
                    <div class="nline" style="font-size: 11.5px; color: #8b9aa7; margin-top: 4px">Returns the events to append. Replaces the produces flow.</div>
                  </button>
                  <div></div>
                </div>
                <div class="vl arrow"></div>
              </sc-if>

              <!-- Returns -->
              <div class="row3">
                <div></div>
                <button class="node" onClick="{{selReturns}}" style="padding: 10px 14px; border-color: {{nRet.bc}}; box-shadow: {{nRet.sh}}; opacity: {{nRet.op}}">
                  <div class="ntag" style="color: #4fc3b8">Gives back</div>
                  <div class="nline mono" style="font-size: 12px; margin-top: 3px">{{retText}}</div>
                </button>
                <div></div>
              </div>
              <div class="vl arrow"></div>
              <div style="display: flex; justify-content: center"><span class="pill" style="background: {{endPill.bg}}; border-color: {{endPill.bd}}; color: {{endPill.fg}}">Accepted</span></div>
            </div>
          </div>

          <!-- Inspector -->
          <div class="scroll" style="width: 350px; flex: none; border-left: 1px solid #22323f; background: #111c26; overflow-y: auto; padding: 18px 18px 24px">

            <!-- Try it -->
            <sc-if value="{{trying}}" hint-placeholder-val="{{ false }}">
              <div class="kick" style="color: #4fc3b8">Try it</div>
              <h3 style="margin: 4px 0 0; font-size: 17px">Send a sample {{name}}</h3>
              <p class="help">Change the values and watch the path through the flow. This runs the declarative model only; C# and named rules are skipped.</p>
              <div style="border: 1px solid {{outcome.bd}}; background: {{outcome.bg}}; border-radius: 10px; padding: 12px; margin: 14px 0 16px">
                <div style="font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: {{outcome.fg}}">{{outcome.title}}</div>
                <sc-for list="{{outcome.lines}}" as="l" hint-placeholder-count="1">
                  <div style="font-size: 12.5px; color: #dbe4ea; margin-top: 6px; display: flex; gap: 6px"><span style="color: {{l.c}}; font-weight: 800; font-size: 10.5px; text-transform: uppercase; padding-top: 2px; width: 54px; flex: none">{{l.sev}}</span><span>{{l.msg}}</span></div>
                </sc-for>
                <sc-for list="{{outcome.events}}" as="e" hint-placeholder-count="1">
                  <div style="margin-top: 10px; border-left: 3px solid #f0913a; padding-left: 9px">
                    <div style="font-size: 13px; font-weight: 800; color: #f6e7d8">{{e.name}}</div>
                    <div class="mono" style="font-size: 11px; color: #8b9aa7">{{e.dest}}</div>
                    <sc-for list="{{e.payload}}" as="kv" hint-placeholder-count="2"><div class="mono" style="font-size: 11px; color: #c9d4dd">{{kv}}</div></sc-for>
                  </div>
                </sc-for>
                <sc-if value="{{outcome.hasResp}}" hint-placeholder-val="{{ false }}"><div class="mono" style="margin-top: 10px; font-size: 11.5px; color: #9fe3b8">↩ {{outcome.resp}}</div></sc-if>
              </div>
              <div class="kick" style="margin-bottom: 8px">Request</div>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{sampleRows}}" as="s" hint-placeholder-count="6">
                  <div style="display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px">
                    <label class="mono" style="font-size: 11.5px; color: #a9b7c2" for="{{s.id}}">{{s.name}}</label>
                    <sc-if value="{{s.isBool}}" hint-placeholder-val="{{ false }}"><label class="chk"><input id="{{s.id}}" type="checkbox" checked="{{s.checked}}" onChange="{{s.toggle}}">{{s.checkedText}}</label></sc-if>
                    <sc-if value="{{s.isText}}" hint-placeholder-val="{{ true }}"><input id="{{s.id}}" class="f mono" value="{{s.val}}" onChange="{{s.set}}" style="font-size: 12px"></sc-if>
                  </div>
                </sc-for>
              </div>
              <div class="kick" style="margin: 18px 0 8px">The caller satisfies</div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{callerRows}}" as="c" hint-placeholder-count="3">
                  <label class="chk"><input type="checkbox" checked="{{c.checked}}" onChange="{{c.toggle}}"><span class="mono" style="font-size: 12px">{{c.name}}</span></label>
                </sc-for>
              </div>
              <sc-if value="{{hasReadRows}}" hint-placeholder-val="{{ true }}">
                <div class="kick" style="margin: 18px 0 8px">State it reads</div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{readRows}}" as="s" hint-placeholder-count="2">
                    <div style="display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 8px">
                      <label class="mono" style="font-size: 11.5px; color: #a9cf45" for="{{s.id}}">{{s.name}}</label>
                      <sc-if value="{{s.isBool}}" hint-placeholder-val="{{ false }}"><label class="chk"><input id="{{s.id}}" type="checkbox" checked="{{s.checked}}" onChange="{{s.toggle}}">{{s.checkedText}}</label></sc-if>
                      <sc-if value="{{s.isText}}" hint-placeholder-val="{{ true }}"><input id="{{s.id}}" class="f mono" value="{{s.val}}" onChange="{{s.set}}" style="font-size: 12px"></sc-if>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </sc-if>

            <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">

              <!-- Input inspector -->
              <sc-if value="{{ins.input}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Input</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">What the sender provides</h3>
                <p class="help">One property names the thing that changes — its identifier. Generated values are made by the command itself, after the checks, and are never asked for.</p>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px">
                  <sc-for list="{{propRows}}" as="p" hint-placeholder-count="5">
                    <div class="card">
                      <div style="display: flex; gap: 6px">
                        <input class="f mono" value="{{p.name}}" onChange="{{p.setName}}" aria-label="Property name" style="flex: 1; font-size: 12px">
                        <select class="f" value="{{p.type}}" onChange="{{p.setType}}" aria-label="Type" style="width: 122px">
                          <option data-for="typeList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <button class="x" onClick="{{p.remove}}" aria-label="Remove property"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                      <div style="display: flex; gap: 6px">
                        <button class="flag" onClick="{{p.tOpt}}" style="background: {{p.fo.bg}}; border-color: {{p.fo.bd}}; color: {{p.fo.fg}}">optional</button>
                        <button class="flag" onClick="{{p.tGen}}" style="background: {{p.fg.bg}}; border-color: {{p.fg.bd}}; color: {{p.fg.fg}}">generated</button>
                        <button class="flag" onClick="{{p.tId}}" style="background: {{p.fi.bg}}; border-color: {{p.fi.bd}}; color: {{p.fi.fg}}">identifier</button>
                      </div>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addProp}}">+ Add property</button>
              </sc-if>

              <!-- Reads inspector -->
              <sc-if value="{{ins.reads}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #a9cf45">Reads</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">State the command decides against</h3>
                <p class="help">A read model some projection builds. Its fields can be used in requirements and mapped into events. Read the same view twice? Give each an alias.</p>
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px">
                  <sc-for list="{{readRowsEdit}}" as="r" hint-placeholder-count="1">
                    <div class="card">
                      <div style="display: flex; gap: 6px; align-items: center">
                        <select class="f" value="{{r.model}}" onChange="{{r.setModel}}" aria-label="Read model" style="flex: 1">
                          <option data-for="readModelList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <button class="x" onClick="{{r.remove}}" aria-label="Remove read"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                      <div style="display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; font-size: 12px; color: #8b9aa7">
                        <span>by</span>
                        <select class="f mono" value="{{r.by}}" onChange="{{r.setBy}}" aria-label="Looked up by" style="font-size: 12px">
                          <option data-for="r.byOptions" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <span>as</span>
                        <input class="f mono" value="{{r.alias}}" onChange="{{r.setAlias}}" placeholder="alias (optional)" aria-label="Alias" style="font-size: 12px">
                      </div>
                      <div style="font-size: 11.5px; color: #8b9aa7">Fields: <span class="mono" style="color: #a9cf45">{{r.fields}}</span></div>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addRead}}">+ Read another view</button>
              </sc-if>

              <!-- Authorize inspector -->
              <sc-if value="{{ins.auth}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Authorize</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Who may send it</h3>
                <p class="help">Policies are checked before anything else. "and" binds tighter than "or". A caller who fails is turned away as Unauthorized — no events.</p>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
                  <sc-for list="{{authRows}}" as="a" hint-placeholder-count="1">
                    <div style="display: flex; gap: 6px">
                      <sc-if value="{{a.showJoin}}" hint-placeholder-val="{{ false }}">
                        <select class="f" value="{{a.join}}" onChange="{{a.setJoin}}" aria-label="Join" style="width: 62px"><option value="and">and</option><option value="or">or</option></select>
                      </sc-if>
                      <sc-if value="{{a.first}}" hint-placeholder-val="{{ true }}"><span style="width: 62px; font-size: 12px; color: #8b9aa7; display: flex; align-items: center">must be</span></sc-if>
                      <select class="f mono" value="{{a.policy}}" onChange="{{a.setPolicy}}" aria-label="Policy" style="flex: 1; font-size: 12px">
                        <option data-for="policyList" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{a.remove}}" aria-label="Remove policy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                  </sc-for>
                  <sc-if value="{{noAuth}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; color: #8b9aa7; border: 1px dashed #3a4b58; border-radius: 8px; padding: 10px">Anyone may send it. Module and feature gates still apply.</div></sc-if>
                </div>
                <button class="add" onClick="{{addPolicy}}">+ Require a policy</button>
              </sc-if>

              <!-- Validate inspector -->
              <sc-if value="{{ins.validate}}" hint-placeholder-val="{{ true }}">
                <div class="kick">Validate</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">What must hold</h3>
                <p class="help">Every failed check rejects the command, even at warning or information severity — severity only shapes how the message is shown.</p>
                <div class="kick" style="margin: 16px 0 8px">Property rules</div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{ruleRows}}" as="r" hint-placeholder-count="3">
                    <div class="card">
                      <div style="display: flex; gap: 6px">
                        <select class="f mono" value="{{r.prop}}" onChange="{{r.setProp}}" aria-label="Property" style="flex: 1; font-size: 12px">
                          <option data-for="propNames" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <select class="f" value="{{r.op}}" onChange="{{r.setOp}}" aria-label="Rule" style="width: 112px">
                          <option data-for="r.ops" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <button class="x" onClick="{{r.remove}}" aria-label="Remove rule"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                      <sc-if value="{{r.needsValue}}" hint-placeholder-val="{{ true }}">
                        <input class="f mono" value="{{r.value}}" onChange="{{r.setValue}}" placeholder="{{r.ph}}" aria-label="Value" style="font-size: 12px">
                      </sc-if>
                      <div style="display: flex; gap: 6px">
                        <select class="f" value="{{r.severity}}" onChange="{{r.setSev}}" aria-label="Severity" style="width: 112px">
                          <option data-for="sevList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f" value="{{r.message}}" onChange="{{r.setMsg}}" placeholder="Message shown when it fails" aria-label="Message" style="flex: 1">
                      </div>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addRule}}">+ Add rule</button>

                <div class="kick" style="margin: 14px 0 4px">Requirements</div>
                <p class="help" style="margin: 0 0 8px">A rule about the command as a whole — often about state it reads. Use "or" for a rule that only applies sometimes.</p>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{reqRows}}" as="q" hint-placeholder-count="1">
                    <div class="card">
                      <div style="display: flex; justify-content: space-between; align-items: center"><span class="ntag" style="color: #4fc3b8">require</span><button class="x" onClick="{{q.remove}}" aria-label="Remove requirement"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
                      <sc-for list="{{q.conds}}" as="c" hint-placeholder-count="1">
                        <div style="display: flex; gap: 5px">
                          <sc-if value="{{c.showJoin}}" hint-placeholder-val="{{ false }}"><select class="f" value="{{c.join}}" onChange="{{c.setJoin}}" aria-label="Join" style="width: 52px; padding: 0 4px"><option value="and">and</option><option value="or">or</option></select></sc-if>
                          <select class="f mono" value="{{c.left}}" onChange="{{c.setLeft}}" aria-label="Operand" style="flex: 1; font-size: 11.5px">
                            <option data-for="reqOperands" data-as="o" value="{{o}}">{{o}}</option>
                          </select>
                          <select class="f" value="{{c.op}}" onChange="{{c.setOp}}" aria-label="Comparison" style="width: 50px; padding: 0 4px">
                            <option data-for="c.ops" data-as="o" value="{{o}}">{{o}}</option>
                          </select>
                          <input class="f mono" value="{{c.right}}" onChange="{{c.setRight}}" aria-label="Value" style="width: 64px; font-size: 11.5px">
                          <button class="x" onClick="{{c.remove}}" aria-label="Remove condition" style="width: 22px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                        </div>
                      </sc-for>
                      <button class="add" onClick="{{q.addCond}}" style="padding: 2px 0; font-size: 12px">+ and / or…</button>
                      <div style="display: flex; gap: 6px">
                        <select class="f" value="{{q.severity}}" onChange="{{q.setSev}}" aria-label="Severity" style="width: 112px">
                          <option data-for="sevList" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f" value="{{q.message}}" onChange="{{q.setMsg}}" placeholder="Message" aria-label="Message" style="flex: 1">
                      </div>
                    </div>
                  </sc-for>
                </div>
                <button class="add" onClick="{{addReq}}">+ Add requirement</button>
                <sc-if value="{{csharp}}" hint-placeholder-val="{{ false }}">
                  <div class="kick" style="margin: 14px 0 8px; color: #c4b5fd">C# check</div>
                  <textarea class="mono" value="{{csharpCode}}" onChange="{{setCsharpCode}}" aria-label="C# validation" rows="6" style="width: 100%; background: #0f1a24; border: 1px solid #3d3566; border-radius: 6px; color: #ddd6fe; font-size: 11.5px; padding: 10px; resize: vertical"></textarea>
                  <p class="help">Yields the message of every rule the command breaks. Can see the whole command and who sent it.</p>
                </sc-if>
              </sc-if>

              <!-- Generate inspector -->
              <sc-if value="{{ins.generate}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Generate</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Values the command makes</h3>
                <p class="help">Generated after authorization and validation, so rules and policies can't refer to them. They can be mapped into events and given back.</p>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
                  <sc-for list="{{genRows}}" as="g" hint-placeholder-count="1">
                    <div class="card" style="flex-direction: row; justify-content: space-between; align-items: center"><span class="mono" style="font-size: 12.5px">{{g.name}}</span><span style="font-size: 12px; color: #8b9aa7">{{g.type}}</span></div>
                  </sc-for>
                </div>
                <p class="help" style="margin-top: 10px">Mark a property as generated in <a href="#input" onClick="{{selInput}}">Input</a>.</p>
              </sc-if>

              <!-- Branch inspector -->
              <sc-if value="{{ins.branch}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #f0a060">Produces</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">{{br.event}}</h3>
                <div class="kick" style="margin: 16px 0 6px">Happens</div>
                <div class="seg" style="width: max-content">
                  <button onClick="{{br.setAlways}}" style="background: {{br.segA.bg}}; color: {{br.segA.fg}}">Always</button>
                  <button onClick="{{br.setWhen}}" style="background: {{br.segW.bg}}; color: {{br.segW.fg}}">When…</button>
                </div>
                <sc-if value="{{br.isWhen}}" hint-placeholder-val="{{ true }}">
                  <p class="help" style="margin: 8px 0">Compares command properties with constants. Each "when" is checked on its own — several can fire.</p>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <sc-for list="{{br.conds}}" as="c" hint-placeholder-count="1">
                      <div style="display: flex; gap: 5px">
                        <sc-if value="{{c.showJoin}}" hint-placeholder-val="{{ false }}"><select class="f" value="{{c.join}}" onChange="{{c.setJoin}}" aria-label="Join" style="width: 52px; padding: 0 4px"><option value="and">and</option><option value="or">or</option></select></sc-if>
                        <select class="f mono" value="{{c.left}}" onChange="{{c.setLeft}}" aria-label="Property" style="flex: 1; font-size: 11.5px">
                          <option data-for="condOperands" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <select class="f" value="{{c.op}}" onChange="{{c.setOp}}" aria-label="Comparison" style="width: 50px; padding: 0 4px">
                          <option data-for="c.ops" data-as="o" value="{{o}}">{{o}}</option>
                        </select>
                        <input class="f mono" value="{{c.right}}" onChange="{{c.setRight}}" aria-label="Value" style="width: 70px; font-size: 11.5px">
                        <button class="x" onClick="{{c.remove}}" aria-label="Remove condition" style="width: 22px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                      </div>
                    </sc-for>
                    <button class="add" onClick="{{br.addCond}}" style="padding: 2px 0; font-size: 12px">+ and / or…</button>
                  </div>
                </sc-if>
                <div class="kick" style="margin: 14px 0 6px">Event</div>
                <input class="f" value="{{br.event}}" onChange="{{br.setEvent}}" aria-label="Event name" style="width: 100%; font-weight: 700">
                <div class="kick" style="margin: 14px 0 6px">Lands on</div>
                <select class="f mono" value="{{br.landsOn}}" onChange="{{br.setLands}}" aria-label="Event source" style="width: 100%; font-size: 12px">
                  <option data-for="br.landOptions" data-as="o" value="{{o}}">{{o}}</option>
                </select>
                <p class="help">The event source is never part of the payload.</p>
                <div class="kick" style="margin: 14px 0 6px">Payload</div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{br.maps}}" as="m" hint-placeholder-count="3">
                    <div style="display: flex; gap: 5px; align-items: center">
                      <input class="f mono" value="{{m.field}}" onChange="{{m.setField}}" aria-label="Event property" style="width: 110px; font-size: 11.5px">
                      <span style="color: #8b9aa7">=</span>
                      <select class="f mono" value="{{m.sel}}" onChange="{{m.setSource}}" aria-label="Source" style="flex: 1; font-size: 11.5px">
                        <option data-for="mapSources" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{m.remove}}" aria-label="Remove mapping" style="width: 22px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                    <sc-if value="{{m.isConst}}" hint-placeholder-val="{{ false }}"><input class="f mono" value="{{m.source}}" onChange="{{m.setConst}}" aria-label="Constant value" style="margin-left: 126px; font-size: 11.5px"></sc-if>
                  </sc-for>
                </div>
                <div style="display: flex; justify-content: space-between">
                  <button class="add" onClick="{{br.addMap}}">+ Map a property</button>
                  <button class="add" onClick="{{br.remove}}" style="color: #ef7a7a">Remove production</button>
                </div>
              </sc-if>

              <!-- Handler inspector -->
              <sc-if value="{{ins.handler}}" hint-placeholder-val="{{ false }}">
                <div class="kick" style="color: #c4b5fd">Handler</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">Imperative implementation</h3>
                <p class="help">For logic the produces flow can't express — batches, loops, fan-out to other event sources. A command uses either produces or a handler, never both.</p>
                <div class="seg" style="width: max-content; margin: 14px 0 10px">
                  <button onClick="{{hFile}}" style="background: {{segHF.bg}}; color: {{segHF.fg}}">File</button>
                  <button onClick="{{hInline}}" style="background: {{segHI.bg}}; color: {{segHI.fg}}">Inline C#</button>
                </div>
                <sc-if value="{{handlerIsFile}}" hint-placeholder-val="{{ true }}">
                  <input class="f mono" value="{{handler.file}}" onChange="{{setHandlerFile}}" aria-label="Handler file" style="width: 100%; font-size: 12px">
                </sc-if>
                <sc-if value="{{handlerIsInline}}" hint-placeholder-val="{{ false }}">
                  <textarea class="mono" value="{{handler.code}}" onChange="{{setHandlerCode}}" aria-label="Inline handler" rows="9" style="width: 100%; background: #0f1a24; border: 1px solid #3d3566; border-radius: 6px; color: #ddd6fe; font-size: 11.5px; padding: 10px; resize: vertical"></textarea>
                </sc-if>
                <p class="help" style="margin-top: 8px"><span class="mono">context</span> is the CommandContext: the command, tenant, caller, causation and when it was received.</p>
              </sc-if>

              <!-- Returns inspector -->
              <sc-if value="{{ins.returns}}" hint-placeholder-val="{{ false }}">
                <div class="kick">Returns</div>
                <h3 style="margin: 4px 0 0; font-size: 17px">What the sender gets back</h3>
                <p class="help">Only on acceptance. One field gives back a single value; more make a record. Each comes straight from a command property.</p>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
                  <sc-for list="{{retRows}}" as="m" hint-placeholder-count="1">
                    <div style="display: flex; gap: 5px; align-items: center">
                      <input class="f mono" value="{{m.field}}" onChange="{{m.setField}}" aria-label="Response field" style="width: 120px; font-size: 11.5px">
                      <span style="color: #8b9aa7">=</span>
                      <select class="f mono" value="{{m.source}}" onChange="{{m.setSource}}" aria-label="Source" style="flex: 1; font-size: 11.5px">
                        <option data-for="propNames" data-as="o" value="{{o}}">{{o}}</option>
                      </select>
                      <button class="x" onClick="{{m.remove}}" aria-label="Remove field" style="width: 22px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                    </div>
                  </sc-for>
                  <sc-if value="{{noRet}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; color: #8b9aa7; border: 1px dashed #3a4b58; border-radius: 8px; padding: 10px">Gives nothing back.</div></sc-if>
                </div>
                <button class="add" onClick="{{addRet}}">+ Give back a value</button>
              </sc-if>
            </sc-if>
          </div>
        </sc-if>

        <!-- DESCRIBE -->
        <sc-if value="{{isDescribe}}" hint-placeholder-val="{{ false }}">
          <div class="scroll" style="flex: 1; overflow: auto; padding: 26px 34px">
            <div style="max-width: 720px; display: flex; flex-direction: column; gap: 14px">
              <div class="kick">In domain words · written from the design</div>
