<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio · Workflows and state machines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@400&display=swap">
<style>
/* Prototype for Cratis/StudioIssues #1274 (workflows) and #1275 (state machines).
   Layout: Studio's canvas chrome - project drawer, full-bleed domain canvas with cards, tool rail, zoom bar, chat bar.
   Clicking a card flies its editor out of the card (the same fly-out every Studio artifact editor uses). */
:root {
  --ground: #111827; --card: #1f2937; --line: #374151; --line-2: #4b5563;
  --text: #f3f4f6; --muted: #9ca3af; --faint: #6b7280;
  --primary: #60a5fa; --primary-soft: rgba(96,165,250,.16);
  --dot: rgba(148,163,184,.14);
  --ce-ground: #15212b; --ce-canvas: #131e28; --ce-panel: #111c26; --ce-node: #172633; --ce-field: #0f1a24;
  --ce-line: #2b3d4b; --ce-rule: #22323f; --ce-ink: #e6edf3; --ce-soft: #dbe4ea; --ce-muted: #8b9aa7;
  --ce-flow: #4fc3b8; --ce-command: #3fa9f5; --ce-event: #f0913a; --ce-state: #c6e03a; --ce-code: #a78bfa;
  --ce-bad: #ef5a5a; --ce-warn: #e8b64f; --ce-ok: #62d08b;
  --sm-bg: #f49ab8; --sm-ink: #3a0d1c; --sm-border: #c96a86; --sm-badge: #c4517a;
  --wf-bg: #7fdcb6; --wf-ink: #06301f; --wf-border: #4cae86; --wf-badge: #2f9a6e;
  --f-ui: "Inter", Avenir, Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font: 13px/1.45 var(--f-ui); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--f-mono); }

/* ---------- application shell ---------- */
#app { display: grid; grid-template-columns: 270px 1fr; height: 100%; }
#app.drawer-closed { grid-template-columns: 0 1fr; }
#drawer { background: #0d1320; border-right: 1px solid var(--line); overflow: hidden auto; }
#app.drawer-closed #drawer { border: 0; }
.dr-head { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.dr-head .grow { flex: 1; }
.dr-head button { border: 0; background: none; color: var(--muted); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; }
.tree { list-style: none; margin: 0; padding: 8px 6px; }
.tree li { list-style: none; }
.tn { display: flex; align-items: center; gap: 8px; height: 32px; padding-right: 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; user-select: none; white-space: nowrap; }
.tn:hover { background: rgba(255,255,255,.04); }
.tn.on { background: #1a2740; }
.tn .chev { width: 14px; color: var(--faint); display: grid; place-items: center; }
.tn .chev svg { width: 13px; height: 13px; }
.tn .ic svg { width: 15px; height: 15px; }
.tn .badge-new { margin-left: auto; font-size: 10.5px; font-weight: 600; color: #93c5fd; background: rgba(96,165,250,.16); padding: 1px 7px; border-radius: 5px; }
.tn .count { margin-left: auto; font-size: 11px; color: var(--faint); }

#board { position: relative; overflow: hidden; }
#canvas { position: absolute; inset: 0; cursor: default; background-color: var(--ground); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); }
#canvas.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

.float { position: absolute; z-index: 5; background: rgba(17,24,39,.78); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#pill { left: 16px; top: 14px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 6px; }
#pill .av { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #0b1220; display: grid; place-items: center; }
#pill .av svg { width: 19px; height: 19px; }
#pill .t1 { font-weight: 600; font-size: 14px; }
#pill .t2 { font-size: 12px; color: var(--muted); }
#pill .menu { border: 0; background: none; color: var(--muted); margin-left: 6px; }
#topbar { right: 16px; top: 14px; border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 6px; }
#topbar button { width: 38px; height: 38px; border: 0; background: none; color: #d1d5db; border-radius: 50%; display: grid; place-items: center; }
#topbar button:hover { background: rgba(255,255,255,.06); }
#topbar .me { background: #374151; font-weight: 700; font-size: 12px; margin-left: 6px; }
#rail { left: 16px; top: 50%; transform: translateY(-50%); border-radius: 999px; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
#rail button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: #d1d5db; display: grid; place-items: center; position: relative; }
#rail button:hover { background: rgba(255,255,255,.07); }
#rail button.on { background: var(--primary); color: #0b1220; }
#rail .sep { height: 1px; background: rgba(255,255,255,.1); margin: 2px 6px; }
#rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 52px; top: 50%; transform: translateY(-50%); background: #0b1220; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; white-space: nowrap; font-size: 12px; color: var(--text); pointer-events: none; }
#zoombar { right: 16px; bottom: 16px; border-radius: 999px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
#zoombar button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; color: #d1d5db; display: grid; place-items: center; }
#zoombar button:hover { background: rgba(255,255,255,.07); }
#zoombar .pct { min-width: 46px; text-align: center; font-size: 13px; font-weight: 600; }
#zoombar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.1); margin: 0 4px; }
#chatbar { left: 50%; transform: translateX(-50%); bottom: 16px; width: min(780px, calc(100% - 420px)); border-radius: 22px; padding: 10px 10px 10px 18px; display: flex; flex-direction: column; gap: 8px; }
#chatbar .scope { align-self: flex-start; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
#chatbar .rowc { display: flex; align-items: center; gap: 10px; }
#chatbar input { flex: 1; background: none; border: 0; outline: none; font-size: 14px; color: var(--text); }
#chatbar input::placeholder { color: var(--faint); }
#chatbar .agent { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
#chatbar .send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--primary); color: #0b1220; display: grid; place-items: center; }
#hint { right: 16px; top: 78px; width: 300px; border-radius: 14px; padding: 12px 14px; font-size: 12.5px; color: var(--muted); }
#hint b { color: var(--text); }
#hint h3 { margin: 0 0 6px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
#hint h3 .grow { flex: 1; }
#hint h3 button { border: 0; background: none; color: var(--faint); padding: 0; }
#hint ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 4px; }
#hint a { color: #93c5fd; }
#hint.closed { display: none; }

.empty { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; color: var(--faint); max-width: 380px; }

/* ---------- canvas cards ---------- */
.card { position: absolute; background: var(--card); border: 1px solid var(--b); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 25%); font-family: var(--f-ui); }
.card.sm { --b: var(--sm-border); --hb: var(--sm-bg); --hi: var(--sm-ink); width: 340px; }
.card.wf { --b: var(--wf-border); --hb: var(--wf-bg); --hi: var(--wf-ink); width: 360px; }
.card.sel { outline: 2px solid var(--primary); outline-offset: 2px; }
.card-h { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; background: var(--hb); color: var(--hi); border-radius: 5px 5px 0 0; cursor: grab; }
.card-h .kind { display: grid; place-items: center; }
.card-h .kind svg { width: 14px; height: 14px; }
.card-h .nm { flex: 1; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-h button { width: 20px; height: 20px; border: 0; background: none; color: inherit; opacity: .7; display: grid; place-items: center; border-radius: 4px; padding: 0; }
.card-h button:hover { opacity: 1; background: rgba(0,0,0,.1); }
.card-h button svg { width: 12px; height: 12px; }
.card-b { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; cursor: zoom-in; }
.card-b:hover .thumb { border-color: #36506a; }
.thumb { position: relative; background: var(--ce-canvas); border: 1px solid var(--ce-rule); border-radius: 4px; height: 150px; overflow: hidden; background-image: radial-gradient(#1f2e3a 1px, transparent 1px); background-size: 12px 12px; transition: border-color .15s; }
.thumb svg { width: 100%; height: 100%; display: block; }
.thumb .open { position: absolute; right: 6px; bottom: 6px; font-size: 10.5px; color: var(--ce-muted); background: rgba(15,26,36,.85); border: 1px solid var(--ce-line); padding: 1px 7px; border-radius: 999px; opacity: 0; transition: opacity .15s; }
.card-b:hover .thumb .open { opacity: 1; }
.desc { font-size: 12px; color: #d1d5db; }
.frow { display: grid; grid-template-columns: 6.5rem 1fr; gap: 6px; align-items: baseline; font-size: 12px; }
.frow .l { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.frow .v { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 0 6px; border-radius: 4px; height: 19px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
.chip.ev { --c: var(--ce-event); background: rgba(240,145,58,.12); color: #ffc58f; }
.chip.cmd { --c: var(--ce-command); background: rgba(63,169,245,.12); color: #9fd3ff; }
.chip.rm { --c: var(--ce-state); background: rgba(198,224,58,.1); color: #dcef8a; }
.chip.sm { --c: var(--sm-bg); background: rgba(244,154,184,.12); color: #ffc4d8; }
.chip.wf { --c: var(--wf-bg); background: rgba(127,220,182,.12); color: #b3f1d6; }
.chip.more::before { display: none; }
.chip.more { background: rgba(255,255,255,.06); color: var(--muted); }
.chip.link { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,.25); text-underline-offset: 2px; }
.card-f { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 7px; margin-top: 2px; }
.card-f .ok { color: var(--ce-ok); }
.card-f .warn { color: var(--ce-warn); }
.card-f .bad { color: var(--ce-bad); }
.card-f span { display: inline-flex; gap: 4px; align-items: center; }
.card-f svg { width: 12px; height: 12px; }

.note { position: absolute; width: 190px; min-height: 120px; padding: 14px; font: 13px/1.35 "Kalam", "Comic Sans MS", cursive; color: #1f2937; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: grab; text-align: center; display: grid; place-items: center; }
.note.yellow { background: #fffe9e; } .note.pink { background: #ffb3cf; } .note.green { background: #b8f0b0; } .note.blue { background: #aedcff; }

/* ---------- the fly-out editor ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; display: none; }
#overlay.open { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .28s; }
#overlay.shown .backdrop { opacity: 1; }
.panel { position: absolute; inset: 0; margin: auto; width: min(94rem, calc(100vw - 48px)); height: min(62rem, calc(100vh - 48px)); background: var(--ce-ground); border: 1px solid #2b3d4b; border-radius: 1rem; box-shadow: 0 24px 80px rgba(0,0,0,.55); display: grid; grid-template-rows: 3.5rem 1fr; overflow: hidden; transform-origin: 0 0; color: var(--ce-ink); }
.panel.flying { transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s; }
@media (prefers-reduced-motion: reduce) { .panel.flying { transition: none; } .backdrop { transition: none; } }
.ph { display: flex; align-items: center; gap: 12px; padding: 0 1.25rem; background: #111827; border-bottom: 1px solid var(--ce-line); }
.kbadge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 4px; color: #fff; }
.kbadge.sm { background: var(--sm-badge); } .kbadge.wf { background: var(--wf-badge); }
.ph .title { font-size: 16px; font-weight: 600; }
.ph .crumbs { color: var(--ce-muted); font-size: 13px; }
.ph .grow { flex: 1; }
.ph .x { width: 30px; height: 30px; border: 0; background: none; color: var(--ce-muted); display: grid; place-items: center; border-radius: 6px; }
.ph .x:hover { background: rgba(255,255,255,.06); color: var(--ce-ink); }
.pb { display: grid; grid-template-columns: 226px minmax(0,1fr); min-height: 0; }

.side { background: var(--ce-panel); border-right: 1px solid var(--ce-line); overflow: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.side h4 { margin: 12px 4px 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ce-muted); display: flex; align-items: center; gap: 6px; }
.side h4:first-child { margin-top: 0; }
.side h4 .r { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 700; }
.side h4 .r.ok { color: var(--ce-ok); } .side h4 .r.bad { color: var(--ce-bad); }
.side h4 button { margin-left: auto; border: 0; background: none; color: var(--ce-muted); padding: 0 2px; font-size: 16px; line-height: 1; }
.sitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ce-soft); }
.sitem:hover { background: rgba(255,255,255,.03); }
.sitem.on { background: #16302f; border-color: #2f6e68; }
.sitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ce-muted)); flex: none; }
.sitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .bd { font-size: 10px; font-weight: 800; border-radius: 5px; padding: 1px 5px; background: rgba(255,255,255,.07); color: var(--ce-muted); }
.sitem .bd.fin { background: rgba(244,154,184,.16); color: #ffc4d8; }
.sitem .bd.ini { background: rgba(79,195,184,.16); color: #9be7df; }
.sitem small { display: block; color: var(--ce-muted); font-size: 11px; }
.spec { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.spec:hover { background: rgba(255,255,255,.03); }
.spec .st-ic { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.spec .st-ic.ok { background: rgba(98,208,139,.18); color: var(--ce-ok); }
.spec .st-ic.bad { background: rgba(239,90,90,.18); color: var(--ce-bad); }
.spec .st-ic svg { width: 10px; height: 10px; stroke-width: 3; }
.spec small { display: block; color: var(--ce-muted); font-size: 11px; margin-top: 2px; }
.legend { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid var(--ce-rule); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 11.5px; color: var(--ce-muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

.main { display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; grid-template-columns: minmax(0,1fr); min-width: 0; min-height: 0; }
.det { display: flex; gap: 20px; align-items: flex-start; padding: 16px 22px 12px; }
.det .l { flex: 1; min-width: 0; }
.det .name { font-size: 22px; font-weight: 800; background: none; border: 1px solid transparent; border-radius: 6px; padding: 0 4px; margin-left: -5px; width: 100%; color: var(--ce-ink); }
.det .name:hover { border-color: var(--ce-line); }
.det .name:focus { border-color: var(--ce-flow); outline: none; background: var(--ce-field); }
.det .about { margin-top: 6px; width: 100%; resize: none; background: var(--ce-field); border: 1px solid var(--ce-line); border-radius: 6px; padding: 7px 10px; color: var(--ce-soft); font-size: 13.5px; height: 38px; }
.det .about:focus { outline: none; border-color: var(--ce-flow); }
.det .r { display: flex; flex-direction: column; gap: 6px; }
.det .r .eye { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ce-muted); }
.facts { display: flex; gap: 8px; }
.fact { background: var(--ce-node); border: 1px solid var(--ce-line); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--ce-muted); min-width: 120px; }
.fact b { display: block; font-size: 13.5px; color: var(--ce-ink); font-weight: 700; }
.tabs { display: flex; align-items: flex-end; gap: 4px; padding: 0 16px; background: #131f29; border-top: 1px solid var(--ce-rule); border-bottom: 1px solid var(--ce-rule); }
.tabs .tab { border: 0; background: none; color: var(--ce-muted); font-weight: 700; font-size: 14px; padding: 12px 14px 10px; border-bottom: 2px solid transparent; }
.tabs .tab.on { color: var(--ce-ink); border-bottom-color: var(--ce-flow); }
.tabs .grow { flex: 1; }
.tabs .tb { align-self: center; margin-bottom: 0; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--ce-line); background: var(--ce-node); color: var(--ce-soft); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.tb:hover:not(:disabled) { border-color: #3d566a; }
.tb:disabled { opacity: .45; cursor: default; }
.tb.primary { background: var(--ce-flow); color: #0d1a20; border-color: transparent; }
.tb.ghost { background: none; }
.tb svg { width: 14px; height: 14px; }
.tb.sm { height: 26px; padding: 0 9px; font-size: 12px; }

.work { display: grid; grid-template-columns: minmax(0,1fr) 380px; min-height: 0; }
.work.full { grid-template-columns: 1fr; }
.gcanvas { position: relative; overflow: hidden; background: var(--ce-canvas); background-image: radial-gradient(#1f2e3a 1px, transparent 1px); cursor: default; }
.gcanvas.panning { cursor: grabbing; }
.gworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.gworld svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.gtools { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.palette { background: rgba(17,28,38,.92); border: 1px solid var(--ce-line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 3px; width: 170px; }
.palette .ph2 { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ce-muted); padding: 2px 6px 6px; }
.palette button { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; color: var(--ce-soft); padding: 5px 6px; border-radius: 7px; text-align: left; font-size: 12.5px; }
.palette button:hover { background: rgba(255,255,255,.04); border-color: var(--ce-line); }
.palette .kic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 20%, transparent); color: var(--k); }
.palette .kic svg { width: 13px; height: 13px; }
.palette small { display: block; font-size: 10.5px; color: var(--ce-muted); }
.gzoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 3; }
.gzoom button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--ce-line); background: rgba(17,28,38,.92); color: var(--ce-soft); display: grid; place-items: center; }
.gzoom svg { width: 14px; height: 14px; }
.ghelp { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11.5px; color: var(--ce-muted); background: rgba(17,28,38,.85); border: 1px solid var(--ce-rule); border-radius: 999px; padding: 3px 12px; z-index: 3; white-space: nowrap; }

/* state machine diagram */
.st { position: absolute; width: 150px; height: 56px; border-radius: 14px; background: var(--ce-node); border: 1.5px solid #3a5163; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; cursor: grab; user-select: none; transition: border-color .15s, box-shadow .2s; }
.st .n { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .s { font-size: 11px; color: var(--ce-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.fin { box-shadow: 0 0 0 3px var(--ce-canvas), 0 0 0 4.5px #6b4a57; }

.wn .ols { display: flex; height: 26px; margin-top: 2px; border-top: 1px solid var(--ce-rule); }

.port.in { left: 50%; top: -7px; margin-left: -6px; }
.wn.sel { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(96,165,250,.25); }
.wn.problem { border-color: var(--ce-warn); border-style: dashed; }
.wn.cur { border-color: var(--ce-flow); box-shadow: 0 0 0 4px rgba(79,195,184,.25), 0 0 26px rgba(79,195,184,.35); }
.wn.done { background: #16302a; border-color: #2f7a5b; }

.wn .mult { position: absolute; right: -8px; top: -9px; background: var(--ce-state); color: #1d2400; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 0 6px; height: 17px; display: grid; place-items: center; }

.ti { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; padding: 5px 0; position: relative; }
.ti::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: -6px; width: 1px; background: var(--ce-rule); }
.ti:last-child::before { display: none; }

</style>

/* =========================================================================================
   Geometry for edges
   ========================================================================================= */
function rectHit(cx, cy, w, h, tx, ty) {
  // the point where the line from the rectangle's center towards (tx,ty) leaves the rectangle
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const sx = (w / 2) / Math.abs(dx || 1e-9), sy = (h / 2) / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}
function smEdgePath(m, t, a, b) {
  const ax = a.x + 75, ay = a.y + 28, bx = b.x + 75, by = b.y + 28;
  // parallel or opposite edges between the same pair bend apart
  const pair = m.transitions.filter(o => (o.from === t.from && o.to === t.to) || (o.from === t.to && o.to === t.from));
  const idx = pair.indexOf(t);
  let bend = 0;
  if (pair.length > 1) bend = (idx - (pair.length - 1) / 2) * 46 * (t.from < t.to ? 1 : -1);
  if (pair.length > 1 && pair.some(o => o.from === t.to)) bend = (t.from < t.to ? 1 : -1) * 30 + (idx - (pair.length - 1) / 2) * 20;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const nx = -(by - ay) / len, ny = (bx - ax) / len;
  const cx = mx + nx * bend * 2, cy = my + ny * bend * 2;
  const p1 = rectHit(ax, ay, 158, 64, cx, cy), p2 = rectHit(bx, by, 166, 72, cx, cy);
  const lx = .25 * p1.x + .5 * cx + .25 * p2.x, ly = .25 * p1.y + .5 * cy + .25 * p2.y;
  return { d: `M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`, lx, ly };
}
const NW = 190, NH = 78;
const nodeH = () => NH;
const portX = (n, i) => n.x + NW * (i + .5) / outletsOf(n).length;
function wfEdgePath(a, outletIndex, b) {
  const x1 = portX(a, outletIndex), y1 = a.y + NH + 6, x2 = b.x + NW / 2, y2 = b.y - 6;
  const dy = Math.max(40, Math.abs(y2 - y1) / 2);
  return `M${x1} ${y1} C${x1} ${y1 + dy} ${x2} ${y2 - dy} ${x2} ${y2}`;
}

  ws.log.push({ cls: 'moved', text: `Run started for ${w.subject} <b>${w.subject === 'Order' ? '10482' : w.subject === 'Refund' ? 'R-2207' : 'nightly'}</b>`, w: nodeSummary(t) });
}
function choicesFor(n) {
  const c = n.cfg;
  switch (n.kind) {
    case 'trigger': return [{ label: 'Fire the trigger', outlet: 'next', auto: true }];
    case 'action': return [{ label: `${c.command} is accepted`, outlet: 'next', auto: true }, { label: 'This attempt fails', fail: true }];
    case 'decision': return c.outlets.map(o => ({ label: o, outlet: o }));
    case 'wait': return c.for === 'timer' ? [{ label: `${c.after || 'The time'} passes`, outlet: 'resumed' }] : [{ label: `${c.event} arrives`, outlet: 'resumed' }, ...(c.expires ? [{ label: `${c.expires} pass with nothing`, outlet: 'expired' }] : [])];
    case 'approval': return [{ label: 'Approve', outlet: 'approved' }, { label: 'Reject', outlet: 'rejected' }, ...(c.expires ? [{ label: `Nobody answers for ${c.expires}`, outlet: 'expired' }] : [])];
    case 'foreach': return [{ label: 'Found 3 items', outlet: 'each', auto: true, n: 3 }, { label: 'Found nothing', outlet: 'completed' }];

function take(nid, ch) {
  const w = cur(), ws = E.wsim, n = w.nodes.find(x => x.id === nid);
  if (ch.fail) {
    ws.attempts[nid] = (ws.attempts[nid] || 0) + 1;
    if (ws.attempts[nid] < n.cfg.attempts) { ws.log.push({ cls: 'failed', text: `${esc(n.name)} — attempt ${ws.attempts[nid]} of ${n.cfg.attempts} failed`, w: `Retried after ${n.cfg.delay}` }); return; }
    ws.log.push({ cls: 'failed', text: `${esc(n.name)} failed ${n.cfg.attempts} times`, w: 'Takes “failed”' });
    ch = { outlet: 'failed' };
  }
  ws.pending.shift();
  ws.state[nid] = NEG.includes(ch.outlet) ? 'failed' : ch.outlet;
  const verb = { trigger: 'fired', action: `sent ${n.cfg.command}`, decision: `chose “${ch.outlet}”`, wait: ch.outlet === 'expired' ? 'gave up waiting' : 'resumed', approval: ch.outlet, foreach: ch.n ? `fanned out to ${ch.n} items` : 'had nothing to go through', join: 'joined its branches' }[n.kind];
  if (n.kind !== 'trigger' && !(n.kind === 'action' && ch.outlet === 'failed')) ws.log.push({ cls: NEG.includes(ch.outlet) ? 'failed' : 'done', text: `${esc(n.name)} ${esc(verb)}`, w: n.kind === 'wait' && ch.outlet === 'resumed' && n.cfg.for === 'event' ? `${n.cfg.event} for this ${w.subject}` : '' });
  const edges = w.edges.filter(e => e.from === nid && e.outlet === ch.outlet);
  if (!edges.length) {
    if (NEG.includes(ch.outlet)) { ws.failed = true; ws.log.push({ cls: 'failed', text: `Nothing handles “${esc(ch.outlet)}” — the run fails` }); }

  }
  for (const e of edges) {
    ws.taken.push(e);
    if (ch.n) ws.mult[e.to] = ch.n;
    if (!ws.pending.includes(e.to) && !ws.state[e.to]) ws.pending.push(e.to);

    if (comp) ws.deferred = { edge: comp };
  }
  if (n.kind === 'join' && ws.deferred && ws.deferred.edge.to === nid) { ws.taken.push(ws.deferred.edge); ws.deferred = null; }
  if (!ws.pending.length) {
    ws.status = ws.failed ? 'failed' : 'succeeded';
    ws.log.push({ cls: ws.failed ? 'failed' : 'done', text: ws.failed ? '<b>Run failed</b>' : '<b>Run succeeded</b>', w: ws.failed ? 'Someone can look at it, fix it and resume it from the failed step.' : 'Every branch reached its end.' });
  }
}
function autoRun() {
  const w = cur(), ws = E.wsim;
  let guard = 0;
  while (ws.status === 'running' && guard++ < 50) {
    const n = w.nodes.find(x => x.id === ws.pending[0]);
    const auto = choicesFor(n).find(c => c.auto);
    if (!auto) break;
    take(n.id, auto);
  }
}

/* ---------- C# ---------- */
function hl(code) {
  return esc(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>')
    .replace(/\b(public|class|interface|protected|override|using|namespace|return|new|async|await|Task|typeof|var|void|static|record|private|readonly|switch|when|this|null|true|false)\b(?![^<]*<\/span>)/g, '<span class="kw">$1</span>');
}
function codeSM(m) {
  const T = s => pascal(s.name);
  const st = m.states.map(s => {
    const al = allowed(m, s.id).map(x => `typeof(${pascal(stateName(m.id, x))})`).join(', ');
    let body = `    protected override IImmutableList<Type> AllowedTransitions => [${al}];`;
    if (s.onEnter.length) body += `\n\n    // Runs again if Chronicle redelivers - keep it safe to repeat.\n    public override async Task<${m.model}> OnEnter(${m.model} state)\n    {\n${s.onEnter.map(r => r.kind === 'command' ? `        await Commands.Execute(new ${r.ref}(state.Id));` : `        await Workflows.Start<${pascal(workflow(r.ref)?.name || 'Workflow')}>(state.Id);`).join('\n')}\n        return state;\n    }`;
    return `public class ${T(s)} : State<${m.model}>\n{\n${body}\n}`;
  }).join('\n\n');
  const defs = definitions(m).map(d => `        .On<${d.event}>()${d.guard ? `.When(${m.model.toLowerCase()} => ${guardCode(m, d.guard)})` : ''}.TransitionTo<${pascal(stateName(m.id, d.to))}>()`).join('\n');
  const name = pascal(m.name);
  return `// Generated by Studio from the "${m.name}" state machine in Storefront.
// Built on Cratis.Orleans.Chronicle - EventSourcedStateMachine.
using System.Collections.Immutable;
using Cratis.Orleans.Chronicle.StateMachines;
using Cratis.Orleans.StateMachines;

namespace Storefront.${name};

public interface I${name} : IEventSourcedStateMachine;

public class ${name} : EventSourcedStateMachine<${m.model}>, I${name}
{
    protected override Type InitialState => typeof(${pascal(stateName(m.id, m.initial))});

    public override IImmutableList<IState<${m.model}>> CreateStates() =>
        [${m.states.map(s => `new ${T(s)}()`).join(', ')}];

    protected override void DefineTransitions(IStateMachineTransitions<${m.model}> transitions) => transitions
${defs};

    // Nothing about the current state is stored: after a restart the ${m.model} decides it.
    protected override Type ResolveState(${m.model}? model) => model?.Status switch
    {
${m.states.map(s => `        ${m.model}Status.${T(s)} => typeof(${T(s)}),`).join('\n')}
        _ => InitialState
    };
}

${st}
`;
}
function guardCode(m, g) {
  const p = `${m.model.toLowerCase()}.${g.prop}`;
  if (g.op === 'is set') return `${p} is not null`;
  if (g.op === 'is not set') return `${p} is null`;
  return `${p} ${g.op === '=' ? '==' : g.op} ${isNaN(+g.value) ? `"${g.value}"` : g.value}`;
}
function codeWF(w) {
  const name = pascal(w.name);
  const line = n => {
    const c = n.cfg, id = `"${kebab(n.name)}"`;
    switch (n.kind) {
      case 'trigger':
        if (c.on === 'state') return `        .Trigger(${id}, t => t.WhenStateMachine<I${pascal(machineName(c.machine))}>().Enters<${pascal(stateName(c.machine, c.state))}>())`;
        if (c.on === 'schedule') return `        .Trigger(${id}, t => t.OnSchedule("${c.schedule}"))`;
        if (c.on === 'manual') return `        .Trigger(${id}, t => t.Manually())`;
        return `        .Trigger(${id}, t => t.On<${c.event}>())`;
      case 'action': return `        .Action(${id}, a => a.Sends<${c.command}>().Attempts(${c.attempts}).AttemptTimeout("${c.timeout}").RetryAfter("${c.delay}"))`;
      case 'decision': return `        .Decision(${id}, d => d.When(${w.subject.toLowerCase()} => ${c.condition.replace(w.subject + '.', w.subject.toLowerCase() + '.')}).Outlets(${c.outlets.map(o => `"${o}"`).join(', ')}))`;
      case 'wait': return c.for === 'timer' ? `        .Wait(${id}, w => w.For("${c.after}"))` : `        .Wait(${id}, w => w.For<${c.event}>()${c.expires ? `.ExpiresAfter("${c.expires}")` : ''})`;
      case 'approval': return `        .Approval(${id}, a => a.By("${c.role}")${c.expires ? `.ExpiresAfter("${c.expires}")` : ''})`;
      case 'foreach': return `        .ForEach(${id}, f => f.Items(${w.subject.toLowerCase()} => ${w.subject.toLowerCase()}.${pascal(c.items)}).MaxParallelism(${c.parallel}))`;
      case 'join': return `        .Join(${id}, j => j.${c.mode === 'all' ? 'All()' : c.mode === 'any' ? 'Any()' : `AtLeast(${c.atLeast})`})`;
    }
  };
  const nd = id => w.nodes.find(n => n.id === id);
  const edges = w.edges.filter(e => nd(e.from) && nd(e.to)).map(e => `        .Connect("${kebab(nd(e.from).name)}"${e.outlet === 'next' ? '' : `, "${e.outlet}"`}).To("${kebab(nd(e.to).name)}")`).join('\n');
  return `// Generated by Studio from the "${w.name}" workflow in Storefront.
// PROPOSED API - the workflow engine is being extracted into Cratis.Orleans.
// Runs are event sourced; each action is a job step with its own retries.
using Cratis.Orleans.Workflows;

namespace Storefront.${name};

public class ${name} : Workflow<${w.subject}>
{
    protected override void Define(IWorkflowBuilder<${w.subject}> workflow) => workflow
${topo(w).map(line).join('\n')}
${edges};
}
`;
}

    case 'del-reaction': it.states.find(x => x.id === E.sel.id).onEnter.splice(+a.dataset.i, 1); refresh(true); break;
    case 'add-guard': { const t = it.transitions.find(x => x.id === E.sel.id); t.guard = { prop: DOMAIN.readModels[it.model][0], op: 'is set', value: '' }; refresh(true); break; }
    case 'del-guard': it.transitions.find(x => x.id === E.sel.id).guard = null; refresh(true); break;
    case 'cfg-set': { const n = it.nodes.find(x => x.id === E.sel.id); n.cfg[a.dataset.key] = a.dataset.val; if (a.dataset.key === 'on' && a.dataset.val === 'state') { n.cfg.machine ||= 'sm-order'; n.cfg.state ||= 'paid'; } cleanEdges(it); refresh(true); break; }
    case 'add-outlet': { const n = it.nodes.find(x => x.id === E.sel.id); n.cfg.outlets.push(`path ${n.cfg.outlets.length + 1}`); refresh(true); break; }
    case 'del-outlet': { const n = it.nodes.find(x => x.id === E.sel.id); const [o] = n.cfg.outlets.splice(+a.dataset.i, 1); it.edges = it.edges.filter(x => !(x.from === n.id && x.outlet === o)); refresh(true); break; }
    case 'del-edge': it.edges = it.edges.filter(x => !(x.from === a.dataset.from && x.outlet === a.dataset.outlet)); refresh(true); break;
    case 'sim-send': E.sim.events.push(a.dataset.event); renderGraph(); renderSMSim(); break;
    case 'sim-undo': E.sim.events.pop(); renderGraph(); renderSMSim(); break;
    case 'sim-reset': E.sim = { events: [], guards: E.sim.guards }; renderGraph(); renderSMSim(); break;
    case 'sim-save': {
      const r = run(it, E.sim.events, E.sim.guards);
      const name = ($('#specName').value || '').trim() || `${E.sim.events.join(', ')} ends in ${stateName(it.id, r.state)}`;
      const existing = it.specs.find(s => s.name === name);
      if (existing) Object.assign(existing, { given: [...E.sim.events], guards: { ...E.sim.guards }, then: r.state });
      else it.specs.push({ id: uid('sp'), name, given: [...E.sim.events], guards: { ...E.sim.guards }, then: r.state });
      E.sim.name = name; renderSide(); renderSMSim(); renderChecks(); toast(`Saved “${name}”. It re-runs every time the machine changes.`); break;
    }
    case 'run-start': startRun(); renderGraph(); renderWFSim(); break;
    case 'run-take': { const n = it.nodes.find(x => x.id === E.wsim.pending[0]); take(n.id, choicesFor(n)[+a.dataset.i]); renderGraph(); renderWFSim(); break; }
    case 'run-auto': autoRun(); renderGraph(); renderWFSim(); break;
  }
});
document.addEventListener('change', e => {
  if (!E) return;
  const t = e.target, it = cur();
  if (t.dataset.act === 'sim-guard') { E.sim.guards[t.dataset.id] = t.checked; renderGraph(); renderSMSim(); return; }
  if (t.dataset.field) { it[t.dataset.field] = t.value; refresh(true); return; }
  if (t.dataset.tfield) { const tr = it.transitions.find(x => x.id === E.sel.id); tr[t.dataset.tfield] = t.value; refresh(true); return; }
  if (t.dataset.gfield) { const tr = it.transitions.find(x => x.id === E.sel.id); tr.guard[t.dataset.gfield] = t.value; refresh(true); return; }
  if (t.dataset.ract) { const s = it.states.find(x => x.id === E.sel.id); const r = s.onEnter[+t.dataset.i]; r[t.dataset.ract] = t.value; if (t.dataset.ract === 'kind') r.ref = t.value === 'command' ? DOMAIN.commands[0] : S.workflows[0].id; refresh(true); return; }
  if (t.dataset.cfg) { const n = it.nodes.find(x => x.id === E.sel.id); n.cfg[t.dataset.cfg] = t.type === 'number' ? +t.value : t.value; if (t.dataset.cfg === 'machine') n.cfg.state = machine(t.value)?.initial; cleanEdges(it); refresh(true); return; }
});
document.addEventListener('input', e => {
  if (!E) return;
  const t = e.target, it = cur();
  if (t.dataset.field === 'name' || t.dataset.field === 'about') { it[t.dataset.field] = t.value; $('#phTitle').textContent = it.name; renderSide(); return; }
  if (t.dataset.sfield) { const s = it.states.find(x => x.id === E.sel.id); s[t.dataset.sfield] = t.value; renderGraph(); renderSide(); renderChecks(); return; }
  if (t.dataset.nfield) { const n = it.nodes.find(x => x.id === E.sel.id); n.name = t.value; renderGraph(); renderSide(); return; }
  if (t.dataset.outlet != null && t.dataset.outlet !== '') { const n = it.nodes.find(x => x.id === E.sel.id); const i = +t.dataset.outlet; const old = n.cfg.outlets[i]; n.cfg.outlets[i] = t.value; it.edges.forEach(x => { if (x.from === n.id && x.outlet === old) x.outlet = t.value; }); renderGraph(); renderChecks(); return; }
  if (t.dataset.cfg && t.tagName === 'INPUT' && t.type !== 'number') { const n = it.nodes.find(x => x.id === E.sel.id); n.cfg[t.dataset.cfg] = t.value; cleanEdges(it); renderGraph(); renderChecks(); return; }
});
function cleanEdges(w) { w.edges = w.edges.filter(e => { const n = w.nodes.find(x => x.id === e.from); return n && outletsOf(n).includes(e.outlet) && w.nodes.some(x => x.id === e.to); }); }
function deleteSelection() {
  if (!E?.sel) return;
  const it = cur(), sel = E.sel;
  if (sel.type === 'state') {
    if (it.initial === sel.id) { toast('The state it starts in cannot be removed. Start somewhere else first.'); return; }
    it.states = it.states.filter(s => s.id !== sel.id); it.transitions = it.transitions.filter(t => t.from !== sel.id && t.to !== sel.id);
    it.specs.forEach(sp => { if (sp.then === sel.id) sp.then = it.initial; });
  } else if (sel.type === 'transition') it.transitions = it.transitions.filter(t => t.id !== sel.id);
  else if (sel.type === 'node') { it.nodes = it.nodes.filter(n => n.id !== sel.id); it.edges = it.edges.filter(e => e.from !== sel.id && e.to !== sel.id); }
  E.sel = null; refresh(true);
}
document.addEventListener('keydown', e => {
  if (!E) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') { if (E.probs) { E.probs = false; renderChecks(); } else if (E.sel && !typing) select(null); else if (!typing) closeEditor(); else document.activeElement.blur(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && E.tab === 'design') { e.preventDefault(); deleteSelection(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'chatInput') toast('Agents are not part of this prototype'); });
window.addEventListener('resize', () => { if (E && (E.tab === 'design' || E.tab === 'simulate')) applyGView(); });

renderAll();
requestAnimationFrame(fitBoard);
if (location.hash.startsWith('#open=')) { const id = location.hash.slice(6); S.board = S.workflows.some(w => w.id === id) ? 'wf' : 'sm'; renderAll(); requestAnimationFrame(() => { fitBoard(); openEditor(id); }); }
</script>
